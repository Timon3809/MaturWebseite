<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PhysikSP-Zusammenfassungen | Vormatur</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
    <script src="Scripts/data.js" defer></script>
    <script src="../Scripts/zusammenfassungen.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" defer crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" defer crossorigin="anonymous"></script>
    <script src="../site-nav.js" defer></script>
    <script>
      // Formeln (LaTeX zwischen \( \) bzw. \[ \]) mit KaTeX setzen, sobald die Zusammenfassungen eingefügt sind.
      document.addEventListener("DOMContentLoaded", () => {
        if (typeof renderMathInElement !== "function") return;
        renderMathInElement(document.getElementById("summary-list"), {
          delimiters: [
            { left: "\\[", right: "\\]", display: true },
            { left: "\\(", right: "\\)", display: false }
          ],
          throwOnError: false
        });
      });
    </script>
    <style>
      /* Lange Formeln scrollen waagrecht, statt die Spalte zu sprengen (v. a. auf dem Handy). */
      .summary-text .katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" data-nav-section="physiksp" data-nav-page="summaries"></aside>

      <div class="workspace">
        <header>
          <div class="breadcrumb"><a href="../index.html">FACHÜBERSICHT</a><span class="breadcrumb-divider">/</span><a href="index.html">PHYSIKSP</a><span class="breadcrumb-divider">/</span><span>ZUSAMMENFASSUNGEN</span></div>
        </header>
        <main>
          <section class="content-view">
            <div class="page-heading">
              <h1>Zusammenfassungen</h1>
            </div>
            <div class="summary-list" id="summary-list"></div>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
