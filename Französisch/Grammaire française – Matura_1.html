 "Einleitungsverben":["In Zusammenfassungen, Kommentaren und Erzählungen.","Abwechslungsreiche Verben statt immer dire zeigen genau, wie etwas gesagt wurde (behaupten, versprechen, erklären), und verbessern deinen Stil."]},
"passif":{
 "Bildung":["Wenn das Objekt der Handlung zum Thema des Satzes werden soll.","So verschiebst du den Fokus: Wichtig ist nicht, wer handelt, sondern was geschieht."],
 "Das Passiv in allen Zeiten":["In jedem Text, der Ereignisse sachlich darstellt.","Da die Zeit nur in être steckt, musst du dessen Form erkennen, um das Passiv richtig zu verstehen und zu bilden."],
 "par oder de?":["Wenn du den Urheber nennst.","Die Präposition zeigt, ob es um eine konkrete Handlung (par) oder um einen Zustand oder ein Gefühl (de) geht."],
 "Passiv ohne Urheber":["Wenn der Handelnde unbekannt, selbstverständlich oder unwichtig ist.","Das ist der häufigste Grund für das Passiv. Im Alltag sagt man dafür oft on."],
 "Alternativen zum Passiv":["Wenn das Passiv schwerfällig klingt, besonders mündlich.","Französisch verwendet das Passiv seltener als Deutsch. on und pronominale Verben klingen oft natürlicher."]}
};
(function(){
const main = document.getElementById('main');
const side = document.getElementById('side');
const nav = document.getElementById('topicnav');
const menuBtn = document.getElementById('menuBtn');
const STORE = 'fgm-progress-v1';
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

TOPICS.forEach((t,i)=>{ t.nr = i+1; });
const TOTAL_EX = TOPICS.reduce((s,t)=>s+t.ex.length,0);
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Fortschritt (nur in diesem Browser) ---------- */
function load(){ try{ return JSON.parse(localStorage.getItem(STORE)) || {}; }catch(e){ return {}; } }
function save(id, score, total){
  try{
    const p = load(); const prev = p[id];
    if(!prev || score > prev.best){ p[id] = {best:score,total}; localStorage.setItem(STORE, JSON.stringify(p)); markNav(); }
  }catch(e){}
}

/* ---------- Korrektur ---------- */
function norm(s){
  return String(s).normalize('NFC').toLowerCase()
    .replace(/[’‘`´]/g,"'").replace(/œ/g,'oe').replace(/æ/g,'ae')
    .replace(/[«»"“”]/g,' ')
    .replace(/\s+/g,' ')
    .replace(/\s*'\s*/g,"'")
    .replace(/\s*-\s*/g,'-')
    .replace(/\s+([,.!?;:])/g,'$1')
    .replace(/[\s.!?;:,]+$/,'')
    .trim();
}
const bare = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'');

/* ---------- Navigation ---------- */
nav.innerHTML = TOPICS.map(t=>`<li><a class="navlink" href="#${t.id}" data-id="${t.id}"><span class="n">${pad(t.nr)}</span><span class="nt"><span lang="fr">${t.fr}</span><small>${t.de}</small></span></a></li>`).join('');
function markNav(){
  const p = load();
  nav.querySelectorAll('.navlink').forEach(a=>{
    const r = p[a.dataset.id]; let d = a.querySelector('.dot');
    if(r && r.best/r.total >= .8){ if(!d){ d=document.createElement('span'); d.className='dot'; d.title='Mindestens 80 % richtig'; a.appendChild(d);} }
    else if(d) d.remove();
  });
}
menuBtn.addEventListener('click',()=>{
  const open = side.classList.toggle('open');
  menuBtn.setAttribute('aria-expanded', open);
  menuBtn.textContent = open ? 'Schliessen' : 'Themen';
});

function setActive(id){
  document.querySelectorAll('.navlink').forEach(a=>a.classList.toggle('active', a.dataset.id===id));
  side.classList.remove('open'); menuBtn.setAttribute('aria-expanded','false'); menuBtn.textContent='Themen';
}

/* ---------- Startseite ---------- */
function renderHome(){
  const p = load();
  const done = TOPICS.filter(t=>p[t.id]).length;
  main.innerHTML = `<div class="wrap">
  <section class="hero">
    <p class="eyebrow">Französisch · Schweizer Matura</p>
    <h1 lang="fr">Grammaire française</h1>
    <p class="lead">Alle Grammatikthemen, die du für die Maturprüfung brauchst: auf Deutsch erklärt, mit französischen Beispielen und Übungen, die sofort korrigiert werden.</p>
    <div class="hero-actions">
      <a class="btn" href="#${TOPICS[0].id}">Mit Thema 1 beginnen</a>
      <a class="btn ghost" href="#test">Gemischter Test</a>
    </div>
    <div class="hero-stats">
      <div><b>${TOPICS.length}</b><span>Themen</span></div>
      <div><b>${TOTAL_EX}</b><span>Übungen mit Lösung</span></div>
      <div><b>${done}</b><span>Themen schon geübt</span></div>
    </div>
  </section>
  <section class="howto" aria-label="So funktioniert es">
    <div><b>1 · Lesen</b><p>Jede Regel auf Deutsch, jedes Beispiel auf Französisch mit Übersetzung.</p></div>
    <div><b>2 · Üben</b><p>Lücke ausfüllen und mit Enter prüfen oder Antwort anklicken.</p></div>
    <div><b>3 · Kontrollieren</b><p>Sofortige Korrektur mit Erklärung. Akzente zählen, die Sonderzeichen-Tasten helfen.</p></div>
  </section>
  <h2 class="sec-title">Die Themen</h2>
  <div class="grid">${TOPICS.map(t=>{
    const r = p[t.id];
    const prog = r
      ? `<div class="meter" aria-hidden="true"><span style="width:${Math.round(r.best/r.total*100)}%"></span></div><p class="meta">Bestes Resultat: ${r.best} / ${r.total}</p>`
      : `<p class="meta fresh">${t.ex.length} Übungen · noch nicht geübt</p>`;
    return `<a class="card" href="#${t.id}"><span class="num">${pad(t.nr)}</span><h3 lang="fr">${t.fr}</h3><p class="de">${t.de}</p><ul class="chips">${t.chips.map(c=>`<li>${c}</li>`).join('')}</ul>${prog}</a>`;
  }).join('')}</div>
  </div>`;
}

/* ---------- Themenseite ---------- */
function renderTopic(t){
  const i = TOPICS.indexOf(t), prev = TOPICS[i-1], next = TOPICS[i+1];
  main.innerHTML = `<article class="wrap">
    <header class="t-head">
      <p class="t-nr">Thema ${pad(t.nr)} von ${TOPICS.length}</p>
      <h1 lang="fr">${t.fr}</h1>
      <p class="t-de">${t.de}</p>
      <p class="lead">${t.intro}</p>
      ${WHY[t.id]?`<div class="why-box"><p class="why-t">Wann brauchst du das?</p><ul>${WHY[t.id].map(w=>`<li>${w}</li>`).join('')}</ul></div>`:''}
      <nav class="toc" aria-label="Inhalt dieser Seite"></nav>
    </header>
    <div class="prose">${t.html}</div>
    <section class="ex-sec" id="uebungen">
      <h2>Übungen</h2>
      <p class="hint">${t.ex.length} Aufgaben. Schreib deine Antwort und drück <b>Enter</b> oder <b>Prüfen</b>. Bei Auswahlaufgaben wird sofort korrigiert.</p>
      <div id="exwrap"></div>
    </section>
    <nav class="pager" aria-label="Weitere Themen">
      ${prev?`<a class="prev" href="#${prev.id}"><small>← Vorheriges Thema</small><span lang="fr">${prev.fr}</span></a>`:''}
      ${next?`<a class="next" href="#${next.id}"><small>Nächstes Thema →</small><span lang="fr">${next.fr}</span></a>`:`<a class="next" href="#test"><small>Alles geschafft? →</small><span>Gemischter Test</span></a>`}
    </nav>
  </article>`;
  const toc = main.querySelector('.toc');
  const wz = WOZU[t.id] || {};
  main.querySelectorAll('.prose h2[data-toc]').forEach((h,k)=>{
    h.id = 'sec-'+k;
    const w = wz[h.textContent.trim()];
    if(w){
      const d = document.createElement('div'); d.className = 'wozu';
      d.innerHTML = `<p><span class="wz-l">Wann?</span><span>${w[0]}</span></p><p><span class="wz-l">Wozu?</span><span>${w[1]}</span></p>`;
      h.after(d);
    }
    const b = document.createElement('button'); b.type='button'; b.textContent = h.textContent;
    b.addEventListener('click',()=>h.scrollIntoView({behavior:reduce?'auto':'smooth'}));
    toc.appendChild(b);
  });
  const bx = document.createElement('button'); bx.type='button'; bx.className='toc-ex'; bx.textContent='Zu den Übungen ↓';
  bx.addEventListener('click',()=>document.getElementById('uebungen').scrollIntoView({behavior:reduce?'auto':'smooth'}));
  toc.appendChild(bx);
  mountExercises(document.getElementById('exwrap'), t.ex.map(e=>Object.assign({},e)), t.id, true);
}

/* ---------- Gemischter Test ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function renderTest(){
  const pool = [];
  TOPICS.forEach(t=>t.ex.forEach(e=>pool.push(Object.assign({topic:t},e))));
  const items = shuffle(pool).slice(0,15);
  main.innerHTML = `<div class="wrap">
    <header class="t-head">
      <p class="t-nr">Training</p>
      <h1>Gemischter Test</h1>
      <p class="t-de">15 zufällige Aufgaben aus allen ${TOPICS.length} Themen</p>
      <p class="lead">Wie an der Prüfung: Die Themen sind durchmischt. Bei jeder Aufgabe siehst du, aus welchem Kapitel sie stammt, und kannst dort die Regel nachlesen.</p>
      <div class="hero-actions"><button class="btn" type="button" id="newTest">Neuen Test erstellen</button></div>
    </header>
    <section class="ex-sec" style="margin-top:28px"><div id="exwrap"></div></section>
  </div>`;
  document.getElementById('newTest').addEventListener('click',()=>{ renderTest(); window.scrollTo(0,0); });
  mountExercises(document.getElementById('exwrap'), items, 'test', false);
}

/* ---------- Übungs-Engine ---------- */
const KEYS = 'é è ê ë à â ç î ï ô û ù œ'.split(' ');
function mountExercises(wrap, items, key, persist){
  const n = items.length;
  const state = new Array(n).fill(null);
  let lastInput = null;

  wrap.innerHTML = `<div class="ex-bar">
      <div class="score" aria-live="polite"><strong class="sc">0</strong> von ${n} richtig</div>
      <div class="keys" role="group" aria-label="Sonderzeichen einfügen">${KEYS.map(c=>`<button type="button" class="key" data-c="${c}" title="${c} einfügen">${c}</button>`).join('')}</div>
      <div class="bar-actions">
        <button type="button" class="btn sm" data-act="checkall">Alle prüfen</button>
        <button type="button" class="btn sm ghost" data-act="showall">Alle Lösungen</button>
        <button type="button" class="btn sm ghost" data-act="reset">Neu starten</button>
      </div>
    </div>
    <ol class="ex-list">${items.map((it,i)=>itemHtml(it,i,key)).join('')}</ol>
    <div class="result" aria-live="polite"></div>`;

  const lis = wrap.querySelectorAll('.ex-item');
  const scEl = wrap.querySelector('.sc');
  const resEl = wrap.querySelector('.result');

  function solution(it){ return it.t==='mc' ? it.o[it.c] : it.a[0]; }
  function feedback(kind, it){
    const head = {ok:'Richtig!', near:'Fast richtig: Prüfe die Akzente.', bad:'Leider falsch.', shown:'Lösung:'}[kind];
    const sol = kind==='ok' ? '' : (kind==='shown' ? ` <span class="sol"><b lang="fr">${esc(solution(it))}</b></span>` : ` <span class="sol">Richtig ist: <b lang="fr">${esc(solution(it))}</b></span>`);
    const alt = (kind!=='ok' && it.a && it.a.length>1) ? `<span class="alt">Ebenfalls richtig: <span lang="fr">${it.a.slice(1).map(esc).join(' · ')}</span></span>` : '';
    return `<p><strong>${head}</strong>${sol}</p>${alt}${it.h?`<p class="why">${it.h}</p>`:''}`;
  }
  function setState(i, kind){
    state[i] = kind;
    const li = lis[i];
    li.classList.remove('is-ok','is-bad','is-near','is-shown');
    const fb = li.querySelector('.fb');
    fb.className = 'fb';
    if(kind){ li.classList.add('is-'+kind); fb.classList.add(kind==='shown'?'shown':kind); fb.innerHTML = feedback(kind, items[i]); }
    else fb.innerHTML = '';
    update();
  }
  function update(){
    const ok = state.filter(s=>s==='ok').length;
    scEl.textContent = ok;
    if(persist) save(key, ok, n);
    const doneAll = state.every(s=>s!==null);
    if(doneAll){
      const pct = Math.round(ok/n*100);
      const msg = pct>=90 ? 'Ausgezeichnet, dieses Thema sitzt.' : pct>=70 ? 'Gut gemacht. Schau dir die roten Aufgaben noch einmal an.' : pct>=50 ? 'Halb geschafft. Lies die Regeln oben nochmals und starte neu.' : 'Lies die Erklärungen oben in Ruhe durch und versuche es dann noch einmal.';
      resEl.innerHTML = `<p style="margin:0"><strong style="font-family:var(--f-display);font-size:1.3rem">${ok} von ${n} richtig (${pct} %)</strong></p><p style="margin:4px 0 0">${msg}</p>`;
    } else resEl.innerHTML = '';
  }
  function check(i, silentEmpty){
    const it = items[i];
    if(it.t==='mc' || state[i]==='shown') return;
    const inp = lis[i].querySelector('input');
    const v = inp.value;
    if(!v.trim()){
      if(!silentEmpty){ const fb = lis[i].querySelector('.fb'); fb.className='fb'; fb.innerHTML='<p>Schreib zuerst eine Antwort in das Feld.</p>'; }
      return;
    }
    const nv = norm(v);
    const answers = it.a.map(norm);
    if(answers.includes(nv)) setState(i,'ok');
    else if(answers.some(a=>bare(a)===bare(nv))) setState(i,'near');
    else setState(i,'bad');
  }
  function show(i){
    const it = items[i];
    if(state[i]==='ok') return;
    if(it.t==='mc'){ revealMc(i, null); setState(i,'shown'); return; }
    const inp = lis[i].querySelector('input');
    inp.value = it.a[0];
    setState(i,'shown');
  }
  function revealMc(i, chosen){
    const it = items[i];
    lis[i].querySelectorAll('.opt').forEach(b=>{
      const j = +b.dataset.j; b.disabled = true;
      if(j===it.c) b.classList.add('right');
      else if(j===chosen) b.classList.add('wrong');
    });
  }

  wrap.addEventListener('click', e=>{
    const k = e.target.closest('.key');
    if(k){
      const target = lastInput && document.body.contains(lastInput) ? lastInput : wrap.querySelector('.ex-item input:not([disabled])');
      if(!target) return;
      const s = target.selectionStart ?? target.value.length, en = target.selectionEnd ?? target.value.length;
      target.value = target.value.slice(0,s) + k.dataset.c + target.value.slice(en);
      target.focus(); target.setSelectionRange(s+1,s+1);
      target.dispatchEvent(new Event('input',{bubbles:true}));
      return;
    }
    const act = e.target.closest('[data-act]');
    if(act){
      const a = act.dataset.act;
      if(a==='checkall'){
        items.forEach((it,i)=>check(i,true));
        const firstOpen = [...lis].find((li,i)=>state[i]===null);
        if(firstOpen){ const f = firstOpen.querySelector('input,.opt'); if(f) f.focus({preventScroll:false}); }
      }
      else if(a==='showall') items.forEach((it,i)=>{ if(state[i]!=='ok') show(i); });
      else if(a==='reset'){ mountExercises(wrap, items, key, persist); }
      return;
    }
    const li = e.target.closest('.ex-item'); if(!li) return;
    const i = +li.dataset.i;
    const opt = e.target.closest('.opt');
    if(opt && !opt.disabled){
      const j = +opt.dataset.j;
      revealMc(i, j);
      setState(i, j===items[i].c ? 'ok' : 'bad');
      return;
    }
    if(e.target.closest('.do-check')) check(i,false);
    else if(e.target.closest('.do-show')) show(i);
  });
  wrap.addEventListener('mousedown', e=>{ if(e.target.closest('.key')) e.preventDefault(); });
  wrap.addEventListener('focusin', e=>{ if(e.target.matches('.ex-item input')) lastInput = e.target; });
  wrap.addEventListener('keydown', e=>{
    if(e.key==='Enter' && e.target.matches('.ex-item input')){
      e.preventDefault();
      const i = +e.target.closest('.ex-item').dataset.i;
      check(i,false);
      if(state[i]==='ok'){
        const nxt = [...lis].slice(i+1).find((li,k)=>state[i+1+k]===null);
        if(nxt){ const f = nxt.querySelector('input'); if(f) f.focus(); }
      }
    }
  });
  wrap.addEventListener('input', e=>{
    if(!e.target.matches('.ex-item input')) return;
    const i = +e.target.closest('.ex-item').dataset.i;
    if(state[i] && state[i]!=='shown') setState(i,null);
    else if(!state[i]){ const fb = lis[i].querySelector('.fb'); fb.className='fb'; fb.innerHTML=''; }
  });
}

function itemHtml(it, i, key){
  const id = `in-${key}-${i}`;
  const tag = it.topic ? `<a class="ex-tag" href="#${it.topic.id}" lang="fr">${pad(it.topic.nr)} · ${it.topic.fr}</a><br>` : '';
  const ctl = `<div class="ex-ctl"><button type="button" class="btn sm do-check">Prüfen</button><button type="button" class="btn sm ghost do-show">Lösung zeigen</button></div>`;
  let body = '';
  if(it.t==='fill'){
    const parts = it.q.split('___');
    const w = Math.min(28, Math.max(...it.a.map(s=>s.length)) + 3);
    body = `<p class="ex-q" lang="fr">${parts[0]}<input id="${id}" class="blank" style="width:${w}ch" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Lücke in Aufgabe ${i+1}">${parts[1]||''}</p>${ctl}`;
  } else if(it.t==='tr'){
    body = `<p class="ex-instr">${it.q}</p><p class="ex-src" lang="fr">${it.s}</p><input id="${id}" class="line" type="text" lang="fr" autocomplete="off" autocapitalize="sentences" autocorrect="off" spellcheck="false" aria-label="Antwort zu Aufgabe ${i+1}" placeholder="Deine Lösung …">${ctl}`;
  } else {
    body = `<p class="ex-q" lang="fr">${it.q.replace('___','<span class="gap">___</span>')}</p><div class="opts" role="group" aria-label="Antwortmöglichkeiten">${it.o.map((o,j)=>`<button type="button" class="opt" data-j="${j}" lang="fr">${o}</button>`).join('')}</div>`;
  }
  return `<li class="ex-item" data-i="${i}">${tag}${body}<div class="fb" aria-live="polite"></div></li>`;
}

/* ---------- Router ---------- */
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  const t = TOPICS.find(x=>x.id===h);
  if(t){ renderTopic(t); setActive(t.id); document.title = t.fr + ' – Grammaire française'; }
  else if(h==='test'){ renderTest(); setActive('test'); document.title = 'Gemischter Test – Grammaire française'; }
  else { renderHome(); setActive('start'); document.title = 'Grammaire française – Matura'; }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
markNav();
route();
})();
</script>
