<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammaire française – Matura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: feste Themenleiste links, Lesespalte rechts (~70 Zeichen), Übungen als nummeriertes Arbeitsblatt */
  --paper:#f3f5fa; --surface:#ffffff; --ink:#151c33; --muted:#566079; --line:#d9dfec;
  --accent:#2443b0; --accent-ink:#ffffff; --accent-soft:#e6ebfa;
  --mark:#ffe27a;
  --ok:#17744a; --ok-soft:#e1f2e8; --bad:#b8312a; --bad-soft:#fbe5e2; --near:#875a00; --near-soft:#fff0c7;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --stick-top:0px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10131d; --surface:#171b29; --ink:#e7eaf4; --muted:#a0a8c2; --line:#2a3047;
    --accent:#8fa8ff; --accent-ink:#0f1530; --accent-soft:#1e2646;
    --mark:#5c4a12;
    --ok:#62d29a; --ok-soft:#13301f; --bad:#ff8f84; --bad-soft:#3b1a17; --near:#f1c35a; --near-soft:#3a2e0f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10131d; --surface:#171b29; --ink:#e7eaf4; --muted:#a0a8c2; --line:#2a3047;
  --accent:#8fa8ff; --accent-ink:#0f1530; --accent-soft:#1e2646;
  --mark:#5c4a12;
  --ok:#62d29a; --ok-soft:#13301f; --bad:#ff8f84; --bad-soft:#3b1a17; --near:#f1c35a; --near-soft:#3a2e0f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);font-weight:650;line-height:1.15;text-wrap:balance;margin:0}
small{font-size:.8em}

/* ---------- App-Gerüst ---------- */
.app{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 32px}
.brand{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink);padding:2px 8px 18px}
.brand-mark{flex:none;width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:650;font-size:19px;letter-spacing:-.02em}
.brand-t{font-family:var(--f-display);font-weight:650;font-size:1.05rem;line-height:1.15}
.brand-t small{display:block;font-family:var(--f-body);font-weight:400;font-size:.78rem;color:var(--muted);margin-top:2px}
.nav-label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:12px 10px 6px;margin:0}
.topicnav{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.navlink{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink)}
.navlink:hover{background:var(--accent-soft)}
.navlink.active{background:var(--accent);color:var(--accent-ink)}
.navlink .n{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);padding-top:3px;min-width:1.7em}
.navlink.active .n,.navlink.active small{color:inherit;opacity:.85}
.navlink .nt{display:flex;flex-direction:column;line-height:1.25;font-size:.94rem}
.navlink small{color:var(--muted);font-size:.78rem}
.navlink .dot{margin-left:auto;align-self:center;width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.topbar{display:none}
.main{min-width:0;padding:44px clamp(16px,5vw,64px) 90px}
.wrap{max-width:820px;margin:0 auto}

/* ---------- Startseite ---------- */
.eyebrow{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 10px}
.hero h1{font-size:clamp(2.3rem,5.4vw,3.6rem);letter-spacing:-.02em}
.hero .lead{font-size:1.15rem;max-width:58ch;color:var(--muted);margin:14px 0 22px}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hero-stats{display:flex;flex-wrap:wrap;gap:22px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.hero-stats div{display:flex;flex-direction:column}
.hero-stats b{font-family:var(--f-display);font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.hero-stats span{font-size:.85rem;color:var(--muted)}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:34px 0 8px}
.howto div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.howto b{display:block;font-family:var(--f-mono);font-size:.78rem;color:var(--accent);margin-bottom:2px}
.howto p{margin:0;font-size:.93rem}
.sec-title{font-size:1.5rem;margin:40px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px 14px;text-decoration:none;color:var(--ink);transition:border-color .15s, transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card .num{font-family:var(--f-mono);font-size:.8rem;color:var(--accent)}
.card h3{font-size:1.18rem}
.card .de{font-size:.9rem;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 2px;padding:0;list-style:none}
.chips li{font-size:.74rem;background:var(--accent-soft);color:var(--ink);padding:2px 8px;border-radius:999px}
.meter{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:auto}
.meter span{display:block;height:100%;background:var(--ok);border-radius:99px}
.card .meta{font-size:.8rem;color:var(--muted);margin:4px 0 0;font-variant-numeric:tabular-nums}
.card .meta.fresh{margin-top:auto}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:9px;font-weight:700;text-decoration:none;cursor:pointer;font-size:.95rem;line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft);filter:none}
.btn.sm{padding:6px 11px;font-size:.85rem;border-radius:8px}

/* ---------- Themenseite ---------- */
.t-head{padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:8px}
.t-nr{font-family:var(--f-mono);font-size:.82rem;color:var(--accent);margin:0 0 8px}
.t-head h1{font-size:clamp(2rem,4.6vw,3rem);letter-spacing:-.015em}
.t-de{font-size:1.15rem;color:var(--muted);margin:6px 0 14px}
.t-head .lead{max-width:68ch;margin:0 0 18px}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.84rem;cursor:pointer;color:var(--ink)}
.toc button:hover{border-color:var(--accent);color:var(--accent)}
.toc button.toc-ex{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.prose h2{font-size:1.5rem;margin:42px 0 12px;scroll-margin-top:calc(var(--stick-top) + 16px)}
.why-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px 10px;margin:0 0 18px;max-width:72ch}
.why-t{font-family:var(--f-display);font-weight:650;font-size:1.1rem;margin:0 0 6px}
.why-box ul{margin:0;padding-left:1.15em}
.why-box li{margin:0 0 6px}
.why-box li::marker{color:var(--accent)}
.wozu{display:grid;gap:6px;background:var(--accent-soft);border-radius:10px;padding:11px 15px;margin:0 0 16px;max-width:72ch;font-size:.95rem}
.wozu p{margin:0;display:grid;grid-template-columns:4.6em 1fr;gap:8px;align-items:baseline}
.wz-l{font-family:var(--f-mono);font-size:.78rem;font-weight:500;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.prose p,.prose ol,.prose ul:not(.ex):not(.list){max-width:68ch}
.prose ol{padding-left:1.3em}
.prose li{margin:3px 0}
.prose b{font-weight:700}

.tbl{overflow-x:auto;margin:14px 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:.93rem}
.tbl th{background:var(--accent-soft);text-align:left;font-weight:700;padding:9px 12px;vertical-align:bottom;border-bottom:1px solid var(--line)}
.tbl th small{font-weight:400;color:var(--muted)}
.tbl td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
.tbl tr:first-child td{border-top:0}
.tbl td small{color:var(--muted)}
.tbl.conj td:first-child{color:var(--muted);white-space:nowrap}
.tbl.conj td:not(:first-child){font-family:var(--f-mono);font-size:.88rem}
.tbl.conj{max-width:max-content;max-width:100%}

.ex{list-style:none;margin:14px 0 18px;padding:0;display:grid;gap:8px}
.ex li{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:9px 14px}
.ex .fr{display:block;font-size:1.03rem}
.ex .de{display:block;font-size:.88rem;color:var(--muted);font-style:italic;margin-top:2px}
.fr b,.tbl b,.list b,[lang="fr"] b{background:linear-gradient(transparent 56%, var(--mark) 56%);padding:0 1px}

.list{list-style:none;margin:12px 0 18px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:6px}
.list li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:.92rem}

.box{border-radius:10px;padding:12px 16px;margin:16px 0;border:1px solid var(--line);border-left:5px solid var(--accent);background:var(--surface)}
.box p{margin:6px 0}
.box .ex{margin:8px 0 4px}
.box-t{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;margin:0 0 4px !important;color:var(--accent)}
.box-warn{border-left-color:var(--bad)} .box-warn .box-t{color:var(--bad)}
.box-tip{border-left-color:var(--near)} .box-tip .box-t{color:var(--near)}

.order{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:14px 0;font-family:var(--f-mono);font-size:.92rem}
.order span{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;line-height:1.45;text-align:center}
.order i{font-style:normal;color:var(--muted)}

/* ---------- Übungen ---------- */
.ex-sec{margin-top:54px;scroll-margin-top:calc(var(--stick-top) + 12px)}
.ex-sec > h2{font-size:1.7rem;margin:0 0 6px}
.ex-sec > .hint{color:var(--muted);margin:0 0 14px;max-width:68ch}
.ex-bar{position:sticky;top:var(--stick-top);z-index:5;background:var(--paper);padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.score{font-variant-numeric:tabular-nums;font-size:.95rem;white-space:nowrap}
.score strong{font-family:var(--f-display);font-size:1.35rem}
.keys{display:flex;flex-wrap:wrap;gap:3px}
.key{width:30px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;font-size:.95rem;padding:0}
.key:hover{border-color:var(--accent);color:var(--accent)}
.bar-actions{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.ex-list{list-style:none;counter-reset:ex;margin:0;padding:0}
.ex-item{counter-increment:ex;position:relative;padding:16px 0 16px 46px;border-bottom:1px solid var(--line)}
.ex-item::before{content:counter(ex);position:absolute;left:0;top:16px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.82rem;background:var(--accent-soft);color:var(--accent)}
.ex-item.is-ok::before{content:"✓";background:var(--ok);color:var(--surface)}
.ex-item.is-bad::before{content:"✗";background:var(--bad);color:var(--surface)}
.ex-item.is-near::before{content:"~";background:var(--near);color:var(--surface)}
.ex-item.is-shown::before{background:var(--line);color:var(--muted)}
.ex-tag{display:inline-block;font-size:.74rem;text-decoration:none;background:var(--accent-soft);padding:1px 8px;border-radius:99px;margin-bottom:6px}
.ex-q{margin:0;font-size:1.06rem;line-height:2}
.ex-instr{margin:0;font-size:.92rem;color:var(--muted)}
.ex-src{margin:2px 0 8px;font-size:1.06rem}
.blank{font:inherit;color:var(--ink);background:var(--accent-soft);border:0;border-bottom:2px solid var(--accent);border-radius:4px 4px 0 0;padding:1px 6px;min-width:5ch;max-width:100%}
.line{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 11px;width:100%}
.line:focus,.blank:focus{outline:2px solid var(--accent);outline-offset:1px}
.is-ok .blank,.is-ok .line{border-color:var(--ok);background:var(--ok-soft)}
.is-bad .blank,.is-bad .line{border-color:var(--bad);background:var(--bad-soft)}
.is-near .blank,.is-near .line{border-color:var(--near);background:var(--near-soft)}
.ex-ctl{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.gap{font-family:var(--f-mono);color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 13px;cursor:pointer;text-align:left;font-size:.98rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);text-decoration:line-through}
.fb:empty{display:none}
.fb{margin-top:10px;border-radius:9px;padding:9px 13px;font-size:.94rem;background:var(--accent-soft)}
.fb p{margin:2px 0}
.fb .why{color:var(--ink)}
.fb.ok{background:var(--ok-soft)} .fb.ok strong{color:var(--ok)}
.fb.bad{background:var(--bad-soft)} .fb.bad strong{color:var(--bad)}
.fb.near{background:var(--near-soft)} .fb.near strong{color:var(--near)}
.fb .sol b{background:none;padding:0}
.fb .alt{display:block;font-size:.85rem;color:var(--muted)}
/* Fehleranalyse */
.fb del,.fb ins,.w-bad del,.w-good ins{text-decoration:none;border-radius:3px;padding:0 1px}
.w-bad del{background:var(--bad);color:var(--surface)}
.w-good ins{background:var(--ok);color:var(--surface)}
.w-bad{color:var(--bad);font-weight:700}
.w-good{color:var(--ok);font-weight:700}
.w-extra{text-decoration:line-through}
.w-move{text-decoration:underline wavy;text-underline-offset:3px}
.w-gap{color:var(--bad);font-weight:700}
.issues{list-style:none;margin:6px 0 4px;padding:0;display:grid;gap:4px}
.issues li{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.ik{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;padding:1px 7px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.ik-ending,.ik-word{color:var(--bad);border-color:var(--bad)}
.ik-accent,.ik-typo,.ik-elision{color:var(--near);border-color:var(--near)}
.cmp{margin:8px 0 4px;display:grid;gap:3px}
.cmp p{display:grid;grid-template-columns:8.5em 1fr;gap:8px;margin:0;align-items:baseline}
.cl{font-size:.78rem;color:var(--muted)}
.fb .alt{font-size:.85rem;color:var(--muted)}
.rule{margin-top:6px}
.rule summary{cursor:pointer;font-size:.86rem;color:var(--accent);font-weight:700}
.rule p{margin:4px 0 0}
.muted{color:var(--muted)} .small{font-size:.85rem}
.fb.shown{background:var(--accent-soft)}
.card-train{border-style:dashed}
.card-train .num{font-family:var(--f-mono)}

/* Verben */
.tr-settings{display:grid;gap:10px;margin:6px 0 16px}
.tr-settings fieldset{border:0;padding:0;margin:0}
.tr-settings legend{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{position:relative;display:inline-flex;cursor:pointer}
.tchip[hidden]{display:none}
.tchip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.tchip span{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.86rem}
.tchip input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.tchip input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.tr-card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:18px 20px;display:grid;gap:10px}
.tr-card.is-ok{border-left-color:var(--ok)} .tr-card.is-bad{border-left-color:var(--bad)} .tr-card.is-near{border-left-color:var(--near)}
.tr-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;font-size:.88rem}
.tr-tense{font-family:var(--f-mono);color:var(--accent);font-weight:500}
.tr-stats{color:var(--muted);font-variant-numeric:tabular-nums}
.tr-verb{margin:0;font-family:var(--f-display);font-size:1.7rem;font-weight:650;line-height:1.2}
.tr-verb small{font-family:var(--f-body);font-weight:400;font-size:1rem;color:var(--muted)}
.tr-line{display:flex;gap:10px;align-items:center}
.tr-pron{font-size:1.1rem;white-space:nowrap;color:var(--muted)}
.tr-line .line{max-width:320px}
.tr-card .fb{margin-top:0}
.vsearch{display:grid;gap:4px;max-width:360px;margin-bottom:12px}
.vsearch label{font-size:.85rem;color:var(--muted)}
.vchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.vchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 11px;cursor:pointer;font-size:.95rem;line-height:1.2}
.vchip small{font-size:.72rem;color:var(--muted)}
.vchip.top{border-left:4px solid var(--accent)}
.vchip:hover{border-color:var(--accent)}
.vchip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vchip.active small{color:inherit;opacity:.85}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;scroll-margin-top:calc(var(--stick-top) + 12px)}
.vhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px}
.vhead h3{font-size:1.8rem}
.vhead .de{margin:2px 0 0;color:var(--muted)}
.facts{list-style:none;padding:0;margin:14px 0;display:flex;flex-wrap:wrap;gap:6px}
.facts li{background:var(--accent-soft);border-radius:8px;padding:4px 10px;font-size:.92rem}
.facts span{display:block;font-family:var(--f-body);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.ctab{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper)}
.ctab h4{margin:0 0 6px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-family:var(--f-body)}
.ctab ul{list-style:none;margin:0;padding:0;font-size:.93rem;line-height:1.55}
.ctab .pr{color:var(--muted);font-size:.8rem}
#vpanel{scroll-margin-top:calc(var(--stick-top) + 12px)}
.result{margin-top:18px;padding:16px 18px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.result:empty{display:none}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:48px}
.pager a{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;color:var(--ink)}
.pager a:hover{border-color:var(--accent)}

  .side .brand{display:none}
  .main{padding-top:28px}

}

  body{font-size:16px}

      <p class="nav-label">Training</p>
      <a class="navlink" href="#verbes" data-id="verbes"><span class="n">≡</span><span class="nt">Unregelmässige Verben<small>Tabellen und Verb-Trainer</small></span></a>
      <a class="navlink" href="#test" data-id="test"><span class="n">✎</span><span class="nt">Gemischter Test<small>15 Aufgaben aus allen Themen</small></span></a>
    </nav>

  <main class="main" id="main"></main>
</div>
<script>
/* ---------- Inhalts-Helfer ---------- */
const TOPICS = [];
let __h = 0;
function H(t){ return `<h2 data-toc>${t}</h2>`; }
function EX(rows){ return `<ul class="ex">${rows.map(([fr,de])=>`<li><span class="fr" lang="fr">${fr}</span>${de?`<span class="de">${de}</span>`:''}</li>`).join('')}</ul>`; }
function BOX(kind,title,html){ return `<div class="box box-${kind}"><p class="box-t">${title}</p>${html}</div>`; }
function TBL(head,rows,cls){ return `<div class="tbl ${cls||''}"><table><thead><tr>${head.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; }
function LIST(items){ return `<ul class="list" lang="fr">${items.map(i=>`<li>${i}</li>`).join('')}</ul>`; }
</script>
<script>
/* ===== Thema 1: Les temps du passé ===== */
TOPICS.push({
id:"temps-du-passe", fr:"Les temps du passé", de:"Die Vergangenheitszeiten",
chips:["Passé composé","Imparfait","Plus-que-parfait","Passé simple","Accord du participe"],
intro:"Im Französischen erzählst du mit mehreren Zeiten gleichzeitig: Das <i>passé composé</i> treibt die Handlung voran, das <i>imparfait</i> malt den Hintergrund, das <i>plus-que-parfait</i> blickt noch weiter zurück. Das <i>passé simple</i> musst du in literarischen Texten erkennen.",
html:`
${H("Passé composé: Bildung")}
<p>Hilfsverb <b>avoir</b> oder <b>être</b> im Präsens + <b>participe passé</b> (Partizip Perfekt).</p>
${TBL(["Verbgruppe","Participe passé","Beispiel"],[
["-er","-é","parler → j'ai parl<b>é</b>"],
["-ir (wie finir)","-i","finir → j'ai fin<b>i</b>"],
["-re (wie vendre)","-u","vendre → j'ai vend<b>u</b>"]])}
<p>Die wichtigsten unregelmässigen Partizipien:</p>
${LIST(["avoir → eu","être → été","faire → fait","prendre → pris","mettre → mis","dire → dit","écrire → écrit","voir → vu","venir → venu","lire → lu","boire → bu","pouvoir → pu","vouloir → voulu","devoir → dû","savoir → su","ouvrir → ouvert","naître → né","mourir → mort","recevoir → reçu","vivre → vécu","croire → cru","connaître → connu","falloir → fallu","pleuvoir → plu"])}

${H("Avoir oder être?")}
<p>Die meisten Verben bilden das <i>passé composé</i> mit <b>avoir</b>. Mit <b>être</b> stehen:</p>
<ol>
<li>Verben der Bewegung und Zustandsveränderung: aller, venir, arriver, partir, entrer, sortir, monter, descendre, naître, mourir, rester, tomber, retourner, passer und ihre Ableitungen (revenir, devenir, rentrer …).</li>
<li>Alle reflexiven (pronominalen) Verben: se lever, se souvenir, s'amuser …</li>
</ol>
${BOX("tip","Eselsbrücke","<p><b>DR &amp; MRS VANDERTRAMP</b>: <b>D</b>evenir, <b>R</b>evenir, <b>M</b>onter, <b>R</b>ester, <b>S</b>ortir, <b>V</b>enir, <b>A</b>ller, <b>N</b>aître, <b>D</b>escendre, <b>E</b>ntrer, <b>R</b>entrer, <b>T</b>omber, <b>R</b>etourner, <b>A</b>rriver, <b>M</b>ourir, <b>P</b>artir.</p>")}
${BOX("warn","Achtung","<p><i>monter, descendre, sortir, rentrer, passer, retourner</i> nehmen <b>avoir</b>, wenn sie ein direktes Objekt haben.</p>"+EX([["Elle <b>est sortie</b>.","Sie ist hinausgegangen."],["Elle <b>a sorti</b> le chien.","Sie hat den Hund ausgeführt."],["Il <b>a monté</b> les valises.","Er hat die Koffer hinaufgetragen."]]))}

${H("Accord du participe passé")}
<p>Das Partizip wird wie ein Adjektiv angeglichen (+e für feminin, +s für Plural). Wann?</p>
${TBL(["Fall","Regel","Beispiel"],[
["mit <b>être</b>","Angleichung an das <b>Subjekt</b>","Elles sont part<b>ies</b>."],
["mit <b>avoir</b>","<b>keine</b> Angleichung …","Elle a mang<b>é</b> une pomme."],
["… ausser: direktes Objekt (COD) steht <b>vor</b> dem Verb","Angleichung an das COD","La pomme qu'elle a mang<b>ée</b>. / Je <b>les</b> ai v<b>us</b>."],
["reflexive Verben","Angleichung, wenn das Reflexivpronomen COD ist","Elle s'est lav<b>ée</b>."],
["reflexiv, COD steht danach","keine Angleichung","Elle s'est lav<b>é</b> les mains."],
["reflexiv mit indirektem Objekt (parler <b>à</b>, téléphoner <b>à</b>)","keine Angleichung","Ils se sont parl<b>é</b>."]])}
${BOX("rule","Merke","<p>Bei <b>en</b> gibt es keine Angleichung: <span lang=\"fr\">Des pommes ? J'en ai mangé.</span></p>")}

${H("Imparfait: Bildung")}
<p>Stamm der 1. Person Plural Präsens (<span lang="fr">nous <b>parl</b>ons</span>) + Endungen <b>-ais, -ais, -ait, -ions, -iez, -aient</b>. Die einzige Ausnahme ist <b>être → ét-</b>.</p>
${TBL(["","parler","finir","faire","être"],[
["je","parlais","finissais","faisais","étais"],
["tu","parlais","finissais","faisais","étais"],
["il/elle","parlait","finissait","faisait","était"],
["nous","parlions","finissions","faisions","étions"],
["vous","parliez","finissiez","faisiez","étiez"],
["ils/elles","parlaient","finissaient","faisaient","étaient"]],"conj")}
<p>Rechtschreibung: <span lang="fr">manger → je mang<b>e</b>ais</span>, <span lang="fr">commencer → je commen<b>ç</b>ais</span> (aber: nous mangions, nous commencions).</p>

${H("Passé composé oder imparfait?")}
${TBL(["Passé composé","Imparfait"],[
["abgeschlossene, einmalige Handlung","Gewohnheit, Wiederholung"],
["Handlungskette im Vordergrund: Was passiert?","Beschreibung, Hintergrund: Wie war es? (Wetter, Gefühle, Alter, Uhrzeit)"],
["neu einsetzende Handlung","bereits laufende Handlung"],
["<i>soudain, tout à coup, un jour, hier, en 2010, trois fois, puis, ensuite</i>","<i>d'habitude, souvent, toujours, chaque jour, le lundi, autrefois, à l'époque, pendant que</i>"]])}
${EX([
["Il <b>pleuvait</b> quand je <b>suis sorti</b>.","Es regnete, als ich hinausging."],
["Quand j'<b>étais</b> petit, je <b>jouais</b> au foot tous les dimanches.","Als ich klein war, spielte ich jeden Sonntag Fussball."],
["Nous <b>regardions</b> la télé quand le téléphone <b>a sonné</b>.","Wir schauten fern, als das Telefon klingelte."]])}
${BOX("tip","Eselsbrücke","<p>Stell dir eine Theaterbühne vor: Das <b>imparfait</b> ist die Kulisse (Licht, Wetter, Stimmung), das <b>passé composé</b> sind die Schauspieler, die handeln.</p>")}

${H("Plus-que-parfait")}
<p>Bildung: <b>imparfait von avoir/être + participe passé</b>. Es drückt die <b>Vorvergangenheit</b> aus: eine Handlung, die vor einer anderen vergangenen Handlung abgeschlossen war. Es wird ausserdem im si-Satz Typ 3 und in der indirekten Rede gebraucht.</p>
${EX([
["Quand je suis arrivé, le film <b>avait</b> déjà <b>commencé</b>.","Als ich ankam, hatte der Film schon begonnen."],
["Elle était fatiguée parce qu'elle n'<b>avait</b> pas <b>dormi</b>.","Sie war müde, weil sie nicht geschlafen hatte."],
["Ils <b>étaient partis</b> avant midi.","Sie waren vor Mittag abgereist."]])}

${H("Passé simple (erkennen)")}
<p>Das <i>passé simple</i> ist die literarische Erzählzeit und entspricht in der Bedeutung dem <i>passé composé</i>. Du musst es in Texten <b>erkennen</b>, meist in der 3. Person.</p>
${TBL(["Typ","Endungen","Beispiel"],[
["-er-Verben","-ai, -as, -a, -âmes, -âtes, -èrent","il parl<b>a</b>, ils parl<b>èrent</b>"],
["-ir / -re-Verben","-is, -is, -it, -îmes, -îtes, -irent","il fin<b>it</b>, ils prirent"],
["viele -oir-Verben","-us, -us, -ut, -ûmes, -ûtes, -urent","il voul<b>ut</b>, ils purent"]])}
${LIST(["être → il fut / ils furent","avoir → il eut / ils eurent","faire → il fit","venir → il vint / ils vinrent","prendre → il prit","mettre → il mit","voir → il vit","dire → il dit","pouvoir → il put","savoir → il sut","naître → il naquit","mourir → il mourut","vivre → il vécut","écrire → il écrivit"])}
${BOX("warn","Achtung","<p><span lang=\"fr\">il vit</span> kann <i>passé simple</i> von <b>voir</b> (er sah) oder Präsens von <b>vivre</b> (er lebt) sein. Der Kontext entscheidet.</p>")}
`,
ex:[
{t:"fill",q:"Hier soir, nous ___ (aller) au cinéma.",a:["sommes allés","sommes allées"],h:"<i>aller</i> bildet das passé composé mit <b>être</b>; das Partizip wird an <i>nous</i> angeglichen (Plural)."},
{t:"fill",q:"Elle ___ (naître) en 2008 à Lausanne.",a:["est née"],h:"<i>naître</i> → être; Angleichung an das Subjekt <i>elle</i>."},
{t:"fill",q:"Les lettres que j'ai ___ (écrire) sont sur la table.",a:["écrites"],h:"Das COD <i>que</i> (= les lettres, f. Pl.) steht <b>vor</b> avoir → Angleichung."},
{t:"fill",q:"Quand j'étais petit, je ___ (passer) mes vacances chez ma grand-mère.",a:["passais"],h:"Gewohnheit in der Vergangenheit → imparfait."},
{t:"fill",q:"Nous dormions quand soudain le téléphone ___ (sonner).",a:["a sonné"],h:"Neu einsetzende Handlung (Signalwort <i>soudain</i>) → passé composé."},
{t:"fill",q:"Il ___ (faire) beau et les oiseaux chantaient.",a:["faisait"],h:"Beschreibung des Wetters (Hintergrund) → imparfait."},
{t:"fill",q:"Quand nous sommes arrivés à la gare, le train ___ (déjà / partir).",a:["était déjà parti"],h:"Vorvergangenheit → plus-que-parfait. <i>partir</i> → être; kurzes Adverb zwischen Hilfsverb und Partizip."},
{t:"mc",q:"Elle ___ les mains avant le repas.",o:["s'est lavé","s'est lavée","a lavé","s'est lavés"],c:0,h:"Das COD <i>les mains</i> steht <b>nach</b> dem Verb, <i>se</i> ist hier indirektes Objekt → keine Angleichung."},
{t:"mc",q:"Ils ___ la valise au grenier.",o:["sont montés","ont monté","sont monté","ont montés"],c:1,h:"<i>monter</i> mit direktem Objekt (la valise) → avoir. Das COD steht danach → keine Angleichung."},
{t:"fill",q:"Ces chaussures ? Je les ai ___ (acheter) hier.",a:["achetées"],h:"<i>les</i> (= ces chaussures, f. Pl.) steht vor avoir → Angleichung."},
{t:"mc",q:"« Le roi mourut en 1715. » Welche Form ist <i>mourut</i>?",o:["passé simple von mourir","imparfait von mourir","passé simple von mûrir","présent von mourir"],c:0,h:"Die Endung <i>-ut</i> zeigt das passé simple; <i>mourir → il mourut</i>."},
{t:"fill",q:"Elles se sont ___ (téléphoner) hier soir.",a:["téléphoné"],h:"<i>téléphoner <b>à</b> qn</i>: <i>se</i> ist indirektes Objekt → keine Angleichung."},
{t:"mc",q:"Pendant que je ___ mes devoirs, ma sœur est rentrée.",o:["faisais","ai fait","avais fait","fis"],c:0,h:"Bereits laufende Handlung (<i>pendant que</i>) → imparfait."}
]});

/* ===== Thema 2: Futur et conditionnel ===== */
TOPICS.push({
id:"futur-conditionnel", fr:"Futur et conditionnel", de:"Zukunft und Konditional",
chips:["Futur proche","Futur simple","Futur antérieur","Conditionnel présent","Conditionnel passé"],
intro:"Futur und Conditionnel teilen sich denselben Stamm. Wenn du die unregelmässigen Futurstämme kannst, beherrschst du automatisch auch den Conditionnel.",
html:`
${H("Futur proche")}
<p><b>aller</b> (Präsens) + <b>Infinitiv</b>. Für nahe oder fest geplante Zukunft, besonders in der gesprochenen Sprache.</p>
${EX([["Je <b>vais partir</b> dans cinq minutes.","Ich gehe in fünf Minuten."],["Regarde ces nuages, il <b>va pleuvoir</b>.","Schau diese Wolken, es wird regnen."]])}

${H("Futur simple: Bildung")}
<p><b>Infinitiv + -ai, -as, -a, -ons, -ez, -ont</b>. Verben auf <i>-re</i> verlieren das <i>-e</i>: <span lang="fr">prendre → je prendr<b>ai</b></span>.</p>
${TBL(["","parler","finir","prendre"],[
["je","parlerai","finirai","prendrai"],["tu","parleras","finiras","prendras"],["il/elle","parlera","finira","prendra"],
["nous","parlerons","finirons","prendrons"],["vous","parlerez","finirez","prendrez"],["ils/elles","parleront","finiront","prendront"]],"conj")}
<p>Rechtschreibung: <span lang="fr">acheter → j'achèterai, appeler → j'appellerai, jeter → je jetterai, payer → je paierai</span>.</p>
<p>Unregelmässige Stämme (die Endungen bleiben gleich):</p>
${LIST(["être → ser-","avoir → aur-","aller → ir-","faire → fer-","venir → viendr-","tenir → tiendr-","voir → verr-","envoyer → enverr-","pouvoir → pourr-","vouloir → voudr-","devoir → devr-","savoir → saur-","recevoir → recevr-","courir → courr-","mourir → mourr-","falloir → il faudra","pleuvoir → il pleuvra","valoir → vaudr-"])}
${BOX("warn","Achtung","<p>Nach <b>quand, lorsque, dès que, aussitôt que</b> steht im Französischen das Futur, wenn Zukunft gemeint ist. Im Deutschen steht dort Präsens!</p>"+EX([["Quand tu <b>seras</b> grand, tu comprendras.","Wenn du gross <b>bist</b>, wirst du es verstehen."]]))}

${H("Futur antérieur")}
<p>Bildung: <b>futur von avoir/être + participe passé</b>. Es bezeichnet eine Handlung, die in der Zukunft vor einer anderen abgeschlossen sein wird (vollendete Zukunft).</p>
${EX([
["Quand tu <b>auras fini</b> tes devoirs, tu pourras sortir.","Wenn du deine Hausaufgaben fertig gemacht hast, darfst du ausgehen."],
["Dès que j'<b>aurai reçu</b> ta lettre, je te répondrai.","Sobald ich deinen Brief erhalten habe, antworte ich dir."],
["D'ici juin, j'<b>aurai passé</b> la matu.","Bis Juni werde ich die Matur bestanden haben."]])}

${H("Conditionnel présent")}
<p>Bildung: <b>Futurstamm + Imparfait-Endungen</b> (-ais, -ais, -ait, -ions, -iez, -aient): <span lang="fr">je serais, j'aurais, je pourrais, je voudrais, il faudrait</span>.</p>
${TBL(["Gebrauch","Beispiel"],[
["Höflichkeit","<span lang=\"fr\">Je <b>voudrais</b> un café. <b>Pourriez</b>-vous m'aider ?</span>"],
["Wunsch","<span lang=\"fr\">J'<b>aimerais</b> voyager au Japon.</span>"],
["Ratschlag","<span lang=\"fr\">Tu <b>devrais</b> dormir plus.</span>"],
["Irrealer Bedingungssatz (Typ 2)","<span lang=\"fr\">Si j'avais le temps, je <b>viendrais</b>.</span>"],
["Unbestätigte Information (Medien)","<span lang=\"fr\">Selon la presse, le ministre <b>démissionnerait</b>.</span>"],
["Zukunft in der Vergangenheit","<span lang=\"fr\">Il a dit qu'il <b>viendrait</b>.</span>"]])}
${BOX("warn","Achtung, Verwechslungsgefahr","<p><span lang=\"fr\">je ser<b>ai</b></span> (Futur) ≠ <span lang=\"fr\">je ser<b>ais</b></span> (Conditionnel). <span lang=\"fr\">je voud<b>r</b>ais</span> (Conditionnel) ≠ <span lang=\"fr\">je voulais</span> (Imparfait). Das <b>r</b> vor der Endung verrät den Conditionnel.</p>")}

${H("Conditionnel passé")}
<p>Bildung: <b>conditionnel von avoir/être + participe passé</b>.</p>
${EX([
["J'<b>aurais dû</b> travailler plus.","Ich hätte mehr arbeiten sollen. (Bedauern)"],
["Tu <b>aurais pu</b> me prévenir !","Du hättest mich warnen können! (Vorwurf)"],
["Si tu m'avais appelé, je <b>serais venu</b>.","Wenn du mich angerufen hättest, wäre ich gekommen. (Typ 3)"],
["L'accident <b>aurait fait</b> trois victimes.","Der Unfall soll drei Opfer gefordert haben. (unbestätigt)"]])}
`,
ex:[
{t:"fill",q:"Demain, nous ___ (avoir) un examen de français.",a:["aurons"],h:"Futurstamm <i>aur-</i> + <i>-ons</i>."},
{t:"fill",q:"Quand tu ___ (être) à Paris, envoie-moi une carte.",a:["seras"],h:"Nach <i>quand</i> mit Zukunftsbezug steht das Futur."},
{t:"fill",q:"Je te ___ (envoyer) le document ce soir.",a:["enverrai"],h:"Unregelmässiger Futurstamm: <i>envoyer → enverr-</i>."},
{t:"fill",q:"Il ___ (falloir) partir tôt demain.",a:["faudra"],h:"<i>falloir → il faudra</i>."},
{t:"fill",q:"Dès que j'___ (finir) ce travail, je t'appellerai.",a:["aurai fini"],h:"Die Handlung ist abgeschlossen, bevor die andere beginnt → futur antérieur."},
{t:"fill",q:"___ (pouvoir)-vous fermer la fenêtre, s'il vous plaît ?",a:["Pourriez"],h:"Höfliche Bitte → conditionnel présent."},
{t:"fill",q:"À ta place, j'___ (aller) voir un médecin.",a:["irais"],h:"Ratschlag → conditionnel: Stamm <i>ir-</i> + <i>-ais</i>."},
{t:"mc",q:"Selon la radio, l'incendie ___ deux maisons.",o:["aurait détruit","aura détruit","a détruirait","avait détruit"],c:0,h:"Unbestätigte Information über die Vergangenheit → conditionnel passé."},
{t:"fill",q:"Tu ___ (devoir) me le dire plus tôt ! (Vorwurf)",a:["aurais dû"],h:"Vorwurf über die Vergangenheit → conditionnel passé von <i>devoir</i>."},
{t:"mc",q:"Elle m'a promis qu'elle ___.",o:["viendra","viendrait","vienne","venait"],c:1,h:"Zukunft aus Sicht der Vergangenheit → conditionnel présent."},
{t:"fill",q:"Nous ___ (voir) bien ce qui se passera.",a:["verrons"],h:"<i>voir → verr-</i>."},
{t:"mc",q:"Welche Form ist conditionnel présent?",o:["je parlerai","je parlerais","je parlais","je parlai"],c:1,h:"Futurstamm (<i>parler-</i>) + Imparfait-Endung (<i>-ais</i>)."}
]});

/* ===== Thema 3: Phrases hypothétiques ===== */
TOPICS.push({
id:"phrases-hypothetiques", fr:"Les phrases hypothétiques", de:"Die Bedingungssätze (si-Sätze)",
chips:["Réel","Potentiel / Irréel du présent","Irréel du passé","Mischformen","si = ob"],
intro:"Ein si-Satz besteht aus einem Nebensatz mit der Bedingung (si …) und einem Hauptsatz mit der Folge. Die wichtigste Regel: Nach <b>si</b> (= wenn, falls) stehen nie Futur oder Conditionnel.",
html:`
${H("Die drei Typen im Überblick")}
${TBL(["Typ","si-Satz","Hauptsatz","Beispiel"],[
["1 · Réel<br><small>real, erfüllbar</small>","si + <b>présent</b>","présent / futur / impératif","<span lang=\"fr\">S'il <b>fait</b> beau demain, nous <b>irons</b> à la plage.</span>"],

${H("Achtung: si = ob")}
<p>In <b>indirekten Fragen</b> bedeutet <i>si</i> „ob“. Dann sind Futur und Conditionnel erlaubt:</p>

/* ===== Thema 4: Le subjonctif ===== */
TOPICS.push({
id:"subjonctif", fr:"Le subjonctif", de:"Der Subjonctif",
chips:["Bildung","Wille & Gefühl","Zweifel","Konjunktionen","Subjonctif passé"],
intro:"Der subjonctif ist ein Modus, keine Zeit. Er steht fast immer in einem Nebensatz mit <b>que</b> und drückt Subjektives aus: Wille, Gefühl, Zweifel, Notwendigkeit. Der Indikativ stellt dagegen Tatsachen dar.",
html:`
${H("Bildung (regelmässig)")}
<p>Stamm der <b>3. Person Plural Präsens</b> (<span lang="fr">ils <b>parl</b>ent</span>) + <b>-e, -es, -e, -ions, -iez, -ent</b>.</p>
${TBL(["","parler<br><small>ils parlent</small>","finir<br><small>ils finissent</small>","vendre<br><small>ils vendent</small>","partir<br><small>ils partent</small>"],[
["que je","parle","finisse","vende","parte"],["que tu","parles","finisses","vendes","partes"],["qu'il/elle","parle","finisse","vende","parte"],
["que nous","parlions","finissions","vendions","partions"],["que vous","parliez","finissiez","vendiez","partiez"],["qu'ils/elles","parlent","finissent","vendent","partent"]],"conj")}
<p>Verben mit zwei Stämmen: <i>nous</i> und <i>vous</i> bilden den subjonctif vom <i>nous</i>-Stamm des Präsens.</p>
${LIST(["prendre: que je prenne / que nous prenions","venir: que je vienne / que nous venions","boire: que je boive / que nous buvions","recevoir: que je reçoive / que nous recevions","devoir: que je doive / que nous devions","voir: que je voie / que nous voyions","croire: que je croie / que nous croyions","acheter: que j'achète / que nous achetions"])}

${H("Unregelmässige Formen")}
${TBL(["","être","avoir","aller","faire"],[
["que je / j'","sois","aie","aille","fasse"],["que tu","sois","aies","ailles","fasses"],["qu'il","soit","ait","aille","fasse"],
["que nous","soyons","ayons","allions","fassions"],["que vous","soyez","ayez","alliez","fassiez"],["qu'ils","soient","aient","aillent","fassent"]],"conj")}
${LIST(["pouvoir: que je puisse, que nous puissions","savoir: que je sache, que nous sachions","vouloir: que je veuille, que nous voulions","valoir: que je vaille","falloir: qu'il faille","pleuvoir: qu'il pleuve"])}

${H("Wann steht der subjonctif?")}
${TBL(["Auslöser","Ausdrücke","Beispiel"],[
["Wille, Wunsch, Befehl","vouloir que, souhaiter que, désirer que, exiger que, demander que, préférer que, aimer que, accepter que, interdire que, permettre que","<span lang=\"fr\">Je veux que tu <b>viennes</b>.</span>"],
["Gefühl","être content / heureux / triste / désolé que, regretter que, avoir peur que, craindre que, s'étonner que, c'est dommage que","<span lang=\"fr\">Je suis content que tu <b>sois</b> là.</span>"],
["Zweifel, Möglichkeit","douter que, il est possible que, il se peut que, il semble que, ne pas croire / ne pas penser que","<span lang=\"fr\">Je doute qu'il <b>puisse</b> venir.</span>"],
["Notwendigkeit, Wertung","il faut que, il est nécessaire / important / essentiel que, il vaut mieux que, il est normal que, il est temps que","<span lang=\"fr\">Il faut que nous <b>partions</b>.</span>"],
["Konjunktionen","bien que, quoique, pour que, afin que, avant que, à moins que, sans que, jusqu'à ce que, pourvu que, à condition que, de peur que","<span lang=\"fr\">Bien qu'il <b>soit</b> malade, il travaille.</span>"],
["Superlativ, <i>le seul, le premier</i>, Gesuchtes im Relativsatz","le plus … que, le seul … qui, je cherche quelqu'un qui …","<span lang=\"fr\">C'est le plus beau film que j'<b>aie</b> jamais vu.</span>"]])}

${H("Indikativ: nicht verwechseln!")}
${BOX("warn","Diese Ausdrücke stehen mit Indikativ","<p><b>espérer que</b>, <b>penser / croire / trouver que</b> (bejaht), il est probable que, il est certain / sûr / évident que, il paraît que, <b>après que</b>, parce que, pendant que, tandis que, dès que, même si.</p>")}
${EX([
["J'espère que tu <b>viendras</b>.","Ich hoffe, dass du kommst. (Indikativ!)"],
["Je pense qu'il <b>a</b> raison.","bejaht → Indikativ"],
["Je ne pense pas qu'il <b>ait</b> raison.","verneint → subjonctif"],
["Pensez-vous qu'il <b>ait</b> raison ?","Frage mit Inversion → subjonctif"]])}

${H("Infinitiv statt subjonctif")}
<p>Haben Haupt- und Nebensatz <b>dasselbe Subjekt</b>, steht der Infinitiv:</p>
${EX([
["Je veux <b>partir</b>.","(nicht: Je veux que je parte.)"],
["Je suis content <b>d'être</b> là.","Ich bin froh, hier zu sein."],
["Mange <b>avant de partir</b>.","Iss, bevor du gehst. (gleiches Subjekt: avant de + Infinitiv)"],
["Mange avant que nous <b>partions</b>.","Iss, bevor wir gehen. (verschiedene Subjekte: avant que + subjonctif)"]])}

${H("Subjonctif passé")}
<p>Bildung: <b>subjonctif von avoir/être + participe passé</b>. Für Handlungen, die vor der Handlung des Hauptsatzes liegen oder abgeschlossen sind.</p>
${EX([
["Je suis content que tu <b>aies réussi</b> l'examen.","Ich freue mich, dass du die Prüfung bestanden hast."],
["Je regrette qu'elle <b>soit partie</b>.","Ich bedaure, dass sie gegangen ist."],
["Il faut que tu <b>aies fini</b> avant midi.","Du musst vor Mittag fertig sein."]])}
${BOX("tip","Ne explétif","<p>Nach <i>avoir peur que, craindre que, avant que, à moins que</i> kann ein <b>ne</b> ohne verneinende Bedeutung stehen (gehobener Stil): <span lang=\"fr\">J'ai peur qu'il <b>ne</b> pleuve.</span> = Ich habe Angst, dass es regnet.</p>")}
`,
ex:[

{t:"mc",q:"Je ne pense pas qu'il ___ raison.",o:["a","ait","aura","avait"],c:1,h:"<i>penser</i> verneint → subjonctif."},
{t:"mc",q:"Je pense qu'il ___ raison.",o:["a","ait","aie","eût"],c:0,h:"<i>penser</i> bejaht → Indikativ."},
{t:"fill",q:"Explique-le-moi encore une fois pour que je ___ (comprendre).",a:["comprenne"],h:"<i>pour que</i> → subjonctif; <i>ils comprennent → que je comprenne</i>."},
{t:"fill",q:"Je doute qu'elle ___ (savoir) la vérité.",a:["sache"],h:"Zweifel → subjonctif; <i>savoir → que je sache</i>."},
{t:"mc",q:"Je voudrais ___ demain.",o:["que je parte","partir","que je pars","de partir"],c:1,h:"Gleiches Subjekt → Infinitiv, und <i>vouloir</i> steht ohne <i>de</i>."},
{t:"fill",q:"Je regrette que vous ___ (partir) si tôt hier soir.",a:["soyez partis","soyez parties","soyez parti","soyez partie"],h:"Vergangene Handlung → subjonctif passé; <i>partir</i> mit être."},

{t:"mc",q:"Après qu'il ___, nous avons mangé.",o:["est arrivé","soit arrivé","arrive","arriverait"],c:0,h:"Nach der Norm steht <i>après que</i> mit Indikativ (im Gegensatz zu <i>avant que</i>)."}
]});
/* ===== Thema 5: Gérondif et participe présent ===== */
TOPICS.push({
id:"gerondif-participe", fr:"Gérondif et participe présent", de:"Gérondif und Partizip Präsens",
chips:["Participe présent","Gérondif","Participe composé","Adjectif verbal"],
intro:"Beide Formen enden auf <b>-ant</b>. Das <i>gérondif</i> (mit <b>en</b>) beschreibt Umstände einer Handlung desselben Subjekts. Das <i>participe présent</i> (ohne en) ersetzt vor allem in der Schriftsprache Relativ- und Kausalsätze.",
html:`
${H("Bildung des participe présent")}
<p>Stamm der <b>1. Person Plural Präsens</b> + <b>-ant</b>.</p>
${TBL(["Infinitiv","nous-Form","Participe présent"],[
["chanter","nous chant<b>ons</b>","chant<b>ant</b>"],["finir","nous finiss<b>ons</b>","finiss<b>ant</b>"],["faire","nous fais<b>ons</b>","fais<b>ant</b>"],["prendre","nous pren<b>ons</b>","pren<b>ant</b>"],
["manger","nous mange<b>ons</b>","mange<b>ant</b>"],["commencer","nous commen<b>ç</b>ons","commen<b>ç</b>ant"]])}
${BOX("rule","Nur drei Ausnahmen","<p><span lang=\"fr\">être → <b>étant</b> · avoir → <b>ayant</b> · savoir → <b>sachant</b></span></p>")}

${H("Gérondif: en + participe présent")}
<p>Das <i>gérondif</i> ist <b>unveränderlich</b>. Es bezieht sich immer auf das <b>Subjekt des Hauptsatzes</b>.</p>
${TBL(["Bedeutung","Deutsch","Beispiel"],[
["Gleichzeitigkeit","während, beim …","<span lang=\"fr\">Il chante <b>en prenant</b> sa douche.</span>"],
["Art und Weise, Mittel","indem, dadurch dass","<span lang=\"fr\">Elle a appris l'italien <b>en regardant</b> des films.</span>"],
["Bedingung","wenn","<span lang=\"fr\"><b>En partant</b> maintenant, tu arriveras à l'heure.</span>"],
["Gegensatz mit <b>tout en</b>","obwohl, zugleich","<span lang=\"fr\"><b>Tout en étant</b> malade, il est venu au cours.</span>"]])}
${EX([["C'est <b>en forgeant</b> qu'on devient forgeron.","Übung macht den Meister. (wörtlich: Durch Schmieden wird man Schmied.)"]])}
${BOX("warn","Achtung: Wer handelt?","<p><span lang=\"fr\">J'ai vu Paul <b>en sortant</b> du cinéma.</span> = <b>Ich</b> kam aus dem Kino.<br><span lang=\"fr\">J'ai vu Paul <b>sortant</b> du cinéma.</span> = <b>Paul</b> kam aus dem Kino.</p>")}

${H("Participe présent (ohne en)")}
<p>Vor allem schriftsprachlich und ebenfalls <b>unveränderlich</b>. Es ersetzt:</p>
<p><b>einen Relativsatz mit qui</b></p>
${EX([
["Les élèves <b>ayant</b> réussi l'examen recevront un certificat.","= qui ont réussi …"],
["On cherche un vendeur <b>parlant</b> allemand.","= qui parle allemand"]])}
<p><b>einen Kausalsatz</b> (comme, puisque)</p>
${EX([
["<b>Étant</b> malade, il est resté au lit.","Da er krank war, blieb er im Bett."],
["N'<b>ayant</b> pas d'argent, elle n'a pas pu partir.","Da sie kein Geld hatte, konnte sie nicht verreisen."]])}

${H("Participe présent composé")}
<p><b>ayant / étant + participe passé</b> drückt Vorzeitigkeit aus. Bei <i>étant</i> wird das Partizip angeglichen.</p>
${EX([
["<b>Ayant terminé</b> ses devoirs, il est sorti.","Nachdem er seine Hausaufgaben beendet hatte, ging er hinaus."],
["<b>Étant arrivée</b> en retard, elle a manqué le début.","Da sie zu spät angekommen war, verpasste sie den Anfang."]])}

${H("Adjectif verbal")}
<p>Wird das Partizip als <b>Adjektiv</b> gebraucht (Eigenschaft statt Handlung), ist es <b>veränderlich</b>:</p>
${EX([
["une histoire <b>passionnante</b>, des enfants <b>obéissants</b>","Eigenschaft → angeglichen"],
["des enfants <b>obéissant</b> à leurs parents","Handlung mit Ergänzung → unveränderlich"]])}
<p>Manche Adjektive werden anders geschrieben als das Partizip:</p>
${TBL(["Participe présent (Handlung)","Adjectif verbal (Eigenschaft)"],[
["fatiguant","fatigant"],["convainquant","convaincant"],["provoquant","provocant"],["communiquant","communicant"],
["précédant","précédent"],["différant","différent"],["négligeant","négligent"],["excellant","excellent"]])}
`,

TOPICS.push({

intro:"Die französische Verneinung besteht aus zwei Teilen: <b>ne</b> vor dem Verb und einem zweiten Wort (pas, plus, jamais …). Knifflig sind die Stellung in zusammengesetzten Zeiten und beim Infinitiv sowie der Artikel nach der Verneinung.",
html:`
${H("Die Verneinungsformen")}
${TBL(["Form","Deutsch","Beispiel"],[
["ne … pas","nicht","<span lang=\"fr\">Je <b>ne</b> parle <b>pas</b> russe.</span>"],
["ne … plus","nicht mehr","<span lang=\"fr\">Il <b>n'</b>habite <b>plus</b> ici.</span>"],
["ne … jamais","nie","<span lang=\"fr\">Elle <b>ne</b> ment <b>jamais</b>.</span>"],
["ne … rien","nichts","<span lang=\"fr\">Je <b>ne</b> vois <b>rien</b>.</span>"],
["ne … personne","niemand","<span lang=\"fr\">Il <b>ne</b> connaît <b>personne</b>.</span>"],
["ne … aucun(e)","kein einziger","<span lang=\"fr\">Je <b>n'</b>ai <b>aucune</b> idée.</span>"],
["ne … nulle part","nirgends","<span lang=\"fr\">Je <b>ne</b> le trouve <b>nulle part</b>.</span>"],
["ne … ni … ni","weder … noch","<span lang=\"fr\">Il <b>ne</b> boit <b>ni</b> café <b>ni</b> thé.</span>"],
["ne … pas encore","noch nicht","<span lang=\"fr\">Elle <b>n'</b>est <b>pas encore</b> là.</span>"],
["ne … guère","kaum (gehoben)","<span lang=\"fr\">Il <b>ne</b> parle <b>guère</b>.</span>"],
["ne … que","nur (keine echte Verneinung!)","<span lang=\"fr\">Je <b>n'</b>ai <b>que</b> dix francs.</span>"]])}

${H("Stellung in einfachen Zeiten")}
<p><b>ne</b> steht vor dem konjugierten Verb (und vor Objektpronomen), der zweite Teil danach.</p>
${EX([["Je <b>ne le</b> vois <b>pas</b>.","Ich sehe ihn nicht."],["<b>Ne</b> viens-tu <b>pas</b> ?","Kommst du nicht?"]])}

${H("Stellung in zusammengesetzten Zeiten")}
<p><b>pas, plus, jamais, rien, guère</b> umklammern das <b>Hilfsverb</b>. <b>personne, aucun, nulle part, que, ni … ni</b> stehen <b>nach dem Partizip</b>.</p>
${TBL(["vor dem Partizip","nach dem Partizip"],[
["Je <b>n'</b>ai <b>pas</b> mangé.","Je <b>n'</b>ai vu <b>personne</b>."],
["Il <b>n'</b>a <b>jamais</b> vu la mer.","Il <b>n'</b>a trouvé <b>aucune</b> solution."],
["Je <b>n'</b>ai <b>rien</b> compris.","Je <b>ne</b> l'ai trouvé <b>nulle part</b>."],
["Elle <b>n'</b>est <b>plus</b> venue.","Je <b>n'</b>ai mangé <b>qu'</b>une pomme."]])}

${H("Verneinung beim Infinitiv")}
<p><b>ne pas, ne plus, ne jamais, ne rien</b> stehen zusammen <b>vor</b> dem Infinitiv:</p>
${EX([
["Il m'a dit de <b>ne pas fumer</b>.","Er sagte mir, ich solle nicht rauchen."],
["J'espère <b>ne plus</b> le voir.","Ich hoffe, ihn nicht mehr zu sehen."],
["Il préfère <b>ne rien</b> dire.","Er zieht es vor, nichts zu sagen."],
["Il a décidé de <b>ne</b> voir <b>personne</b>.","aber: personne und aucun stehen nach dem Infinitiv"]])}

${H("Verneinung als Subjekt")}
<p><i>personne, rien, aucun</i> und <i>ni … ni</i> können Subjekt sein. Dann stehen sie am Satzanfang, gefolgt von <b>ne</b>, und <b>pas</b> fällt weg.</p>
${EX([["<b>Personne n'</b>est venu.","Niemand ist gekommen."],["<b>Rien ne</b> s'est passé.","Nichts ist passiert."],["<b>Aucun</b> élève <b>n'</b>a compris.","Kein Schüler hat es verstanden."],["<b>Ni</b> Paul <b>ni</b> Marie <b>ne</b> sont venus.","Weder Paul noch Marie sind gekommen."]])}

${H("Artikel nach der Verneinung")}
<p>Unbestimmter Artikel (<i>un, une, des</i>) und Teilungsartikel (<i>du, de la, de l'</i>) werden nach der Verneinung zu <b>de / d'</b>.</p>
${EX([
["J'ai une voiture. → Je n'ai pas <b>de</b> voiture.",""],

["Il y a des problèmes. → Il n'y a pas <b>de</b> problèmes.",""]])}
${BOX("warn","Ausnahmen","<p>Nach <b>être</b> bleibt der Artikel: <span lang=\"fr\">Ce n'est pas <b>un</b> problème.</span><br>Bei einem Gegensatz: <span lang=\"fr\">Je ne bois pas <b>du</b> café, mais <b>du</b> thé.</span><br>Der bestimmte Artikel bleibt immer: <span lang=\"fr\">Je n'aime pas <b>le</b> café.</span><br>Bei <i>ne … que</i> (nur) bleibt der Artikel: <span lang=\"fr\">Il ne mange que <b>des</b> légumes.</span></p>")}

${H("Kombinationen")}
${EX([["Je ne dirai <b>plus jamais rien</b> à <b>personne</b>.","Ich werde nie mehr irgendjemandem etwas sagen."],["Il n'y a <b>plus personne</b>.","Es ist niemand mehr da."],["Elle ne fait <b>jamais rien</b>.","Sie macht nie etwas."]])}

${H("Kurzantworten")}
${TBL(["Situation","Antwort"],[
["Zustimmung zu bejahtem Satz: <span lang=\"fr\">J'aime le jazz.</span>","<span lang=\"fr\">Moi <b>aussi</b>.</span>"],

${BOX("rule","Merke","<p>Im gesprochenen Französisch fällt <i>ne</i> oft weg (<span lang=\"fr\">J'sais pas, c'est pas grave</span>). In der schriftlichen Matur schreibst du <b>immer mit ne</b>.</p>")}
`,

html:`

${H("dont")}
<p><b>dont</b> ersetzt eine Ergänzung mit <b>de</b>: bei Verben (parler de, avoir besoin de, se souvenir de, avoir peur de, rêver de, s'occuper de), bei Adjektiven (fier de, content de) und als Genitiv (dessen, deren).</p>

{t:"tr",q:"Setze in die indirekte Rede:",s:"Il dit : « Je suis malade. »",a:["Il dit qu'il est malade"],h:"Einleitung im Präsens → keine Zeitverschiebung."},
{t:"tr",q:"Setze in die indirekte Rede:",s:"Il a dit : « Je suis malade. »",a:["Il a dit qu'il était malade"],h:"présent → imparfait."},
{t:"tr",q:"Setze in die indirekte Rede:",s:"Elle a dit : « J'ai raté le bus. »",a:["Elle a dit qu'elle avait raté le bus"],h:"passé composé → plus-que-parfait."},
{t:"tr",q:"Setze in die indirekte Rede:",s:"Ils ont dit : « Nous viendrons demain. »",a:["Ils ont dit qu'ils viendraient le lendemain"],h:"futur → conditionnel; <i>demain → le lendemain</i>."},
{t:"tr",q:"Setze in die indirekte Rede:",s:"Le prof nous a dit : « Ouvrez vos livres ! »",a:["Le prof nous a dit d'ouvrir nos livres"],h:"Imperativ → <i>de</i> + Infinitiv; <i>vos → nos</i>."},
{t:"tr",q:"Setze in die indirekte Rede:",s:"Il m'a demandé : « Tu as faim ? »",a:["Il m'a demandé si j'avais faim"],h:"Ja/Nein-Frage → <i>si</i>; présent → imparfait."},
{t:"tr",q:"Setze in die indirekte Rede:",s:"Elle m'a demandé : « Qu'est-ce que tu fais ce soir ? »",a:["Elle m'a demandé ce que je faisais ce soir-là"],h:"<i>qu'est-ce que → ce que</i>; <i>ce soir → ce soir-là</i>."},
{t:"tr",q:"Setze in die indirekte Rede:",s:"Il a demandé : « Où est la gare ? »",a:["Il a demandé où était la gare","Il a demandé où la gare était"],h:"Fragewort bleibt; présent → imparfait."},
{t:"mc",q:"« Qu'est-ce qui ne va pas ? » → Il m'a demandé ___ n'allait pas.",o:["ce qui","ce que","qu'est-ce qui","si"],c:0,h:"<i>qu'est-ce qui → ce qui</i>."},
{t:"mc",q:"Was wird aus <i>hier</i> in der indirekten Rede (Vergangenheit)?",o:["la veille","le lendemain","ce jour-là","avant-hier"],c:0,h:"<i>hier → la veille</i> (am Vortag)."},
{t:"fill",q:"Elle a promis : « Je vais t'aider. » → Elle a promis qu'elle ___ m'aider.",a:["allait"],h:"futur proche → <i>aller</i> im imparfait + Infinitiv."},
{t:"tr",q:"Setze in die indirekte Rede:",s:"Mon père m'a dit : « Ne rentre pas trop tard ! »",a:["Mon père m'a dit de ne pas rentrer trop tard"],h:"Verneinter Imperativ → <i>de ne pas</i> + Infinitiv."}

/* ===== Thema 12: Le passif ===== */
TOPICS.push({
id:"passif", fr:"Le passif", de:"Das Passiv",
chips:["Bildung","Alle Zeiten","par oder de","Alternativen"],
intro:"Im Passiv rückt das Objekt der Handlung in den Vordergrund. Die Zeit erkennst du an der Form von <b>être</b>; das Partizip des Hauptverbs wird immer an das Subjekt angeglichen.",
html:`
${H("Bildung")}
<p><b>être</b> (in der Zeit des Aktivsatzes) + <b>participe passé</b> (angeglichen an das Subjekt). Nur Verben mit direktem Objekt (COD) können ins Passiv. Das Subjekt des Aktivsatzes wird zum Urheber mit <b>par</b>.</p>
${EX([["Le chat mange <b>la souris</b>. → <b>La souris</b> est mangée <b>par le chat</b>.","Die Maus wird von der Katze gefressen."]])}

${H("Das Passiv in allen Zeiten")}
${TBL(["Zeit","Aktiv","Passiv"],[
["présent","Le maire inaugure le pont.","Le pont <b>est</b> inauguré par le maire."],
["passé composé","Le maire a inauguré le pont.","Le pont <b>a été</b> inauguré par le maire."],
["imparfait","… inaugurait …","… <b>était</b> inauguré …"],
["plus-que-parfait","… avait inauguré …","… <b>avait été</b> inauguré …"],
["futur simple","… inaugurera …","… <b>sera</b> inauguré …"],
["conditionnel","… inaugurerait …","… <b>serait</b> inauguré …"],
["subjonctif","… qu'il inaugure …","… qu'il <b>soit</b> inauguré …"],
["futur proche","… va inaugurer …","… <b>va être</b> inauguré …"]])}
${BOX("tip","Zeit erkennen","<p>Die Zeit steckt immer in <b>être</b>: <span lang=\"fr\">a été</span> = passé composé, <span lang=\"fr\">sera</span> = futur usw.</p>")}
${BOX("warn","Angleichung","<p><i>été</i> bleibt unverändert, nur das Partizip des Hauptverbs wird angeglichen: <span lang=\"fr\">Les lettres ont été écrit<b>es</b>.</span></p>")}

${H("par oder de?")}
<p>Meistens steht <b>par</b>. Bei Verben des <b>Gefühls</b> und bei <b>Zuständen</b> steht <b>de</b>: aimer, détester, respecter, admirer, craindre, connaître, entourer, couvrir, remplir, composer.</p>
${EX([["Il est aimé <b>de</b> tous.","Er wird von allen geliebt."],["La ville est entourée <b>de</b> montagnes.","Die Stadt ist von Bergen umgeben."],["Le sommet est couvert <b>de</b> neige.","Der Gipfel ist mit Schnee bedeckt."]])}

${H("Passiv ohne Urheber")}
<p>Ist der Urheber unbekannt oder unwichtig, fällt er weg. Oft ist ein Aktivsatz mit <b>on</b> natürlicher:</p>
${EX([["Mon vélo a été volé. = <b>On</b> a volé mon vélo.","Mein Velo wurde gestohlen."]])}

${H("Alternativen zum Passiv")}
${TBL(["Form","Gebrauch","Beispiel"],[
["<b>on</b> + Aktiv","sehr häufig, besonders mündlich","<span lang=\"fr\">On parle français ici.</span>"],
["<b>se</b> + Verb (pronominales Passiv)","allgemeine Tatsachen, Gewohnheiten","<span lang=\"fr\">Ce vin se boit frais. Ça ne se fait pas.</span>"],
["<b>se faire</b> + Infinitiv","jemandem passiert etwas, oder man lässt etwas machen","<span lang=\"fr\">Il s'est fait voler son portable. Elle s'est fait couper les cheveux.</span>"]])}
${BOX("warn","Kein Passiv bei indirektem Objekt","<p>Verben mit <i>à qn</i> (demander à, répondre à, téléphoner à) haben kein persönliches Passiv: „Ich wurde gefragt“ → <span lang=\"fr\"><b>On m'a demandé</b></span>.</p>")}
`,
ex:[
{t:"tr",q:"Setze ins Passiv:",s:"Le professeur corrige les examens.",a:["Les examens sont corrigés par le professeur"],h:"présent → <i>sont</i> + Partizip, angeglichen (m. Pl.)."},
{t:"tr",q:"Setze ins Passiv:",s:"Les pompiers ont sauvé la petite fille.",a:["La petite fille a été sauvée par les pompiers"],h:"passé composé → <i>a été</i> + Partizip (f. Sg.)."},
{t:"tr",q:"Setze ins Passiv:",s:"Un architecte suisse construira le musée.",a:["Le musée sera construit par un architecte suisse"],h:"futur → <i>sera</i> + Partizip."},
{t:"fill",q:"La maison ___ (détruire, passé composé, Passiv) par la tempête.",a:["a été détruite"],h:"<i>a été</i> + Partizip, angeglichen an <i>la maison</i>."},
{t:"fill",q:"Ces romans ___ (écrire, présent, Passiv) par une autrice belge.",a:["sont écrits"],h:"<i>sont</i> + Partizip, m. Pl."},
{t:"mc",q:"Le village est entouré ___ forêts.",o:["de","par","avec","des"],c:0,h:"Zustand (<i>entourer</i>) → <i>de</i>; <i>de + des</i> wird zu <i>de</i>."},
{t:"mc",q:"« Mon vélo a été volé. » Welche Zeit ist das?",o:["passé composé","plus-que-parfait","présent","imparfait"],c:0,h:"<i>a été</i> = passé composé von être."},
{t:"tr",q:"Forme ins Aktiv mit « on » um:",s:"La porte a été fermée.",a:["On a fermé la porte"],h:"Gleiche Zeit (passé composé), <i>on</i> als Subjekt."},
{t:"mc",q:"Welcher Satz ist ein pronominales Passiv?",o:["Ce livre se vend bien.","Il se lave.","Ils se parlent.","Elle se souvient."],c:0,h:"<i>Ce livre se vend</i> = Dieses Buch wird gut verkauft."},
{t:"fill",q:"Hier, Marc s'est ___ (faire) voler son sac.",a:["fait"],h:"<i>se faire</i> + Infinitiv: Das Partizip <i>fait</i> bleibt unverändert."},
{t:"tr",q:"Setze ins Passiv:",s:"Les élèves avaient préparé la fête.",a:["La fête avait été préparée par les élèves"],h:"plus-que-parfait → <i>avait été</i> + Partizip (f. Sg.)."},
{t:"fill",q:"Il faut que le travail ___ (être) terminé avant lundi.",a:["soit"],h:"Passiv im subjonctif (<i>il faut que</i>) → <i>soit</i> + Partizip."}
]});

const WHY = {

const WOZU = {
"temps-du-passe":{
 "Passé composé: Bildung":["Für einzelne, abgeschlossene Ereignisse in der Vergangenheit: Was ist passiert?","Es ist die wichtigste Vergangenheitszeit im Alltag, in Briefen, E-Mails und Berichten. Ohne sicheres passé composé kannst du nichts Vergangenes erzählen."],
 "Avoir oder être?":["Bei jedem Verb im passé composé, plus-que-parfait, futur antérieur und conditionnel passé.","Ein falsches Hilfsverb fällt sofort auf. Ausserdem hängt davon ab, ob und wie du das Partizip angleichen musst."],
 "Accord du participe passé":["Beim Schreiben jeder zusammengesetzten Zeit.","Man hört die Angleichung meistens nicht (mangé, mangée), darum ist sie ein klassischer Schreibfehler und ein beliebter Prüfungspunkt. Sie zeigt dem Leser, auf welches Wort sich das Partizip bezieht."],
 "Imparfait: Bildung":["Für Beschreibungen, Zustände und Gewohnheiten in der Vergangenheit.","Ohne imparfait kannst du keine Situation, keine Person und keine Stimmung in der Vergangenheit beschreiben."],
 "Passé composé oder imparfait?":["In jeder Erzählung über Vergangenes, also in fast jedem Aufsatz.","Die Zeitwahl bestimmt, was im Vordergrund und was im Hintergrund steht, und kann die Bedeutung verändern: « Il était malade » (Zustand) gegenüber « Il a été malade » (abgeschlossene Krankheitsphase)."],
 "Plus-que-parfait":["Wenn du in einer Erzählung zurückblendest, weil etwas noch früher passiert ist.","Es macht die Reihenfolge klar. Ohne plus-que-parfait weiss der Leser nicht, was zuerst geschah. Du brauchst es ausserdem für si-Sätze Typ 3 und die indirekte Rede."],
 "Passé simple (erkennen)":["Beim Lesen von Romanen, Märchen, Biografien und historischen Texten, also bei der Lektüre und im Textverständnis.","Du musst es nicht selbst schreiben, aber verstehen. Wer « il fut » nicht als „er war“ erkennt, versteht den Text nicht."]},
"futur-conditionnel":{
 "Futur proche":["Für Dinge, die bald passieren oder schon fest geplant sind, vor allem mündlich.","Es ist die einfachste Zukunftsform und klingt im Gespräch natürlicher als das futur simple."],
 "Futur simple: Bildung":["Für Vorhersagen, Versprechen, weiter entfernte Pläne und in formellen Texten.","Im schriftlichen Französisch (Aufsatz, Brief) ist es die Standardform der Zukunft. Die unregelmässigen Stämme brauchst du zudem für den Conditionnel."],
 "Futur antérieur":["Wenn zwei Handlungen in der Zukunft liegen und eine vor der anderen abgeschlossen sein wird.","Es zeigt die Reihenfolge in der Zukunft. Im Deutschen sagt man dafür meist Präsens oder Perfekt („wenn du fertig bist“), darum wird es oft vergessen."],
 "Conditionnel présent":["Wenn etwas nicht sicher, nicht real oder höflich formuliert sein soll.","Er macht Bitten höflich, Ratschläge sanft und Hypothesen möglich. Im Aufsatz klingt « Il serait utile de … » viel differenzierter als « Il est utile de … »."],
 "Conditionnel passé":["Wenn du über Vergangenes sprichst, das nicht (so) passiert ist.","Damit drückst du Bedauern, Vorwürfe und verpasste Möglichkeiten aus und bildest den si-Satz Typ 3."]},
"phrases-hypothetiques":{
 "Die drei Typen im Überblick":["Bei jedem Satz mit „wenn“ oder „falls“ im Sinn einer Bedingung.","Der Typ zeigt, wie wahrscheinlich die Bedingung ist: real (Typ 1), nur vorgestellt (Typ 2) oder verpasst (Typ 3)."],
 "Typ 1: Réel":["Wenn die Bedingung realistisch erfüllbar ist.","Für Pläne, Abmachungen, Regeln und Warnungen: « Si tu ne travailles pas, tu échoueras. »"],
 "Typ 2: Potentiel / Irréel du présent":["Wenn die Bedingung unwahrscheinlich oder in der Gegenwart unmöglich ist.","Für Wünsche, Träume, Ratschläge (« Si j'étais toi … ») und hypothetische Argumente im Aufsatz."],
 "Typ 3: Irréel du passé":["Wenn die Bedingung in der Vergangenheit lag und nicht erfüllt wurde.","Für Bedauern, Vorwürfe und Überlegungen über verpasste Chancen, auch für historische Hypothesen."],
 "Mischformen":["Wenn Bedingung und Folge in verschiedenen Zeiten liegen.","Damit sagst du präzise, dass etwas Vergangenes heute noch eine Auswirkung hätte, oder umgekehrt."],
 "Achtung: si = ob":["Nach Verben wie savoir, se demander, demander, ne pas savoir.","Damit du die si-Regel nicht falsch anwendest: Nach „ob“ sind Futur und Conditionnel erlaubt."],
 "Weitere Ausdrücke der Bedingung":["Wenn du eine Bedingung nuancierst (Einschränkung, Vorsichtsmassnahme) oder Abwechslung willst.","Dein Stil wirkt reicher, wenn nicht jeder Bedingungssatz mit si beginnt. Achte dabei auf den Modus, der zum Ausdruck gehört."]},
"subjonctif":{
 "Bildung (regelmässig)":["Nach jedem Auslöser mit que (siehe unten).","Bei vielen Verben hörst du den Unterschied zum Präsens nicht (que je parle), bei anderen schon (que je finisse). Wer die Bildung kann, macht weniger Fehler."],
 "Unregelmässige Formen":["Diese Verben (être, avoir, faire, aller …) kommen in fast jedem Text vor.","Gerade « il faut que tu fasses / sois / ailles » brauchst du ständig. Fehler bei diesen Formen fallen besonders auf."],
 "Wann steht der subjonctif?":["Wenn der Hauptsatz keine Tatsache feststellt, sondern eine Haltung ausdrückt.","Der subjonctif zeigt: Das Folgende ist gewünscht, befürchtet, bezweifelt oder nötig, aber (noch) nicht Realität."],
 "Indikativ: nicht verwechseln!":["Bei Ausdrücken der Gewissheit, der Meinung und der Hoffnung.","Hier liegt die Fehlerfalle: « J'espère que » und « Je pense que » wirken subjektiv, gelten aber als Feststellung und stehen darum mit Indikativ."],
 "Infinitiv statt subjonctif":["Wenn Haupt- und Nebensatz dasselbe Subjekt haben.","« Je veux que je parte » ist falsch. Der Infinitiv ist hier kürzer, eleganter und korrekt."],
 "Subjonctif passé":["Wenn die Handlung im que-Satz schon abgeschlossen ist.","Damit zeigst du, dass sich dein Gefühl oder Urteil auf etwas Vergangenes bezieht: „dass du bestanden hast“, nicht „dass du bestehst“."]},
"gerondif-participe":{
 "Bildung des participe présent":["Als Grundlage für gérondif, participe présent und adjectif verbal.","Mit einer Regel und drei Ausnahmen beherrschst du die Form für alle Verben."],
 "Gérondif: en + participe présent":["Wenn dieselbe Person zwei Dinge gleichzeitig tut oder wenn du sagst, wie oder wodurch etwas geschieht.","Es ersetzt Nebensätze mit pendant que, si oder parce que und macht Sätze kürzer. Im Deutschen entspricht es oft „indem“ oder „beim …“."],
 "Participe présent (ohne en)":["Vor allem in schriftlichen, formellen Texten.","Es verkürzt Relativ- und Kausalsätze. Du erkennst damit typische Formulierungen in Zeitungen und offiziellen Texten."],
 "Participe présent composé":["Wenn eine Handlung abgeschlossen war, bevor die nächste beginnt.","Es verbindet zwei aufeinanderfolgende Handlungen oder Grund und Folge in einem Satz („Nachdem er … hatte“, „Da er … hatte“)."],
 "Adjectif verbal":["Wenn das -ant-Wort eine Eigenschaft beschreibt, also wie ein Adjektiv gebraucht wird.","Dann wird es angeglichen und manchmal anders geschrieben. Das ist eine beliebte Rechtschreibfalle (fatigant, fatiguant)."]},
"imperatif":{
 "Bildung":["Wenn du jemanden direkt aufforderst (du, ihr, Sie) oder etwas für „uns“ vorschlägst.","Der Imperativ ist die direkteste Art, jemanden zu etwas zu bewegen. Das fehlende -s bei -er-Verben ist ein häufiger Schreibfehler."],
 "Unregelmässige Formen":["Bei sehr häufigen Aufforderungen: « Sois sage ! », « N'aie pas peur ! »","Diese Formen stammen vom subjonctif und lassen sich nicht ableiten. « Veuillez » brauchst du in formellen Briefen."],
 "Pronomen beim bejahten Imperativ":["Wenn sich die Aufforderung auf etwas bereits Genanntes bezieht.","So vermeidest du Wiederholungen (« Donne-le-moi » statt « Donne-moi le livre »). Die Stellung nach dem Verb ist die einzige Ausnahme zur normalen Pronomenregel."],
 "Verneinter Imperativ":["Bei Verboten und Warnungen.","Hier gilt wieder die normale Stellung vor dem Verb. Wer das verwechselt, schreibt Fehler wie « Ne dis-le pas »."],
 "Reflexive Verben":["Bei Aufforderungen mit Verben wie se lever, se dépêcher, s'inquiéter.","Das Reflexivpronomen darf nicht fehlen. Beim bejahten Imperativ wird te zu toi."],
 "Alternativen zum Imperativ":["Wenn ein Imperativ zu direkt oder unhöflich wäre.","Im formellen Brief oder gegenüber Fremden wirkt der Conditionnel höflicher. Infinitive sind typisch für Anleitungen und Schilder."]},
"pronoms":{
 "Objektpronomen: COD und COI":["Wenn ein Objekt schon genannt wurde.","Die Wahl hängt davon ab, ob das Verb mit oder ohne à steht, nicht vom deutschen Fall. Darum lohnt es sich, Verben immer mit ihrem Anschluss zu lernen (téléphoner à qn)."],
 "Die Pronomen y und en":["Wenn du Orte, Sachen mit à oder de oder Mengen ersetzt.","Diese zwei Wörter haben keine direkte deutsche Entsprechung („dort“, „davon“, „daran“), sind im Französischen aber Pflicht: « J'en ai deux », nicht « J'ai deux »."],
 "Stellung der Pronomen":["In jedem Satz mit Objektpronomen.","Im Französischen steht das Pronomen vor dem Verb, im Deutschen danach. Hier passieren die meisten Fehler."],
 "Reihenfolge bei zwei Pronomen":["Wenn du zwei Objekte gleichzeitig ersetzt.","Typisch bei geben, sagen, zeigen, erklären: « Je le lui ai dit. » Die feste Reihenfolge musst du auswendig kennen."],
 "Pronoms toniques":["Zur Betonung, nach Präpositionen und wenn kein Verb folgt.","me, le oder lui können nicht allein stehen: « avec il » oder « C'est je » sind falsch."],
 "Demonstrativpronomen":["Wenn du zwischen mehreren Dingen auswählst oder vergleichst.","Du vermeidest Wiederholungen beim Vergleichen (« mon opinion et celle de l'auteur »). Das ist im Kommentar sehr nützlich."],
 "Possessivpronomen":["Wenn du Besitz ausdrückst, ohne das Nomen zu wiederholen.","Typisch in Vergleichen und Gegenüberstellungen: « Sa vie est différente de la mienne. »"]},
"adjectifs-adverbes":{
 "Angleichung des Adjektivs":["Bei jedem Adjektiv, das sich auf ein Nomen bezieht.","Das Adjektiv muss zu Geschlecht und Zahl passen, auch wenn man es nicht hört. Das ist eine der häufigsten Fehlerquellen im Aufsatz."],
 "beau, nouveau, vieux":["Wenn diese Adjektive vor einem männlichen Nomen mit Vokal oder stummem h stehen.","Die Sonderform verhindert ein Zusammenstossen zweier Vokale: nicht « un beau ami », sondern « un bel ami »."],
 "Farbadjektive":["Bei Beschreibungen von Kleidung, Bildern und Gegenständen.","Hier gilt eine Ausnahme von der Angleichung, die gern geprüft wird."],
 "Stellung des Adjektivs":["Bei jeder Verbindung von Nomen und Adjektiv.","Im Deutschen steht das Adjektiv immer davor, im Französischen meist danach. Bei einigen Adjektiven ändert die Stellung sogar die Bedeutung."],
 "Bildung der Adverbien":["Wenn du beschreibst, wie jemand etwas tut.","Ein Adjektiv kann kein Verb beschreiben: « Il parle lent » ist falsch, « Il parle lentement » richtig."],
 "Stellung der Adverbien":["In jedem Satz mit Adverb, besonders im passé composé.","Die Stellung ist anders als im Deutschen. « J'ai mangé bien » klingt für Französischsprachige falsch."],
 "Komparativ":["Wenn du zwei Dinge oder Personen vergleichst.","Im argumentativen Aufsatz vergleichst du ständig Vor- und Nachteile. meilleur und mieux zu verwechseln ist ein typischer Fehler."],
 "Superlativ":["Wenn etwas das Höchste oder Niedrigste in einer Gruppe ist.","Für Hervorhebungen und Wertungen. Beachte den wiederholten Artikel beim nachgestellten Adjektiv."]},
"negation":{
 "Die Verneinungsformen":["Immer, wenn du etwas verneinst oder einschränkst.","Jede Form hat eine genaue Bedeutung. Mit ne … pas allein kannst du weder „nie“ noch „niemand“ noch „nur“ ausdrücken."],
 "Stellung in einfachen Zeiten":["Im Präsens, Imparfait, Futur und allen Zeiten ohne Hilfsverb.","ne und pas umrahmen das konjugierte Verb samt Pronomen. Das ist die Grundregel für alle anderen Fälle."],
 "Stellung in zusammengesetzten Zeiten":["Im passé composé und in allen Zeiten mit Hilfsverb.","Je nach Verneinungswort steht der zweite Teil vor oder nach dem Partizip. Das ist eine beliebte Prüfungsfrage."],
 "Verneinung beim Infinitiv":["Bei Ratschlägen, Anweisungen und Vorsätzen (de ne pas …).","Hier stehen beide Teile zusammen vor dem Infinitiv, anders als beim konjugierten Verb."],
 "Verneinung als Subjekt":["Wenn „niemand“, „nichts“ oder „kein“ der Satzgegenstand ist.","Dann steht die Verneinung am Satzanfang und pas fällt weg. « Personne n'est pas venu » ist ein typischer Fehler."],
 "Artikel nach der Verneinung":["Wenn du einen unbestimmten Artikel oder Teilungsartikel verneinst.","Aus „keine Zeit“ wird « pas de temps »: Der Artikel fällt weg, weil keine Menge mehr vorhanden ist."],
 "Kombinationen":["Wenn du mehrere Verneinungen verbindest, zum Beispiel „nie mehr etwas“.","Anders als in der Logik heben sich mehrere Verneinungswörter nicht auf, sondern verstärken sich."],
 "Kurzantworten":["Im Gespräch und in Dialogen, besonders an der mündlichen Prüfung.","« Si » und « non plus » zeigen in einem Wort, ob du zustimmst oder widersprichst."]},
"propositions":{
 "qui und que":["Wenn du ein Nomen mit einem ganzen Satz genauer beschreibst.","Statt « J'ai un ami. Il habite à Paris. » schreibst du flüssiger « J'ai un ami qui habite à Paris. »"],
 "dont":["Bei Verben und Ausdrücken mit de und für „dessen“ oder „deren“.","dont ist typisch für gutes Schriftfranzösisch. Lernende ersetzen es oft fälschlich durch que."],
 "où":["Für Orte und Zeitpunkte.","Bei Zeitangaben heisst es « le jour où », nicht « le jour quand ». Das ist ein typischer Germanismus."],
 "Präposition + qui / lequel":["Wenn das Verb im Relativsatz eine Präposition braucht (avec, sur, pour, à côté de …).","Im Französischen darf die Präposition nicht am Satzende stehen. Sie muss vor das Relativpronomen."],
 "ce qui, ce que, ce dont, ce à quoi":["Wenn sich das Relativpronomen nicht auf ein Nomen, sondern auf einen ganzen Gedanken bezieht („das, was“).","Sehr nützlich zum Hervorheben im Aufsatz: « Ce qui me frappe dans ce texte, c'est … »"],
 "Konjunktionen und Modus":["In jedem Nebensatz mit Konjunktion.","Die Konjunktion bestimmt den Modus. Faustregel: Tatsachen stehen im Indikativ, Ziele, Einräumungen und noch nicht Eingetretenes im subjonctif."]},
"discours-indirect":{
 "Grundprinzip":["Bei jeder Wiedergabe fremder Aussagen.","Die Perspektive wechselt vom Sprecher zum Erzähler. Deshalb müssen sich Pronomen und Possessivbegleiter anpassen."],
 "Zeitenfolge (Einleitung in der Vergangenheit)":["Wenn das Einleitungsverb in einer Vergangenheitszeit steht (a dit, disait …).","Die Zeiten passen sich an, damit die zeitlichen Verhältnisse aus Sicht der Vergangenheit stimmen. Das ist typisch für Erzähltexte und Berichte."],
 "Indirekte Fragen":["Wenn du wiedergibst, was jemand gefragt hat, oder höflich nachfragst (« Pouvez-vous me dire où … »).","Die indirekte Frage hat die Wortstellung eines Aussagesatzes. Inversion und est-ce que fallen weg."],
 "Zeit- und Ortsangaben":["Wenn die Aussage zu einem anderen Zeitpunkt oder an einem anderen Ort gemacht wurde.","„Morgen“ aus Sicht des Sprechers ist für den Erzähler nicht mehr morgen. Ohne Anpassung entstehen Missverständnisse."],
 "Einleitungsverben":["In Zusammenfassungen, Kommentaren und Erzählungen.","Abwechslungsreiche Verben statt immer dire zeigen genau, wie etwas gesagt wurde (behaupten, versprechen, erklären), und verbessern deinen Stil."]},
"passif":{
 "Bildung":["Wenn das Objekt der Handlung zum Thema des Satzes werden soll.","So verschiebst du den Fokus: Wichtig ist nicht, wer handelt, sondern was geschieht."],
 "Das Passiv in allen Zeiten":["In jedem Text, der Ereignisse sachlich darstellt.","Da die Zeit nur in être steckt, musst du dessen Form erkennen, um das Passiv richtig zu verstehen und zu bilden."],
 "par oder de?":["Wenn du den Urheber nennst.","Die Präposition zeigt, ob es um eine konkrete Handlung (par) oder um einen Zustand oder ein Gefühl (de) geht."],
 "Passiv ohne Urheber":["Wenn der Handelnde unbekannt, selbstverständlich oder unwichtig ist.","Das ist der häufigste Grund für das Passiv. Im Alltag sagt man dafür oft on."],
 "Alternativen zum Passiv":["Wenn das Passiv schwerfällig klingt, besonders mündlich.","Französisch verwendet das Passiv seltener als Deutsch. on und pronominale Verben klingen oft natürlicher."]}

{t:"tr",q:"Verneine mit ne … pas:",s:"Nous avons des devoirs.",a:["Nous n'avons pas de devoirs"],h:"des wird nach der Verneinung zu de.",f:{"nous n'avons pas des devoirs":"Nach der Verneinung wird des zu de."}},
{t:"mc",q:"Je n'ai ___ vu ce film.",o:["jamais","pas jamais","personne","rien"],c:0,h:"ne … jamais = nie.",w:[null,"jamais ersetzt pas.","personne bedeutet niemand und stünde nach dem Partizip.","rien bedeutet nichts und passt nicht zu ce film."]},
{t:"mc",q:"Il n'y a ___ dans la salle.",o:["personne","pas personne","personne pas","aucun"],c:0,h:"ne … personne = niemand.",w:[null,"personne ersetzt pas.","Diese Stellung gibt es nicht.","aucun braucht ein Nomen: aucun élève."]}

"propositions":{
fix:{
0:{f:{"que":"Nach dem Pronomen folgt direkt das Verb (joue): Es ist Subjekt → qui."}},
1:{f:{"qui":"Der Relativsatz hat ein eigenes Subjekt (tu) → que."}},
2:{f:{"que":"parler de → dont.","de qui":"Bei einer Sache mit de → dont."}},
3:{a:["où","dans laquelle"],f:{"que":"Ortsangabe → où.","dont":"grandir dans → où (oder dans laquelle)."}},
4:{f:{"quand":"Nach einem Zeitpunkt (le jour) steht où, nicht quand.","que":"Zeitangabe → où."}},
5:{f:{"laquelle":"stylo ist maskulin → lequel.","qui":"Nach einer Präposition steht qui nur bei Personen; bei Sachen lequel.","quoi":"Nach Präposition + Sache mit Bezugswort steht lequel."}},
6:{f:{"à lequel":"à + lequel verschmilzt zu auquel.","à qui":"à qui nur für Personen; Sache → auquel.","dont":"penser à (nicht de) → auquel.","auxquels":"problème ist Singular → auquel."}},
7:{f:{"que":"Ohne Bezugswort heisst „das, was“: ce que.","ce qui":"Das Pronomen ist Objekt (Subjekt ist tu) → ce que.","quoi":"In der indirekten Frage wird qu'est-ce que zu ce que."}},
8:{f:{"ce que":"Das Pronomen ist Subjekt von m'énerve → ce qui.","qui":"Für „das, was“ braucht es ce qui."}},
9:{f:{"ce que":"avoir besoin de → ce dont.","dont":"Ohne Bezugswort braucht es ce dont."}},
10:{w:[null,"avant que verlangt den subjonctif.","avant que verlangt den subjonctif.","avant que verlangt den subjonctif."]},
11:{w:[null,"parce que steht normalerweise nicht am Satzanfang; dort steht comme.","bien que bedeutet „obwohl“.","pour que bedeutet „damit“."]},
12:{w:[null,"parce que bedeutet „weil“; hier wird ein Zweck ausgedrückt.","bien que bedeutet „obwohl“.","si bien que drückt eine Folge aus und steht mit Indikativ."]},
13:{w:[null,"que wäre direktes Objekt. Hier: „deren Sohn“ → dont.","qui wäre Subjekt.","laquelle braucht eine Präposition davor; für „deren“ steht dont."]}
},

{t:"mc",q:"Je resterai ici jusqu'à ce que tu ___.",o:["reviennes","reviens","reviendras","revenais"],c:0,h:"jusqu'à ce que → subjonctif.",w:[null,"jusqu'à ce que verlangt den subjonctif.","jusqu'à ce que verlangt den subjonctif.","jusqu'à ce que verlangt den subjonctif."]},

{t:"mc",q:"Il a tellement travaillé ___ il est tombé malade.",o:["qu'","pour qu'","bien qu'","dont"],c:0,h:"tellement … que drückt eine Folge aus.",w:[null,"Ein Zweck passt nicht; tellement … que drückt eine Folge aus.","Ein Gegensatz passt nicht.","dont ist ein Relativpronomen."]},

function load(){ try{ return JSON.parse(localStorage.getItem(STORE)) || {}; }catch(e){ return {}; } }
function save(id, score, total){
  try{
    const p = load(); const prev = p[id];
    if(!prev || score > prev.best || prev.total!==total){ p[id] = {best:Math.max(score, prev && prev.total===total ? prev.best : 0),total}; localStorage.setItem(STORE, JSON.stringify(p)); markNav(); }
  }catch(e){}
