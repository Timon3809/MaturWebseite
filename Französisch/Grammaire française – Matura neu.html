/* =========================================================
   FEHLERANALYSE
   ========================================================= */
function clean(s){
  return String(s).normalize('NFC')
    .replace(/[’‘`´]/g,"'").replace(/[«»"“”]/g,' ')
    .replace(/\s+/g,' ').replace(/\s*'\s*/g,"'").replace(/\s*-\s*/g,'-')
    .replace(/\s+([,.!?;:])/g,'$1').replace(/[\s.!?;:,]+$/,'').trim();
}
const low = s => s.toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae');
const norm = s => low(clean(s)).replace(/[,;:!?.]/g,'').replace(/\s+/g,' ').trim();
const bare = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'');
const key = w => low(w).replace(/[,;:!?.]/g,'');
const tok = s => clean(s).split(' ').flatMap(w=>w.split(/(?<=')/)).filter(Boolean);
const joinParts = parts => parts.filter(p=>p[0]).reduce((acc,[html,raw],k,arr)=>acc + html + (k<arr.length-1 && !String(raw).endsWith("'") ? ' ' : ''), '');
function isElision(a,b){
  const el = (x,y) => x.endsWith("'") && x.length<=3 && (y===x.slice(0,-1)+'e' || y===x.slice(0,-1)+'a' || (x==="s'" && y==='si'));
  return el(a,b) || el(b,a);
}

function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}
function subCost(u,e){
  const a=key(u), b=key(e);
  if(a===b) return 0;
  if(bare(a)===bare(b)) return 0.3;
  const l=lev(a,b), L=Math.max(a.length,b.length);
  if(l<=Math.max(1,Math.ceil(L*0.4))) return 0.6+l/L;
  return 2.2;
}
function align(U,E){
  const m=U.length,n=E.length;
  const D=[...Array(m+1)].map(()=>Array(n+1).fill(0));
  for(let i=0;i<=m;i++) D[i][0]=i;
  for(let j=0;j<=n;j++) D[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    D[i][j]=Math.min(D[i-1][j]+1, D[i][j-1]+1, D[i-1][j-1]+subCost(U[i-1],E[j-1]));
  const ops=[]; let i=m,j=n;
  while(i>0||j>0){
    if(i>0&&j>0 && Math.abs(D[i][j]-(D[i-1][j-1]+subCost(U[i-1],E[j-1])))<1e-9){ ops.push({t:'sub',u:U[i-1],e:E[j-1]}); i--; j--; }
    else if(j>0 && Math.abs(D[i][j]-(D[i][j-1]+1))<1e-9){ ops.push({t:'ins',e:E[j-1]}); j--; }
    else { ops.push({t:'del',u:U[i-1]}); i--; }
  }
  ops.reverse();
  // verschobene Wörter erkennen (gleiches Wort fehlt an einer Stelle und steht zu viel an einer anderen)
  ops.forEach(o=>{
    if(o.t!=='del' || o.mv) return;
    const m = ops.find(x=>x.t==='ins' && !x.mv && bare(key(x.e))===bare(key(o.u)));
    if(m){ o.mv = m.mv = true; o.e = m.e; }
  });
  // benachbartes "zu viel" + "fehlt" als falsches Wort zusammenfassen
  const out=[];
  for(let k=0;k<ops.length;k++){
    const o=ops[k], nx=ops[k+1];
    if(nx && !o.mv && !nx.mv && ((o.t==='del'&&nx.t==='ins')||(o.t==='ins'&&nx.t==='del'))){
      out.push({t:'sub',u:o.t==='del'?o.u:nx.u,e:o.t==='ins'?o.e:nx.e}); k++;
    } else out.push(o);
  }
  out.forEach(o=>{ if(o.t==='sub'){ o.k = subKind(o.u,o.e); if(o.k==='eq') o.t='eq'; } });
  return {ops:out, cost:D[m][n]};
}
function subKind(u,e){
  const a=key(u), b=key(e);
  if(a===b) return 'eq';
  if(isElision(a,b)) return 'elision';
  if(bare(a)===bare(b)) return 'accent';
  let p=0; while(p<a.length&&p<b.length&&a[p]===b[p]) p++;
  if(p>=2 && a.length-p<=3 && b.length-p<=3) return 'ending';
  if(lev(a,b)<=2 && Math.max(a.length,b.length)>=4) return 'typo';
  return 'word';
}
function charDiff(a,b){
  const m=a.length,n=b.length;
  const L=[...Array(m+1)].map(()=>Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--)
    L[i][j] = a[i].toLowerCase()===b[j].toLowerCase() ? L[i+1][j+1]+1 : Math.max(L[i+1][j],L[i][j+1]);
  let i=0,j=0,A='',B='';
  while(i<m&&j<n){
    if(a[i].toLowerCase()===b[j].toLowerCase()){ A+=esc(a[i]); B+=esc(b[j]); i++; j++; }
    else if(L[i+1][j]>=L[i][j+1]){ A+=`<del>${esc(a[i])}</del>`; i++; }
    else { B+=`<ins>${esc(b[j])}</ins>`; j++; }
  }
  while(i<m){ A+=`<del>${esc(a[i])}</del>`; i++; }
  while(j<n){ B+=`<ins>${esc(b[j])}</ins>`; j++; }
  return [A.replace(/<\/del><del>/g,''), B.replace(/<\/ins><ins>/g,'')];
}
/* Ergebnis: {kind:'ok'|'accent'|'typo'|'typical'|'order'|'grammar', ops, best, msg} */
function analyse(input, answers, fmap){
  const ni = norm(input);
  if(answers.some(a=>norm(a)===ni)) return {kind:'ok'};
  const U = tok(input);
  let best=null, bestA=null;
  answers.forEach(a=>{ const r=align(U,tok(a)); if(!best||r.cost<best.cost){ best=r; bestA=a; } });
  const res = {ops:best.ops, best:bestA, E:tok(bestA)};
  if(fmap){
    for(const k in fmap){ if(bare(norm(k))===bare(ni)){ return Object.assign(res,{kind:'typical',msg:fmap[k]}); } }
  }
  const subs = best.ops.filter(o=>o.t!=='eq');
  const sortK = arr => arr.map(w=>bare(key(w))).sort().join('|');
  if(U.length>1 && sortK(U)===sortK(res.E)) res.kind='order';
  else if(subs.length && subs.every(o=>o.t==='sub'&&o.k==='accent')) res.kind='accent';
  else if(subs.length && subs.every(o=>o.t==='sub'&&(o.k==='accent'||o.k==='typo'||o.k==='elision'))) res.kind='typo';
  else res.kind='grammar';
  return res;
}
const KLABEL = {accent:'Akzent',typo:'Schreibweise',ending:'Endung',word:'Falsches Wort',elision:'Apostroph'};
function wordPair(o){
  if(o.k==='word') return [`<span class="w-bad">${esc(o.u)}</span>`,`<span class="w-good">${esc(o.e)}</span>`];
  const [a,b]=charDiff(o.u,o.e); return [`<span class="w-bad">${a}</span>`,`<span class="w-good">${b}</span>`];
}
function issueList(ops){
  const li = ops.filter(o=>o.t!=='eq').map(o=>{
    if(o.t==='sub'){ const [a,b]=wordPair(o); return `<li><span class="ik ik-${o.k}">${KLABEL[o.k]}</span><span lang="fr">${a} → ${b}</span></li>`; }
    if(o.t==='del' && o.mv){
      const acc = key(o.u)!==key(o.e) ? ` (richtig geschrieben: <span class="w-good">${esc(o.e)}</span>)` : '';
      return `<li><span class="ik ik-word">Stellung</span><span><span lang="fr" class="w-bad">${esc(o.u)}</span> steht an der falschen Stelle${acc}.</span></li>`;
    }
    if(o.t==='ins' && o.mv) return '';
    if(o.t==='del') return `<li><span class="ik ik-word">Zu viel</span><span lang="fr"><span class="w-bad">${esc(o.u)}</span></span></li>`;
    return `<li><span class="ik ik-word">Fehlt</span><span lang="fr"><span class="w-good">${esc(o.e)}</span></span></li>`;
  });
  return `<ul class="issues">${li.join('')}</ul>`;
}
function compareLines(ops){
  const u = joinParts(ops.map(o=>{
    if(o.t==='eq') return [esc(o.u), o.u];
    if(o.t==='sub') return [wordPair(o)[0], o.u];
    if(o.t==='del') return [o.mv ? `<span class="w-bad w-move">${esc(o.u)}</span>` : `<span class="w-bad w-extra">${esc(o.u)}</span>`, o.u];
    return [o.mv ? '' : `<span class="w-gap" title="Hier fehlt etwas">‸</span>`, ''];
  }));
  const e = joinParts(ops.map(o=>{
    if(o.t==='eq') return [esc(o.e), o.e];
    if(o.t==='sub') return [wordPair(o)[1], o.e];
    if(o.t==='ins') return [`<span class="w-good">${esc(o.e)}</span>`, o.e];
    return ['', ''];
  }));
  return `<div class="cmp"><p><span class="cl">Deine Antwort</span><span lang="fr">${u}</span></p><p><span class="cl">Richtig</span><span lang="fr">${e}</span></p></div>`;
}
const ruleBox = h => h ? `<details class="rule"><summary>Regel anzeigen</summary><p>${h}</p></details>` : '';
function textFeedback(r, it){
  const alt = (it.a && it.a.length>1) ? `<p class="alt">Ebenfalls richtig: <span lang="fr">${it.a.filter(a=>a!==r.best).map(esc).join(' · ')}</span></p>` : '';
  const long = r.E && r.E.length>=3;
  switch(r.kind){
    case 'ok': return {state:'ok', html:`<p><strong>Richtig!</strong></p>`};
    case 'accent': return {state:'near', html:`<p><strong>Fast richtig: nur die Akzente stimmen nicht.</strong></p>${issueList(r.ops)}`};
    case 'typo': return {state:'near', html:`<p><strong>Fast richtig: ein Schreibfehler.</strong></p>${issueList(r.ops)}`};
    case 'typical': return {state:'bad', html:`<p><strong>Typischer Fehler:</strong> ${r.msg}</p>${long?compareLines(r.ops):issueList(r.ops)}`};
    case 'order': return {state:'bad', html:`<p><strong>Die Wörter stimmen, aber die Reihenfolge nicht.</strong></p>${issueList(r.ops)}${compareLines(r.ops)}${ruleBox(it.h)}`};
    default: return {state:'bad', html:`<p><strong>Leider falsch.</strong> Das stimmt nicht:</p>${issueList(r.ops)}${long?compareLines(r.ops):''}${alt}${ruleBox(it.h)}`};
  }
}

function insertChar(target, c){

function mountExercises(wrap, items, key, persist){
  const n = items.length;
  const state = new Array(n).fill(null);
  let lastInput = null;

  wrap.innerHTML = `<div class="ex-bar">
      <div class="score" aria-live="polite"><strong class="sc">0</strong> von ${n} richtig</div>
      ${keysHtml()}
      <div class="bar-actions">
        <button type="button" class="btn sm" data-act="checkall">Alle prüfen</button>
        <button type="button" class="btn sm ghost" data-act="showall">Alle Lösungen</button>
        <button type="button" class="btn sm ghost" data-act="reset">Neu starten</button>
      </div>
    </div>
    <ol class="ex-list">${items.map((it,i)=>itemHtml(it,i,key)).join('')}</ol>
    <div class="result" aria-live="polite"></div>`;

  const lis = wrap.querySelectorAll('.ex-item');
  const scEl = wrap.querySelector('.sc');
  const resEl = wrap.querySelector('.result');

  function setState(i, kind, html){
    state[i] = kind;
    const li = lis[i];
    li.classList.remove('is-ok','is-bad','is-near','is-shown');
    const fb = li.querySelector('.fb');
    fb.className = 'fb';
    if(kind){ li.classList.add('is-'+kind); fb.classList.add(kind); fb.innerHTML = html||''; }
    else fb.innerHTML = '';
    update();
  }
  function update(){
    const ok = state.filter(s=>s==='ok').length;
    scEl.textContent = ok;
    if(persist) save(key, ok, n);
    if(state.every(s=>s!==null)){
      const pct = Math.round(ok/n*100);
      const msg = pct>=90 ? 'Ausgezeichnet, dieses Thema sitzt.' : pct>=70 ? 'Gut gemacht. Schau dir die roten Aufgaben noch einmal an.' : pct>=50 ? 'Halb geschafft. Lies die Regeln oben nochmals und starte neu.' : 'Lies die Erklärungen oben in Ruhe durch und versuche es dann noch einmal.';
      resEl.innerHTML = `<p style="margin:0"><strong style="font-family:var(--f-display);font-size:1.3rem">${ok} von ${n} richtig (${pct} %)</strong></p><p style="margin:4px 0 0">${msg}</p>`;
    } else resEl.innerHTML = '';
  }
  function check(i, silentEmpty){
    const it = items[i];
    if(it.t==='mc' || state[i]==='shown') return;
    const inp = lis[i].querySelector('input');
    if(!inp.value.trim()){
      if(!silentEmpty){ const fb = lis[i].querySelector('.fb'); fb.className='fb'; fb.innerHTML='<p>Schreib zuerst eine Antwort in das Feld.</p>'; }
      return;
    }
    const r = analyse(inp.value, it.a, it.f);
    const fbk = textFeedback(r, it);
    setState(i, fbk.state, fbk.html);
  }
  function show(i){
    const it = items[i];
    if(state[i]==='ok') return;
    const sol = it.t==='mc' ? it.o[it.c] : it.a[0];
    const alt = (it.t!=='mc' && it.a.length>1) ? `<p class="alt">Ebenfalls richtig: <span lang="fr">${it.a.slice(1).map(esc).join(' · ')}</span></p>` : '';
    if(it.t==='mc') revealMc(i, null);
    else lis[i].querySelector('input').value = it.a[0];
    setState(i,'shown',`<p><strong>Lösung:</strong> <b lang="fr">${esc(sol)}</b></p>${alt}${it.h?`<p class="why">${it.h}</p>`:''}`);
  }
  function revealMc(i, chosen){
    const it = items[i];
    lis[i].querySelectorAll('.opt').forEach(b=>{
      const j = +b.dataset.j; b.disabled = true;
      if(j===it.c) b.classList.add('right');
      else if(j===chosen) b.classList.add('wrong');
    });
  }

  wrap.addEventListener('click', e=>{
    const k = e.target.closest('.key');
    if(k){
      const target = lastInput && document.body.contains(lastInput) ? lastInput : wrap.querySelector('.ex-item input');
      if(target) insertChar(target, k.dataset.c);
      return;
    }
    const act = e.target.closest('[data-act]');
    if(act){
      const a = act.dataset.act;
      if(a==='checkall'){
        items.forEach((it,i)=>check(i,true));
        const firstOpen = [...lis].find((li,i)=>state[i]===null);
        if(firstOpen){ const f = firstOpen.querySelector('input,.opt'); if(f) f.focus(); }
      }
      else if(a==='showall') items.forEach((it,i)=>{ if(state[i]!=='ok') show(i); });
      else if(a==='reset') mountExercises(wrap, items, key, persist);
      return;
    }
    const li = e.target.closest('.ex-item'); if(!li) return;
    const i = +li.dataset.i, it = items[i];
    const opt = e.target.closest('.opt');
    if(opt && !opt.disabled){
      const j = +opt.dataset.j;
      revealMc(i, j);
      if(j===it.c) setState(i,'ok','<p><strong>Richtig!</strong></p>');
      else {
        const why = (it.w && it.w[j]) || it.h || '';
        setState(i,'bad',`<p><strong>Leider falsch.</strong> Du hast <span lang="fr" class="w-bad">${it.o[j]}</span> gewählt, richtig ist <span lang="fr" class="w-good">${it.o[it.c]}</span>.</p>${why?`<p class="why">${why}</p>`:''}`);
      }
      return;
    }
    if(e.target.closest('.do-check')) check(i,false);
    else if(e.target.closest('.do-show')) show(i);
  });
  wrap.addEventListener('mousedown', e=>{ if(e.target.closest('.key')) e.preventDefault(); });
  wrap.addEventListener('focusin', e=>{ if(e.target.matches('.ex-item input')) lastInput = e.target; });
  wrap.addEventListener('keydown', e=>{
    if(e.key==='Enter' && e.target.matches('.ex-item input')){
      e.preventDefault();
      const i = +e.target.closest('.ex-item').dataset.i;
      check(i,false);
      if(state[i]==='ok'){
        const nxt = [...lis].slice(i+1).find((li,k)=>state[i+1+k]===null && li.querySelector('input'));
        if(nxt) nxt.querySelector('input').focus();
      }
    }
  });
  wrap.addEventListener('input', e=>{
    if(!e.target.matches('.ex-item input')) return;
    const i = +e.target.closest('.ex-item').dataset.i;
    if(state[i] && state[i]!=='shown') setState(i,null);
    else if(!state[i]){ const fb = lis[i].querySelector('.fb'); fb.className='fb'; fb.innerHTML=''; }
  });
}

function itemHtml(it, i, key){
  const id = `in-${key}-${i}`;
  const tag = it.topic ? `<a class="ex-tag" href="#${it.topic.id}" lang="fr">${pad(it.topic.nr)} · ${it.topic.fr}</a><br>` : '';
  const ctl = `<div class="ex-ctl"><button type="button" class="btn sm do-check">Prüfen</button><button type="button" class="btn sm ghost do-show">Lösung zeigen</button></div>`;
  let body = '';
  if(it.t==='fill'){
    const parts = it.q.split('___');
    const w = Math.min(28, Math.max(...it.a.map(s=>s.length)) + 3);
    body = `<p class="ex-q" lang="fr">${parts[0]}<input id="${id}" class="blank" style="width:${w}ch" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Lücke in Aufgabe ${i+1}">${parts[1]||''}</p>${ctl}`;
  } else if(it.t==='tr'){
    body = `<p class="ex-instr">${it.q}</p><p class="ex-src" lang="fr">${it.s}</p><input id="${id}" class="line" type="text" lang="fr" autocomplete="off" autocapitalize="sentences" autocorrect="off" spellcheck="false" aria-label="Antwort zu Aufgabe ${i+1}" placeholder="Deine Lösung …">${ctl}`;
  } else {
    body = `<p class="ex-q" lang="fr">${it.q.replace('___','<span class="gap">___</span>')}</p><div class="opts" role="group" aria-label="Antwortmöglichkeiten">${it.o.map((o,j)=>`<button type="button" class="opt" data-j="${j}" lang="fr">${o}</button>`).join('')}</div>`;
  }
  return `<li class="ex-item" data-i="${i}">${tag}${body}<div class="fb" aria-live="polite"></div></li>`;
}

/* =========================================================
   UNREGELMÄSSIGE VERBEN
   ========================================================= */
const PR = ['je','tu','il/elle','nous','vous','ils/elles'];
const IMP_PR = ['tu','nous','vous'];
const isV = s => /^[aeiouyhâàäéèêëîïôöûùüœ]/i.test(s||'');
function joinStem(st,en){
  if(/^[ieè]/.test(en)){ if(st.endsWith('ge')) st=st.slice(0,-1); if(st.endsWith('ç')) st=st.slice(0,-1)+'c'; }
  return st+en;
}
function psForms(ps){
  if(ps.endsWith('int')){ const s=ps.slice(0,-3); return ['ins','ins','int','înmes','întes','inrent'].map(e=>s+e); }
  if(ps.endsWith('ut')){ const s=ps.slice(0,-2); return ['us','us','ut','ûmes','ûtes','urent'].map(e=>s+e); }
  if(ps.endsWith('it')){ const s=ps.slice(0,-2); return ['is','is','it','îmes','îtes','irent'].map(e=>s+e); }
  const s=ps.slice(0,-1); return ['ai','as','a','âmes','âtes','èrent'].map(e=>joinStem(s,e));
}
const AUX = {avoir:['ai','as','a','avons','avez','ont'], etre:['suis','es','est','sommes','êtes','sont']};
function forms(v){
  if(v._f) return v._f;
  const only = arr => v.imps ? arr.map((x,i)=>i===2?x:null) : arr;
  const impStem = v.impf || v.p[3].replace(/ons$/,'');
  const F = {};
  F.pres = v.p;
  F.impf = only(['ais','ais','ait','ions','iez','aient'].map(e=>joinStem(impStem,e)));
  F.fut  = only(['ai','as','a','ons','ez','ont'].map(e=>v.fut+e));
  F.cond = only(['ais','ais','ait','ions','iez','aient'].map(e=>v.fut+e));
  F.subj = v.subj || [v.s1+'e', v.s1+'es', v.s1+'e', joinStem(v.s2,'ions'), joinStem(v.s2,'iez'), v.s1+'ent'];
  F.ps   = only(psForms(v.ps));
  const aux = v.aux==='être' ? AUX.etre : AUX.avoir;
  F.pc   = only(aux.map((a,i)=> a+' '+(v.aux==='être' ? v.pp+(i<3?'(e)':'(e)s') : v.pp)));
  F.pcAcc = only(aux.map((a,i)=> v.aux==='être' ? (i<3 ? [a+' '+v.pp, a+' '+v.pp+'e'] : [a+' '+v.pp+'s', a+' '+v.pp+'es']) : [a+' '+v.pp]));
  if(v.imp===null) F.imp = null;
  else if(v.imp) F.imp = v.imp;
  else F.imp = [v.p[1].endsWith('es') ? v.p[1].slice(0,-1) : v.p[1], v.p[3], v.p[4]];
  v._f = F; return F;
}
function withPron(i, form, subj, imps){
  if(form==null) return null;
  const p = imps ? 'il' : PR[i];
  let s = (i===0 && isV(form)) ? "j'"+form : p+' '+form;
  if(subj) s = ((i===2||i===5) ? "qu'" : 'que ')+s;
  return s;
}
const TENSES = [
  {id:'pres', fr:'Présent', on:true},
  {id:'pc',   fr:'Passé composé', on:true},
  {id:'impf', fr:'Imparfait', on:false},
  {id:'fut',  fr:'Futur simple', on:true},
  {id:'cond', fr:'Conditionnel présent', on:false},
  {id:'subj', fr:'Subjonctif présent', on:true},
  {id:'imp',  fr:'Impératif', on:false},
  {id:'ps',   fr:'Passé simple (erkennen)', on:false}
];
const TIP = {
  pres: v=>`Präsens von ${v.inf}: ${v.p.filter(Boolean).join(', ')}.`,
  pc:   v=>`Hilfsverb: ${v.aux}, Partizip: ${v.pp}${v.aux==='être'?' (wird an das Subjekt angeglichen)':''}.`,
  impf: v=>`Stamm aus der nous-Form: ${v.impf ? v.impf+'-' : 'nous '+v.p[3]+' → '+v.p[3].replace(/ons$/,'')+'-'}.`,
  fut:  v=>`Futurstamm: ${v.fut}-.`,
  cond: v=>`Conditionnel = Futurstamm (${v.fut}-) + Imparfait-Endungen.`,
  subj: v=>v.subj ? 'Diese Formen sind unregelmässig und müssen auswendig gelernt werden.' : (v.s1===v.s2 ? `Stamm aus der ils-Form: ${v.s1}-.` : `Stamm aus der ils-Form: ${v.s1}-; für nous/vous: ${v.s2}-.`),
  imp:  v=>'Imperativ = Präsensform von tu, nous, vous (bei -er-Verben ohne -s).',
  ps:   v=>`Passé simple von ${v.inf}: il ${v.ps}.`
};
let trState = null;
function renderVerbs(){
  main.innerHTML = `<div class="wrap">
    <header class="t-head">
      <p class="t-nr">Training</p>
      <h1 lang="fr">Les verbes irréguliers</h1>
      <p class="t-de">Unregelmässige Verben</p>
      <p class="lead">Die wichtigsten Verben sind unregelmässig. Hier findest du ${VERBS.length} Verben mit allen Zeiten, Merkhilfen zum Ableiten der Formen und einen Trainer, der deine Fehler später nochmals abfragt.</p>
      <div class="why-box"><p class="why-t">Wann brauchst du das?</p><ul>

        <li>Alle anderen Grammatikthemen bauen darauf auf: passé composé (Partizip), Futur und Conditionnel (Stamm), subjonctif (Stamm).</li>

      <nav class="toc" aria-label="Inhalt dieser Seite"></nav>
    </header>
    <div class="prose">
      <h2 data-toc>So leitest du die Formen ab</h2>

      ${TBL(['Zeit','Woher kommt der Stamm?','Beispiel venir'],[
        ['Imparfait','nous-Form des Präsens ohne -ons (einzige Ausnahme: être → ét-)','nous <b>ven</b>ons → je <b>ven</b>ais'],
        ['Futur und Conditionnel','Futurstamm (meist der Infinitiv; die unregelmässigen musst du lernen)','<b>viendr</b>- → je viendrai / je viendrais'],
        ['Subjonctif','ils-Form ohne -ent; nous und vous von der nous-Form','ils <b>vienn</b>ent → que je vienne; que nous <b>ven</b>ions'],

      ${BOX('tip','Merkhilfe','<p>Lerne pro Verb nur fünf Grundformen: <b>je</b>, <b>nous</b> und <b>ils</b> im Präsens, das <b>Partizip</b> und den <b>Futurstamm</b>. Fast alles andere kannst du daraus ableiten.</p>')}
      ${BOX('warn','Typische Stolpersteine','<p>Die ils-Form hat oft einen anderen Stamm als nous: <span lang="fr">ils <b>doivent</b> / nous devons, ils <b>prennent</b> / nous prenons, ils <b>boivent</b> / nous buvons</span>. Genau dieser Unterschied kommt im subjonctif zurück: <span lang="fr">que je <b>boive</b>, que nous <b>buvions</b></span>.</p>')}
    </div>
    <section class="ex-sec" id="trainer">
      <h2>Verb-Trainer</h2>
      <p class="hint">Wähle die Zeiten und Verben. Schreib die passende Form (ohne Pronomen) und drück <b>Enter</b>. Falsche Formen kommen nach ein paar Fragen wieder.</p>
      <div id="trwrap"></div>
    </section>
    <section class="ex-sec" id="verbliste">
      <h2>Alle Verben</h2>
      <p class="hint">Klick auf ein Verb, um alle Zeiten zu sehen.</p>
      <div class="vsearch"><label for="vq">Verb suchen</label><input id="vq" class="line" type="search" placeholder="z. B. prendre oder nehmen" autocomplete="off"></div>

  buildToc([['Verb-Trainer ↓','trainer'],['Alle Verben ↓','verbliste']]);
  renderVerbList('');
  showVerb(VERBS[0]);
  document.getElementById('vq').addEventListener('input', e=>renderVerbList(e.target.value));
  mountTrainer(document.getElementById('trwrap'));
}
function renderVerbList(q){
  const nq = bare(low(q.trim()));
  const list = VERBS.filter(v=>!nq || bare(low(v.inf)).includes(nq) || bare(low(v.de)).includes(nq));
  document.getElementById('vchips').innerHTML = list.length
    ? list.map(v=>`<button type="button" class="vchip${v.top?' top':''}" data-v="${VERBS.indexOf(v)}" lang="fr">${v.inf}<small lang="de">${v.de}</small></button>`).join('')
    : '<p class="muted">Kein Verb gefunden.</p>';
  document.querySelectorAll('.vchip').forEach(b=>b.addEventListener('click',()=>{ showVerb(VERBS[+b.dataset.v]); smooth(document.getElementById('vpanel')); }));
}
function showVerb(v){
  const F = forms(v);
  document.querySelectorAll('.vchip').forEach(b=>b.classList.toggle('active', VERBS[+b.dataset.v]===v));
  const tbl = (title, arr, opt={}) => {
    if(!arr) return `<div class="ctab"><h4>${title}</h4><p class="muted">Keine Formen</p></div>`;
    const rows = arr.map((f,i)=>{
      if(f==null) return '';
      const pr = opt.imp ? '' : (opt.subj ? withPron(i,f,true,v.imps) : withPron(i,f,false,v.imps));
      return `<li>${opt.imp ? `<span class="pr">(${IMP_PR[i]})</span> ${esc(f)}` : esc(pr)}</li>`;
    }).join('');
    return `<div class="ctab"><h4>${title}</h4><ul lang="fr">${rows}</ul></div>`;
  };
  document.getElementById('vpanel').innerHTML = `<div class="vcard">
    <div class="vhead">
      <div><h3 lang="fr">${v.inf}</h3><p class="de">${v.de}</p></div>
      <button type="button" class="btn sm" id="trainThis">Nur dieses Verb trainieren</button>
    </div>
    <ul class="facts" lang="fr">
      <li><span>Partizip</span>${v.pp}</li>
      <li><span>Hilfsverb</span>${v.aux}</li>
      <li><span>Futurstamm</span>${v.fut}-</li>
      <li><span>Subjonctif</span>${v.subj ? 'unregelmässig' : (v.s1===v.s2 ? v.s1+'-' : v.s1+'- / '+v.s2+'-')}</li>
      <li><span>Passé simple</span>il ${v.ps}</li>
    </ul>
    <div class="cgrid">
      ${tbl('Présent', F.pres)}
      ${tbl('Passé composé', F.pc)}
      ${tbl('Imparfait', F.impf)}
      ${tbl('Futur simple', F.fut)}
      ${tbl('Conditionnel présent', F.cond)}
      ${tbl('Subjonctif présent', F.subj, {subj:true})}
      ${tbl('Impératif', F.imp, {imp:true})}
      ${tbl('Passé simple', F.ps)}
    </div>
  </div>`;
  document.getElementById('trainThis').addEventListener('click',()=>{
    if(trState){ trState.only = v; trState.queue=[]; trState.setOnlyLabel(); trState.next(); smooth(document.getElementById('trainer')); }
  });
}
function mountTrainer(wrap){
  let saved = {};
  try{ saved = JSON.parse(localStorage.getItem('fgm-trainer-v1'))||{}; }catch(e){}
  const S = trState = {
    tenses: new Set(saved.tenses || TENSES.filter(t=>t.on).map(t=>t.id)),
    set: saved.set || 'top', only:null,
    right:0, wrong:0, streak:0, count:0, queue:[], cur:null, done:false
  };
  wrap.innerHTML = `<div class="tr-settings">
      <fieldset><legend>Zeiten</legend><div class="tchips">${TENSES.map(t=>`<label class="tchip"><input type="checkbox" value="${t.id}" ${S.tenses.has(t.id)?'checked':''}><span lang="fr">${t.fr}</span></label>`).join('')}</div></fieldset>
      <fieldset><legend>Verben</legend><div class="tchips">
        <label class="tchip"><input type="radio" name="vset" value="top" ${S.set==='top'?'checked':''}><span>Die 20 wichtigsten</span></label>
        <label class="tchip"><input type="radio" name="vset" value="all" ${S.set==='all'?'checked':''}><span>Alle ${VERBS.length}</span></label>
        <label class="tchip" id="onlyLbl" hidden><input type="radio" name="vset" value="only"><span></span></label>
      </div></fieldset>
    </div>
    <div class="tr-card">
      <div class="tr-top"><span class="tr-tense" lang="fr"></span><span class="tr-stats" aria-live="polite"></span></div>
      <p class="tr-verb"></p>
      <div class="tr-line"><span class="tr-pron" lang="fr"></span><input id="tr-in" class="line" type="text" lang="fr" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Verbform"></div>
      ${keysHtml()}
      <div class="ex-ctl"><button type="button" class="btn sm" id="trCheck">Prüfen</button><button type="button" class="btn sm ghost" id="trShow">Lösung zeigen</button><button type="button" class="btn sm ghost" id="trNext">Nächste Frage →</button></div>
      <div class="fb" aria-live="polite"></div>
    </div>`;
  const $ = s => wrap.querySelector(s);
  const inp = $('#tr-in'), fb = $('.fb'), card = $('.tr-card');
  function persist(){ try{ localStorage.setItem('fgm-trainer-v1', JSON.stringify({tenses:[...S.tenses], set:S.set==='only'?'top':S.set})); }catch(e){} }
  S.setOnlyLabel = ()=>{
    const l = $('#onlyLbl'); l.hidden = false; l.querySelector('span').textContent = 'Nur ' + S.only.inf;
    l.querySelector('input').checked = true; S.set = 'only';
  };
  function pool(){ return S.set==='only' && S.only ? [S.only] : S.set==='all' ? VERBS : VERBS.filter(v=>v.top); }
  function makeQ(){
    const ts = [...S.tenses]; const vs = pool();
    for(let tries=0; tries<60; tries++){
      const tense = ts[Math.floor(Math.random()*ts.length)];
      const v = vs[Math.floor(Math.random()*vs.length)];
      const F = forms(v);
      if(tense==='imp'){ if(!F.imp) continue; const k=Math.floor(Math.random()*3); return {v,tense,i:k,ans:[F.imp[k]]}; }
      let persons = v.imps ? [2] : (tense==='ps' ? [2,5] : [0,1,2,3,4,5]);
      const i = persons[Math.floor(Math.random()*persons.length)];
      if(tense==='ps') return {v,tense,i,ans:[v.inf],shown:'il'+(i===5?'s':'')+' '+F.ps[i]};
      if(tense==='pc') return {v,tense,i,ans:F.pcAcc[i]};
      const f = F[tense][i]; if(f==null) continue;
      return {v,tense,i,ans:[f]};
    }
    return null;
  }
  function next(){
    S.count++; S.done=false;
    const due = S.queue.findIndex(q=>q.due<=S.count && (!S.only || S.set!=='only' || q.v===S.only));
    let q = due>=0 ? S.queue.splice(due,1)[0] : makeQ();
    if(!q){ fb.className='fb'; fb.innerHTML='<p>Wähle mindestens eine Zeit aus, die für diese Verben existiert.</p>'; return; }
    S.cur = q;
    const t = TENSES.find(x=>x.id===q.tense);
    $('.tr-tense').textContent = t.fr + (q.repeat ? ' · Wiederholung' : '');
    if(q.tense==='ps'){
      $('.tr-verb').innerHTML = `Von welchem Verb kommt <b lang="fr">« ${esc(q.shown)} »</b>?`;
      $('.tr-pron').textContent = 'Infinitiv:';
    } else {
      $('.tr-verb').innerHTML = `<span lang="fr">${q.v.inf}</span> <small>${q.v.de}</small>`;
      let p = q.tense==='imp' ? '('+IMP_PR[q.i]+')' : (q.v.imps ? 'il' : PR[q.i]);
      if(q.tense==='subj') p = ((q.i===2||q.i===5)?"qu'":'que ')+p;
      $('.tr-pron').textContent = p;
    }
    inp.value=''; fb.className='fb'; fb.innerHTML=''; card.classList.remove('is-ok','is-bad','is-near');
    stats(); inp.focus({preventScroll:true});
  }
  S.next = next;
  function stats(){
    const rep = S.queue.length;
    $('.tr-stats').textContent = `Richtig ${S.right} · Falsch ${S.wrong} · Serie ${S.streak}${rep?` · ${rep} zum Wiederholen`:''}`;
  }
  function stripPron(s){
    return s.replace(/^\s*(que\s+|qu')?\s*(j'|je\s+|tu\s+|il\/elle\s+|ils\/elles\s+|ils\s+|elles\s+|il\s+|elle\s+|on\s+|nous\s+|vous\s+)/i,'');
  }
  function check(){
    const q = S.cur; if(!q || S.done) { if(S.done) next(); return; }
    let v = inp.value; if(!v.trim()){ fb.className='fb'; fb.innerHTML='<p>Schreib zuerst eine Form.</p>'; return; }
    if(q.tense!=='ps' && q.tense!=='imp') v = stripPron(v);
    const r = analyse(v, q.ans, null);
    S.done = true;
    card.classList.remove('is-ok','is-bad','is-near');
    const full = q.tense==='ps' ? q.v.inf : (q.tense==='imp' ? q.ans[0]+' !' : withPron(q.i, q.ans[0], q.tense==='subj', q.v.imps));
    if(r.kind==='ok'){ S.right++; S.streak++; card.classList.add('is-ok'); fb.className='fb ok'; fb.innerHTML=`<p><strong>Richtig!</strong> <span lang="fr">${esc(full)}</span></p>`; }
    else {
      S.wrong++; S.streak=0;
      S.queue.push(Object.assign({}, q, {due:S.count+3, repeat:true}));
      const near = r.kind==='accent'||r.kind==='typo';
      card.classList.add(near?'is-near':'is-bad'); fb.className='fb '+(near?'near':'bad');
      const head = r.kind==='accent' ? 'Fast richtig: nur die Akzente stimmen nicht.' : r.kind==='typo' ? 'Fast richtig: ein Schreibfehler.' : 'Leider falsch.';
      fb.innerHTML = `<p><strong>${head}</strong> Richtig ist <b lang="fr">${esc(full)}</b>.</p>${issueList(r.ops)}${near?'':`<p class="why">${TIP[q.tense](q.v)}</p>`}<p class="muted small">Diese Form kommt gleich nochmals.</p>`;
    }
    stats();
  }
  function showSol(){
    const q = S.cur; if(!q || S.done) return;
    S.done = true; S.wrong++; S.streak=0;
    S.queue.push(Object.assign({}, q, {due:S.count+3, repeat:true}));
    inp.value = q.ans[0];
    fb.className='fb shown'; fb.innerHTML = `<p><strong>Lösung:</strong> <b lang="fr">${esc(q.ans[0])}</b></p><p class="why">${TIP[q.tense](q.v)}</p>`;
    stats();
  }
  $('#trCheck').addEventListener('click', check);
  $('#trShow').addEventListener('click', showSol);
  $('#trNext').addEventListener('click', next);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); check(); } });
  inp.addEventListener('input', ()=>{ if(S.done && S.cur && !card.classList.contains('is-ok')) { /* weiterschreiben erlaubt */ } });
  wrap.querySelector('.keys').addEventListener('mousedown', e=>{ if(e.target.closest('.key')) e.preventDefault(); });
  wrap.querySelector('.keys').addEventListener('click', e=>{ const k=e.target.closest('.key'); if(k) insertChar(inp, k.dataset.c); });
  wrap.querySelectorAll('.tchip input[type=checkbox]').forEach(c=>c.addEventListener('change',()=>{
    if(c.checked) S.tenses.add(c.value); else S.tenses.delete(c.value);
    if(!S.tenses.size){ c.checked = true; S.tenses.add(c.value); }
    S.queue = S.queue.filter(q=>S.tenses.has(q.tense)); persist(); next();
  }));
  wrap.querySelectorAll('.tchip input[type=radio]').forEach(r=>r.addEventListener('change',()=>{
    S.set = r.value; if(r.value!=='only') { S.only=null; } S.queue=[]; persist(); next();
  }));
  next();
}

/* ---------- Router ---------- */
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  const t = TOPICS.find(x=>x.id===h);
  trState = null;
  if(t){ renderTopic(t); setActive(t.id); document.title = t.fr + ' – Grammaire française'; }
  else if(h==='test'){ renderTest(); setActive('test'); document.title = 'Gemischter Test – Grammaire française'; }
  else if(h==='verbes'){ renderVerbs(); setActive('verbes'); document.title = 'Unregelmässige Verben – Grammaire française'; }
  else { renderHome(); setActive('start'); document.title = 'Grammaire française – Matura'; }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
markNav();
route();
})();
</script>
</body>
