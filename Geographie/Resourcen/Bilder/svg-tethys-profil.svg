<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe0f5"/>
      <stop offset="100%" stop-color="#5aa3d8"/>
    </linearGradient>
    <pattern id="kontikruste" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#e7ded0"/>
      <circle cx="3" cy="3" r="1.3" fill="#b5a482"/>
      <circle cx="8" cy="8" r="1.3" fill="#b5a482"/>
    </pattern>
    <pattern id="ozeankruste" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#4a5568"/>
      <line x1="0" y1="8" x2="8" y2="0" stroke="#2d3748" stroke-width="1.1"/>
    </pattern>
    <pattern id="kalk" width="10" height="8" patternUnits="userSpaceOnUse">
      <rect width="10" height="8" fill="#f3eddc"/>
      <line x1="0" y1="2" x2="10" y2="2" stroke="#b3a06c" stroke-width="1"/>
      <line x1="0" y1="6" x2="10" y2="6" stroke="#b3a06c" stroke-width="1"/>
    </pattern>
    <pattern id="ton" width="10" height="8" patternUnits="userSpaceOnUse">
      <rect width="10" height="8" fill="#d9dee7"/>
      <line x1="0" y1="4" x2="10" y2="4" stroke="#8b98ab" stroke-width="1"/>
    </pattern>
    <pattern id="radiolarit" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#c8b6d4"/>
      <circle cx="3" cy="3" r="1.5" fill="#6f5b82"/>
      <circle cx="9" cy="9" r="1.5" fill="#6f5b82"/>
    </pattern>
    <pattern id="dolomit" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#efe2c4"/>
      <rect x="1" y="1" width="3.5" height="3.5" fill="#c9a86a"/>
      <rect x="6" y="6" width="3.5" height="3.5" fill="#c9a86a"/>
    </pattern>
  </defs>

  <rect width="1240" height="640" fill="#ffffff"/>
  <text x="620" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Die Tethys zur Jurazeit — Ablagerungsräume</text>
  <text x="620" y="52" text-anchor="middle" font-size="12.5" fill="#5a6b7c">Profilskizze · ca. 206 – 144 Mio. Jahre vor heute · maximale Ausdehnung ca. 1500 km</text>

  <!-- Wasser -->
  <path d="M80,270 L230,270 L330,300 L430,360 L520,430 L585,468 L620,474 L655,468 L720,430 L810,360 L910,300 L1010,270 L1160,270 L1160,474 L80,474 Z"
        fill="url(#water)" opacity="0.55"/>
  <line x1="80" y1="270" x2="230" y2="270" stroke="#2c6da4" stroke-width="2"/>
  <line x1="1010" y1="270" x2="1160" y2="270" stroke="#2c6da4" stroke-width="2"/>
  <path d="M230,270 L330,300 L430,360 L520,430 L585,468 L620,474 L655,468 L720,430 L810,360 L910,300 L1010,270"
        fill="none" stroke="#2c6da4" stroke-width="2"/>

  <!-- Sedimentauflagen -->
  <!-- Europäischer Kontinent -->
  <path d="M80,270 L230,270 L230,320 L80,320 Z" fill="url(#kontikruste)" stroke="#b5a482"/>
  <!-- Europäisches Schelf -->
  <path d="M230,270 L330,300 L430,360 L520,430 L520,462 L430,392 L330,332 L230,302 Z" fill="url(#kalk)" stroke="#b3a06c"/>
  <!-- Walliser Trog (Ton/Radiolarit) -->
  <path d="M520,430 L585,468 L585,502 L520,462 Z" fill="url(#ton)" stroke="#8b98ab"/>
  <path d="M520,430 L585,468 L585,468 L520,452 Z" fill="url(#radiolarit)" stroke="#6f5b82" opacity="0.85"/>
  <!-- Briançonnais-Schwelle -->
  <path d="M585,468 L620,474 L655,468 L655,492 L620,498 L585,492 Z" fill="url(#kalk)" stroke="#b3a06c"/>
  <!-- Piemont-Trog -->
  <path d="M655,468 L720,430 L720,462 L655,502 Z" fill="url(#ton)" stroke="#8b98ab"/>
  <path d="M655,468 L720,430 L720,450 L655,482 Z" fill="url(#radiolarit)" stroke="#6f5b82" opacity="0.85"/>
  <!-- Mittelozeanischer Rücken -->
  <path d="M585,492 L620,498 L655,492 L655,528 L620,538 L585,528 Z" fill="url(#ozeankruste)" stroke="#2d3748"/>
  <!-- Ostalpiner Raum (afrikanisches Schelf) -->
  <path d="M720,430 L810,360 L910,300 L1010,270 L1010,302 L910,332 L810,392 L720,462 Z" fill="url(#dolomit)" stroke="#c9a86a"/>
  <!-- Afrikanischer Kontinent -->
  <path d="M1010,270 L1160,270 L1160,320 L1010,320 Z" fill="url(#kontikruste)" stroke="#b5a482"/>

  <!-- Kontinentale Kruste (Nord/Süd) -->
  <path d="M80,320 L230,320 L230,545 L80,545 Z" fill="url(#kontikruste)" stroke="#b5a482"/>
  <path d="M1010,320 L1160,320 L1160,545 L1010,545 Z" fill="url(#kontikruste)" stroke="#b5a482"/>

  <!-- Beschriftungen -->
  <g font-size="11.5" fill="#2c3e50">
    <text x="155" y="248" text-anchor="middle" font-weight="700">Europäischer</text>
    <text x="155" y="263" text-anchor="middle" font-weight="700">Kontinent</text>
    <text x="155" y="300" text-anchor="middle" font-size="10" fill="#6b5c3e">kontinentale Kruste</text>

    <text x="365" y="252" text-anchor="middle" font-weight="700">Europäisches Schelfgebiet</text>
    <text x="365" y="268" text-anchor="middle" font-size="10.5">helvetischer Ablagerungsraum</text>
    <text x="365" y="330" text-anchor="middle" font-size="10.5">Korallenkalke · mikritische Kalke</text>
    <text x="365" y="346" text-anchor="middle" font-size="10.5">Sandsteine · Mergel</text>

    <text x="620" y="120" text-anchor="middle" font-weight="700" font-size="13">Tiefsee der Tethys</text>
    <text x="620" y="138" text-anchor="middle" font-size="11">penninischer Ablagerungsraum · ca. 1500 km breit</text>

    <text x="545" y="396" text-anchor="middle" font-size="10.5" font-weight="600">Walliser Trog</text>
    <text x="545" y="412" text-anchor="middle" font-size="10">Tone · Radiolarite</text>

    <text x="620" y="452" text-anchor="middle" font-size="10" font-weight="600">Briançonnais-Schwelle</text>
    <text x="620" y="466" text-anchor="middle" font-size="9.5">Kalke · Mergel</text>

    <text x="692" y="396" text-anchor="middle" font-size="10.5" font-weight="600">Piemont-Trog</text>
    <text x="692" y="412" text-anchor="middle" font-size="10">Tone · Radiolarite</text>
    <text x="620" y="522" text-anchor="middle" font-size="10" fill="#e2e8f0" font-weight="600">mittelozeanischer Rücken</text>
    <text x="620" y="536" text-anchor="middle" font-size="9.5" fill="#cbd5e0">ozeanische Kruste</text>

    <text x="860" y="252" text-anchor="middle" font-weight="700">Afrikanisches Schelfgebiet</text>
    <text x="860" y="268" text-anchor="middle" font-size="10.5">ostalpiner Ablagerungsraum</text>
    <text x="860" y="330" text-anchor="middle" font-size="10.5">feine Kalke → Dolomit</text>

    <text x="1085" y="248" text-anchor="middle" font-weight="700">Afrikanischer</text>
    <text x="1085" y="263" text-anchor="middle" font-weight="700">Kontinent</text>
    <text x="1085" y="300" text-anchor="middle" font-size="10" fill="#6b5c3e">südalpiner Raum: Flachmeersedimente</text>
  </g>

  <!-- Tiefenachse -->
  <g transform="translate(50,300)" font-size="10.5" fill="#5a6b7c">
    <line x1="0" y1="-30" x2="0" y2="250" stroke="#9aa5b1" stroke-width="1.5"/>
    <path d="M-5,250 L5,250 L0,262 Z" fill="#9aa5b1"/>
    <text transform="rotate(-90 0 120)" x="0" y="120" text-anchor="middle">Wassertiefe</text>
    <text x="8" y="-24">0 m</text>
  </g>

  <!-- Breitenangabe -->
  <g transform="translate(620,588)" font-size="11" fill="#5a6b7c">
    <line x1="-540" y1="0" x2="540" y2="0" stroke="#9aa5b1" stroke-width="1.3" stroke-dasharray="6 4"/>
    <path d="M-546,-5 L-534,-5 L-540,6 Z" fill="#9aa5b1"/>
    <path d="M546,-5 L534,-5 L540,6 Z" fill="#9aa5b1"/>
    <text y="-10" text-anchor="middle">ca. 1500 km — maximale Breite der Tethys im Jura</text>
    <text x="-520" y="20" font-weight="600">Norden (Laurasia / Europa)</text>
    <text x="520" y="20" text-anchor="end" font-weight="600">Süden (Gondwana / Afrika)</text>
  </g>

  <!-- Legende -->
  <g transform="translate(95,622)" font-size="10" fill="#2c3e50">
    <rect x="-12" y="-14" width="1090" height="26" rx="6" fill="#f7f9fb" stroke="#d5dde5"/>
    <g transform="translate(4,2)">
      <rect x="0" y="-9" width="16" height="16" fill="url(#kalk)" stroke="#b3a06c"/><text x="22" y="4">Kalke / Mergel</text>
      <rect x="130" y="-9" width="16" height="16" fill="url(#ton)" stroke="#8b98ab"/><text x="152" y="4">Tone</text>
      <rect x="215" y="-9" width="16" height="16" fill="url(#radiolarit)" stroke="#6f5b82"/><text x="237" y="4">Radiolarite</text>
      <rect x="330" y="-9" width="16" height="16" fill="url(#dolomit)" stroke="#c9a86a"/><text x="352" y="4">Dolomit</text>
      <rect x="430" y="-9" width="16" height="16" fill="url(#ozeankruste)" stroke="#2d3748"/><text x="452" y="4">ozeanische Kruste</text>
      <rect x="590" y="-9" width="16" height="16" fill="url(#kontikruste)" stroke="#b5a482"/><text x="612" y="4">kontinentale Kruste</text>
    </g>
  </g>
</svg>
