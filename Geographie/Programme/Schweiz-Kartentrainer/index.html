    <title>Schweizer Kartentrainer</title>

    <style>
:root {

  --dot-mountain: #e4ad70;
  --dot-pass: #ff8f7a;

}

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #edf3f0;
  --panel: #f8fbf7;
  --surface: #ffffff;
  --surface-2: #edf4f1;
  --ink: #17211e;
  --muted: #61716a;
  --soft: #7a8982;
  --line: #d9e2dd;
  --line-strong: #a9bbb3;
  --water-bg: #dceff4;
  --land: #e8eee4;
  --land-border: #748c7e;
  --accent: #187d78;
  --accent-strong: #095f5b;
  --accent-soft: rgba(24, 125, 120, 0.12);
  --focus: #c88415;
  --good: #16835b;
  --bad: #c94436;
  --warn: #a5670d;
  --shadow: 0 18px 52px rgba(21, 38, 33, 0.16);
  --label-halo: #f8fbf7;

  --dot-city: #a66a00;

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); }
button, input { font: inherit; }

button:disabled { cursor: not-allowed; opacity: .45; }
button, input, summary, a, [tabindex] { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); }
.app-shell { display: grid; grid-template-columns: 400px minmax(0, 1fr); height: 100dvh; min-height: 520px; }
.side-panel { z-index: 2; overflow-y: auto; padding: 28px 24px; background: var(--panel); border-right: 1px solid var(--line); }
.setup-card, .game-card { display: grid; gap: 24px; }
.setup-title { display: grid; gap: 12px; }
.setup-title > span, .map-kicker { color: var(--accent-strong); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
h1 { margin: 0; font-size: 32px; font-weight: 650; letter-spacing: -.025em; line-height: 1.15; }
.setup-title p, .mode-help { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0; }
.setup-section { display: grid; gap: 12px; padding-top: 20px; border-top: 1px solid var(--line); }
.section-title { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
h2 { margin: 0; font-size: 14px; font-weight: 650; }

.type-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.type-toggle { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--muted); text-align: left; }
.type-toggle.active { color: var(--ink); background: var(--accent-soft); border-color: var(--accent); }
.type-toggle.active::before { content: '✓'; color: var(--accent-strong); }
.type-toggle span { flex: 1; overflow-wrap: anywhere; font-size: 13px; }
.type-toggle small { font-variant-numeric: tabular-nums; }
.segmented { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
.mode-segmented { grid-template-columns: repeat(3, 1fr); }
.segmented button { min-height: 44px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); font-size: 12px; padding: 8px 4px; }
.segmented button.active { background: var(--surface-2); color: var(--ink); font-weight: 650; }
.primary-button, .secondary-button { min-height: 44px; padding: 12px 16px; border: 1px solid transparent; border-radius: 6px; font-weight: 650; font-size: 14px; }
.primary-button { background: var(--accent); color: #fff; }
:root:not([data-theme=light]) .primary-button { color: #071b17; }
.primary-button:hover:not(:disabled) { background: var(--accent-strong); }
.secondary-button { border-color: var(--line-strong); color: var(--ink); background: var(--surface); }
.secondary-button:hover { background: var(--surface-2); }
.mini-button { min-height: 36px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); background: transparent; font-size: 12px; }
.mini-button:hover { color: var(--ink); border-color: var(--line-strong); }
.setup-footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 20px; border-top: 1px solid var(--line); }
.setup-footer strong { display: block; font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
.setup-footer span, .source-note { font-size: 12px; color: var(--muted); }
.source-details { color: var(--muted); font-size: 12px; line-height: 1.6; padding-top: 12px; border-top: 1px solid var(--line); }
summary { cursor: pointer; font-weight: 600; }
.source-details p { margin: 12px 0 0; overflow-wrap: anywhere; }
a { color: var(--accent-strong); text-underline-offset: 3px; }
.game-header { display: flex; justify-content: space-between; gap: 8px; }
.progress-wrap { display: grid; gap: 8px; }
.progress-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; }
.progress-bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress-bar span { display: block; height: 100%; background: var(--accent); }
.challenge-card { display: grid; gap: 20px; padding: 24px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.prompt-type { color: var(--accent-strong); font-size: 12px; font-weight: 650; letter-spacing: .03em; }
.prompt-main { display: grid; gap: 12px; font-size: 14px; font-weight: 400; color: var(--muted); letter-spacing: 0; line-height: 1.4; }
.prompt-main strong { color: var(--ink); font-size: 30px; font-weight: 650; line-height: 1.15; overflow-wrap: anywhere; }
.answer-form { display: grid; gap: 8px; }
.answer-form input { width: 100%; min-height: 44px; padding: 12px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink); }
.answer-form input::placeholder { color: var(--muted); }
.feedback { padding: 12px; border-left: 3px solid currentColor; background: var(--surface); line-height: 1.5; font-size: 14px; }
.feedback.good { color: var(--good); }
.feedback.bad { color: var(--bad); }
.feedback.warn { color: var(--warn); }
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { padding: 4px 0; }
.stat strong { display: block; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 11px; }
.result-score { margin: 0; display: grid; gap: 8px; }
.result-score strong { font-size: 56px; font-weight: 600; letter-spacing: -.04em; }
.result-score span { color: var(--muted); font-size: 14px; }
.result-list { display: grid; gap: 16px; }
.result-list .section-title span { font-size: 12px; color: var(--muted); }
.miss-list { display: grid; gap: 8px; }
.miss-pill { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.miss-pill span:last-child { color: var(--muted); }
.button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.map-area { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--water-bg); }
.map-svg { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
.map-svg.dragging { cursor: grabbing; }
.map-topbar { position: absolute; z-index: 1; top: 20px; left: 24px; right: 24px; display: flex; align-items: start; justify-content: space-between; gap: 12px; pointer-events: none; }
.map-topbar > * { pointer-events: auto; }
.map-topbar > div:first-child { padding: 12px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
#map-mode-label { display: block; margin-top: 4px; font-size: 14px; font-weight: 500; }
.map-actions { display: flex; gap: 4px; }
.icon-button { width: 44px; height: 44px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--panel); color: var(--ink); font-size: 18px; }
#zoom-reset { font-size: 12px; }
.map-help { position: absolute; bottom: 12px; left: 24px; max-width: calc(100% - 160px); padding: 8px; margin: 0; border-radius: 4px; background: var(--panel); color: var(--muted); font-size: 11px; line-height: 1.6; pointer-events: none; }
.map-legend { position: absolute; right: 24px; bottom: 20px; width: max-content; max-width: calc(100% - 48px); padding: 12px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; font-size: 12px; }
.legend-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.legend-item { display: flex; align-items: center; gap: 8px; }
.legend-icon { width: 20px; height: 20px; }
.legend-ring { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.8; }
.legend-shape { fill: currentColor; }
.legend-icon.marker-country { color: var(--dot-country); }
.legend-icon.marker-city { color: var(--dot-city); }
.legend-icon.marker-island, .legend-icon.marker-peninsula { color: var(--dot-island); }
.legend-icon.marker-region { color: var(--dot-region); }
.legend-icon.marker-mountain { color: var(--dot-mountain); }
.legend-icon.marker-pass { color: var(--dot-pass); }
.legend-icon.marker-water, .legend-icon.marker-river { color: var(--dot-water); }

.base-country {
  fill: var(--land);
  stroke: var(--land-border);
  stroke-width: 0.75;
  vector-effect: non-scaling-stroke;
}

.base-home { stroke-width: 1.6; stroke: var(--land-border); fill: color-mix(in srgb, var(--land) 80%, var(--ink) 6%); }
.base-lake { fill: var(--water-bg); stroke: color-mix(in srgb, var(--dot-water) 55%, transparent); stroke-width: 0.6; vector-effect: non-scaling-stroke; }
.base-river { fill: none; stroke: color-mix(in srgb, var(--dot-water) 38%, transparent); stroke-width: 0.7; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }

.study-feature {
  pointer-events: none;
  vector-effect: non-scaling-stroke;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.78;
}

.study-area {
  fill: color-mix(in srgb, var(--ink) 4%, transparent);
  stroke: color-mix(in srgb, var(--ink) 32%, transparent);
  stroke-width: 1.2;
}

.study-island {
  fill: color-mix(in srgb, var(--dot-island) 11%, transparent);
  stroke: color-mix(in srgb, var(--dot-island) 70%, transparent);
}

.study-region {
  fill: color-mix(in srgb, var(--dot-region) 9%, transparent);
  stroke: color-mix(in srgb, var(--dot-region) 58%, transparent);
  stroke-dasharray: 6 5;
}

.study-line {
  fill: none;
  stroke-width: 2.1;
}

.study-mountain {
  stroke: color-mix(in srgb, var(--dot-mountain) 76%, transparent);
  stroke-dasharray: 5 4;
}

.study-water {
  fill: color-mix(in srgb, var(--dot-water) 10%, transparent);
  stroke: color-mix(in srgb, var(--dot-water) 72%, transparent);
}

.study-water.study-line {
  fill: none;
  stroke-width: 2.4;
}

.map-marker {
  cursor: pointer;
  pointer-events: none;
  transition: opacity 160ms ease;
}

.marker-ring {
  fill: var(--surface);
  stroke: var(--line-strong);
  stroke-width: 1.8;
  vector-effect: non-scaling-stroke;
}

.marker-symbol {
  fill: var(--ink);
  stroke: var(--bg);
  stroke-width: 1.4;
  vector-effect: non-scaling-stroke;
}

.marker-country .marker-symbol { fill: var(--dot-country); }
.marker-city .marker-symbol { fill: var(--dot-city); }
.marker-island .marker-symbol { fill: var(--dot-island); }
.marker-region .marker-symbol { fill: var(--dot-region); }
.marker-mountain .marker-symbol { fill: var(--dot-mountain); }
.marker-pass .marker-symbol { fill: var(--dot-pass); }
.marker-water .marker-symbol { fill: var(--dot-water); }

.map-marker.hovered .marker-ring,
.map-marker.current .marker-ring {
  fill: var(--accent-soft);
  stroke: var(--accent-strong);
}

.hover-box {
  fill: color-mix(in srgb, var(--focus) 10%, transparent);
  stroke: var(--focus);
  stroke-width: 2.5;
  stroke-dasharray: 7 5;
  pointer-events: none;
  vector-effect: non-scaling-stroke;
  stroke-linecap: round;
  stroke-linejoin: round;
  animation: box-in 160ms ease both;
}

.hover-box.highlight-line {
  fill: none;
}

.current-box {
  fill: color-mix(in srgb, var(--accent) 11%, transparent);
  stroke: var(--accent-strong);
}

.good-box {
  fill: color-mix(in srgb, var(--good) 11%, transparent);
  stroke: var(--good);
}

.bad-box {
  fill: color-mix(in srgb, var(--bad) 11%, transparent);
  stroke: var(--bad);
}

.highlight {
  fill: color-mix(in srgb, var(--focus) 24%, transparent);
  stroke: var(--focus);
  stroke-width: 4;
  vector-effect: non-scaling-stroke;
  pointer-events: none;
  animation: pulse-stroke 1250ms ease-in-out infinite;
}

.highlight.good {
  fill: color-mix(in srgb, var(--good) 22%, transparent);
  stroke: var(--good);
}

.highlight.bad {
  fill: color-mix(in srgb, var(--bad) 20%, transparent);
  stroke: var(--bad);
}

.highlight.practice-revealed {
  fill: color-mix(in srgb, var(--accent) 16%, transparent);
  stroke: var(--accent-strong);
  animation: box-in 160ms ease both;
}

.highlight-line {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.highlight-point {
  filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.32));
}

.map-label {
  fill: var(--ink);
  stroke: var(--label-halo);
  stroke-width: 4;
  paint-order: stroke fill;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 0;
  text-anchor: middle;
  pointer-events: none;
}

.marker-peninsula .marker-symbol { fill: var(--dot-island); }
.marker-river .marker-symbol { fill: var(--dot-water); }
.study-peninsula { fill: color-mix(in srgb, var(--dot-island) 8%, transparent); stroke: var(--dot-island); }
.study-river { fill: none; stroke: var(--dot-water); }
.map-marker:focus-visible .marker-ring { stroke: var(--focus); stroke-width: 4; }
.toast { position: absolute; z-index: 3; bottom: 80px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); background: var(--panel); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 6px; padding: 12px 16px; font-size: 13px; line-height: 1.5; pointer-events: none; }
@media (max-width: 980px) {

@media (max-width: 720px) {

@media (prefers-reduced-motion: reduce) {

    <noscript>Bitte aktiviere JavaScript, um mit der Lernkarte zu üben.</noscript>
    <div id="app" class="app-shell setup-layout">
      <aside class="side-panel" aria-label="Lernsteuerung">
        <div id="panel-root"></div>
      </aside>

      <main class="map-area">
        <div class="map-topbar">
          <div>
            <span class="map-kicker">Lernkarte</span>
            <strong id="map-mode-label">Bereit</strong>
          </div>
          <div class="map-actions" aria-label="Kartensteuerung">
            <button id="zoom-out" class="icon-button" type="button" title="Herauszoomen" aria-label="Herauszoomen">−</button>
            <button id="zoom-reset" class="icon-button" type="button" title="Ansicht zurücksetzen" aria-label="Ansicht zurücksetzen">1:1</button>
            <button id="zoom-in" class="icon-button" type="button" title="Hineinzoomen" aria-label="Hineinzoomen">+</button>
          </div>
        </div>

        <svg id="map-svg" class="map-svg" viewBox="0 0 1080 760" role="group" aria-label="Interaktive Lernkarte" aria-describedby="map-help">
          <defs>
            <filter id="label-halo" x="-40%" y="-40%" width="180%" height="180%">
              <feMorphology operator="dilate" radius="2" in="SourceAlpha" result="dilated"></feMorphology>
              <feFlood flood-color="#101413" flood-opacity="0.94" result="halo"></feFlood>
              <feComposite in="halo" in2="dilated" operator="in" result="haloShape"></feComposite>
              <feMerge>
                <feMergeNode in="haloShape"></feMergeNode>
                <feMergeNode in="SourceGraphic"></feMergeNode>
              </feMerge>
            </filter>
          </defs>
          <g id="map-content">
            <g id="base-layer"></g>
            <g id="study-layer"></g>
            <g id="hit-layer"></g>
            <g id="highlight-layer"></g>
          </g>
        </svg>

        <p id="map-help" class="map-help">Ziehen zum Verschieben · + / − zum Zoomen<span class="keyboard-help"><br>Tastatur: Tab zu den Punkten, Pfeiltasten, Enter zum Auswählen</span></p>
        <div id="toast" class="toast" role="status" hidden></div>
        <div id="map-legend" class="map-legend" hidden></div>
      </main>
    </div>

const TYPE_LABELS = Object.freeze({
  country: 'Länder', city: 'Städte', water: 'Gewässer', river: 'Flüsse',
  region: 'Regionen', island: 'Inseln', peninsula: 'Halbinseln', mountain: 'Gebirge', pass: 'Pässe',
});
const TYPE_ORDER = Object.keys(TYPE_LABELS);
const ID = /^[a-z0-9][a-z0-9_-]*$/;
const text = (value) => typeof value === 'string' && value.trim().length > 0;
const fail = (at, message) => { throw new Error(`${at}: ${message}`); };

function validateConfig(config) {
  if (config?.schemaVersion !== 1) fail('config.schemaVersion', 'expected 1');
  if (typeof config.id !== 'string' || !ID.test(config.id)) fail('config.id', 'use lowercase letters, digits, hyphens or underscores');
  for (const key of ['title', 'region', 'description']) if (!text(config[key])) fail(`config.${key}`, 'required text');
  if (!/^data\/[a-zA-Z0-9_-]+\.json$/.test(config.data || '')) fail('config.data', 'expected data/<filename>.json');
  return config;
}

function validateBounds(bounds) {
  if (!Array.isArray(bounds) || bounds.length !== 4 || !bounds.every(Number.isFinite)) fail('bounds', 'expected [west, south, east, north]');
  const [w, s, e, n] = bounds;
  if (w < -180 || e > 540 || e <= w || e - w > 360 || s < -84 || n > 84 || s >= n) {
    fail('bounds', 'require west < east (span <= 360), -180 <= west, east <= 540 and -84 <= south < north <= 84');
  }
}

function validateGeometry(geometry, at = 'geometry') {
  const pos = (p) => Array.isArray(p) && p.length === 2 && p.every(Number.isFinite) &&
    p[0] >= -180 && p[0] <= 540 && p[1] >= -90 && p[1] <= 90;
  const line = (coords, ring = false) => {
    if (!Array.isArray(coords) || coords.length < (ring ? 4 : 2) || !coords.every(pos)) fail(at, 'invalid coordinates');
    if (ring && (coords[0][0] !== coords.at(-1)[0] || coords[0][1] !== coords.at(-1)[1])) fail(at, 'polygon rings must be closed');
  };
  const list = (coords, visit) => {
    if (!Array.isArray(coords) || !coords.length) fail(at, 'empty coordinate array');
    coords.forEach(visit);
  };
  const polygon = (coords) => list(coords, (ring) => line(ring, true));
  const c = geometry?.coordinates;
  switch (geometry?.type) {
    case 'Point': if (!pos(c)) fail(at, 'invalid Point'); break;
    case 'LineString': line(c); break;
    case 'MultiLineString': list(c, (l) => line(l)); break;
    case 'Polygon': polygon(c); break;
    case 'MultiPolygon': list(c, polygon); break;
    default: fail(at, 'supported: Point, LineString, MultiLineString, Polygon, MultiPolygon');
  }
  return geometry;
}

function validateDataset(data) {
  validateBounds(data?.bounds);
  if (data.projection !== 'web-mercator') fail('projection', 'expected web-mercator');
  if (!Array.isArray(data.items) || !data.items.length) fail('items', 'at least one learning item is required');
  if (data.baseMap?.type !== 'FeatureCollection' || !data.baseMap.features?.length) fail('baseMap', 'nonempty FeatureCollection required');
  data.baseMap.features.forEach((f, i) => validateGeometry(f.geometry, `baseMap.features[${i}]`));
  const ids = new Set();
  const anchors = new Set();
  for (const [i, item] of data.items.entries()) {
    const at = `items[${i}]`;
    if (typeof item.id !== 'string' || !ID.test(item.id) || ids.has(item.id)) fail(`${at}.id`, 'invalid or duplicate id');
    ids.add(item.id);
    if (!TYPE_ORDER.includes(item.type)) fail(`${at}.type`, `expected one of ${TYPE_ORDER.join(', ')}`);
    if (!text(item.name) || !text(item.source)) fail(at, 'name and source are required');
    if (item.aliases !== undefined && (!Array.isArray(item.aliases) || !item.aliases.every(text))) fail(`${at}.aliases`, 'expected array of nonempty strings');
    validateGeometry({ type: 'Point', coordinates: item.anchor }, `${at}.anchor`);
    const [x, y] = item.anchor, [w, s, e, n] = data.bounds;
    if (x < w || x > e || y < s || y > n) fail(`${at}.anchor`, 'must be inside map bounds');
    const anchorKey = item.anchor.join(',');
    if (anchors.has(anchorKey)) fail(`${at}.anchor`, 'two items share the same point; choose separate teaching anchors');
    anchors.add(anchorKey);
    validateGeometry(item.geometry, `${at}.geometry`);
  }
  if (!Array.isArray(data.sources) || !data.sources.length) fail('sources', 'at least one attribution required');
  for (const source of data.sources) {
    if (!text(source.title)) fail('sources.title', 'required');
    if (source.url) {
      let url;
      try { url = new URL(source.url); } catch { fail('sources.url', 'invalid URL'); }
      if (!['https:', 'http:'].includes(url.protocol) || url.username || url.password) fail('sources.url', 'use public HTTP(S) URLs without credentials');
    }
  }
  if (data.typeLabels && (typeof data.typeLabels !== 'object' || Array.isArray(data.typeLabels) ||
    Object.entries(data.typeLabels).some(([type, label]) => !TYPE_ORDER.includes(type) || !text(label)))) fail('typeLabels', 'invalid category labels');
  if (data.notes && (!Array.isArray(data.notes) || !data.notes.every(text))) fail('notes', 'expected text array');
  return data;
}

const MAP_WIDTH = 1080;
const MAP_HEIGHT = 760;

function matchAnswer(answer, item, allItems = []) {
  const normalizedAnswer = normalizeAnswer(answer);
  if (!normalizedAnswer) return { result: "wrong" };
  const accepted = [...new Set([item.name, ...(item.aliases || [])])];
  const normalizedAccepted = accepted.map((candidate) => ({
    normalized: normalizeAnswer(candidate),
  }));

  const exact = normalizedAccepted.find((candidate) => candidate.normalized === normalizedAnswer);
  if (exact) return { result: "correct" };

  // Do not turn a different valid place (Iran/Irak) into a spelling correction.
  if (allItems.some((other) => other !== item &&
    [other.name, ...(other.aliases || [])].some((name) => normalizeAnswer(name) === normalizedAnswer))) {
    return { result: "wrong" };
  }

  let best = null;
  for (const candidate of normalizedAccepted) {
    const distance = levenshtein(normalizedAnswer, candidate.normalized);
    if (!best || distance < best.distance) {
      best = { ...candidate, distance };
    }
  }

  if (best && best.distance <= typoThreshold(best.normalized.length)) {
    return {
      result: "typo",
      message: `Fast richtig, aber achte auf die Schreibweise: ${item.name}.`,
    };
  }

  return { result: "wrong" };
}

function normalizeAnswer(value) {
  return String(value)
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/ß/g, "ss")
    .replace(/[^\p{L}\p{N}]+/gu, " ")
    .trim();
}

function typoThreshold(length) {
  if (length <= 4) return 0;
  if (length <= 9) return 1;
  return 2;
}

function levenshtein(a, b) {
  const previous = Array.from({ length: b.length + 1 }, (_, index) => index);
  const current = Array.from({ length: b.length + 1 }, () => 0);

  for (let i = 1; i <= a.length; i += 1) {
    current[0] = i;
    for (let j = 1; j <= b.length; j += 1) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      current[j] = Math.min(
        current[j - 1] + 1,
        previous[j] + 1,
        previous[j - 1] + cost,
      );
    }
    previous.splice(0, previous.length, ...current);
  }

  return previous[b.length];
}

function createProjector(bounds) {
  const [minLon, minLat, maxLon, maxLat] = bounds;
  const pad = 28;
  const minY = mercatorY(minLat);
  const maxY = mercatorY(maxLat);
  const usableWidth = MAP_WIDTH - pad * 2;
  const usableHeight = MAP_HEIGHT - pad * 2;
  const lonSpan = (maxLon - minLon) * Math.PI / 180;
  const scale = Math.min(usableWidth / lonSpan, usableHeight / (maxY - minY));
  const offsetX = (MAP_WIDTH - lonSpan * scale) / 2;
  const offsetY = (MAP_HEIGHT - (maxY - minY) * scale) / 2;

  return {
    project([lon, lat]) {
      const x = offsetX + (lon - minLon) * Math.PI / 180 * scale;
      const y = offsetY + (maxY - mercatorY(lat)) * scale;
      return [x, y];
    },
  };
}

function mercatorY(lat) {
  const clipped = Math.max(Math.min(lat, 84), -84);
  const radians = (clipped * Math.PI) / 180;
  return Math.log(Math.tan(Math.PI / 4 + radians / 2));
}

function projectedLinePath(points, projector) {
  return points.map((point, index) => {
    const [x, y] = projector.project(point);
    // Split at the opposite longitude seam instead of drawing a line across the viewport.
    const move = index === 0 || Math.abs(point[0] - points[index - 1][0]) > 180;
    return `${move ? 'M' : 'L'}${x.toFixed(2)} ${y.toFixed(2)}`;
  }).join(' ');
}

  const replacement = (focusId && elements.panel.querySelector(`#${focusId}`))
    || (focusType && elements.panel.querySelector(`[data-type="${focusType}"]`))
    || (focusMode && elements.panel.querySelector(`[data-mode="${focusMode}"]`))
    || (focusTheme && elements.panel.querySelector(`[data-theme="${focusTheme}"]`))
    || (focusAction && elements.panel.querySelector(`[${focusAction}]`));
  if (replacement) replacement.focus({ preventScroll: true });
  else if (state.phase === "quiz") (elements.panel.querySelector('#next-question')
    || elements.panel.querySelector('#answer-input') || elements.panel.querySelector('h1'))?.focus({ preventScroll: true });
  else if (focus && ['setup', 'results'].includes(state.phase)) elements.panel.querySelector('h1')?.focus({ preventScroll: true });
  renderMap();
  renderLegend();
  renderToast();
  updateModeLabel();
}

function renderLayoutMode() {
  const isSetup = state.phase === "setup" || state.phase === "loading" || state.phase === "error";
  const isGame = state.phase === "quiz" || state.phase === "results";
  elements.app.classList.toggle("setup-layout", isSetup);
  elements.app.classList.toggle("game-layout", isGame);
  document.body.classList.toggle("is-setup", isSetup);
  document.body.classList.toggle("is-game", isGame);
}

function renderPanel() {
  if (state.phase === "loading") {
    elements.panel.innerHTML = `
      <div class="setup-card">
        <div class="setup-title">
          <span>${escapeHtml(config?.title || "Karten-Trainer")}</span>
          <h1>Kartendaten laden</h1>
        </div>
      </div>
    `;
    return;
  }

  if (state.phase === "setup") {
    renderSetupPanel();
    return;
  }

  if (state.phase === "quiz") {
    renderQuizPanel();
    return;
  }

  if (state.phase === "results") {
    renderResultsPanel();
  }
}

function renderQuizPanel() {
  if (state.mode === "practice") {
    renderPracticePanel();
    return;
  }

  const item = state.current;
  const progress = getProgress();
  const feedback = state.feedback
    ? `<div class="feedback ${state.feedback.kind}" role="status">${escapeHtml(state.feedback.message)}</div>`
    : "";
  const prompt = state.mode === "click"
    ? `<span>Klicke den passenden Punkt an</span><strong class="challenge-term">${escapeHtml(item.name)}</strong>`
    : `<span>Wie heißt der markierte Ort?</span><strong>${escapeHtml(data.typeLabels[item.type])}</strong>`;
  const answerArea = state.mode === "type" && !state.answerLocked
    ? `
      <form class="answer-form" id="answer-form">
        <label for="answer-input" class="sr-only">Name des markierten Orts</label>
        <input id="answer-input" type="text" autocomplete="off" placeholder="Antwort eingeben" value="${escapeAttribute(state.selectedAnswer)}" autofocus>
        <button class="primary-button" type="submit">Prüfen</button>
      </form>
    `
    : "";
  const actionArea = state.answerLocked
    ? `<button class="primary-button" type="button" id="next-question">Weiter</button>`
    : `<button class="secondary-button" type="button" id="dont-know">Ich weiss es nicht</button>`;

  elements.panel.innerHTML = `
    <div class="game-card">
      <div class="game-header">
        <button class="mini-button" type="button" id="back-to-setup">Auswahl</button>
        <button class="mini-button" type="button" data-theme-toggle>${state.theme === "dark" ? "Hell" : "Dunkel"}</button>
      </div>

      <div class="progress-wrap">
        <div class="progress-meta">
          <span>${state.retryStage ? "Wiederholung" : "Runde"}</span>
          <span>${progress.label}</span>
        </div>
        <div class="progress-bar" role="progressbar" aria-label="Lernfortschritt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress.percent}"><span style="width:${progress.percent}%"></span></div>
      </div>

      <section class="challenge-card">
        <span class="prompt-type">${escapeHtml(data.typeLabels[item.type])}</span>
        <h1 class="prompt-main" tabindex="-1">${prompt}</h1>
        ${answerArea}
        ${feedback}
        ${actionArea}
      </section>

      <section class="stats-grid">
        <div class="stat"><strong>${state.initialStats.correct}</strong><span>richtig</span></div>
        <div class="stat"><strong>${state.initialStats.wrong}</strong><span>falsch</span></div>
        <div class="stat"><strong>${state.initialStats.unknown}</strong><span>nicht gewusst</span></div>
      </section>
    </div>
  `;

  wirePanelEvents();
}

function renderPracticePanel() {
  const visibleItems = selectedItems();
  const revealedCount = visibleItems.filter((item) => state.revealedIds.has(item.id)).length;

  elements.panel.innerHTML = `
    <div class="game-card practice-card">
      <div class="game-header">
        <button class="mini-button" type="button" id="back-to-setup">Auswahl</button>
        <button class="mini-button" type="button" data-theme-toggle>${state.theme === "dark" ? "Hell" : "Dunkel"}</button>
      </div>

      <section class="challenge-card">
        <span class="prompt-type">Übungsmodus</span>
        <h1 class="prompt-main" tabindex="-1">
          <span>Wähle einen Kartenpunkt, um seinen Namen ein- oder auszublenden.</span>
          <strong>${revealedCount}/${visibleItems.length} sichtbar</strong>
        </h1>
        <div class="button-row">
          <button class="secondary-button" type="button" id="hide-all-labels" ${revealedCount ? "" : "disabled"}>Alle ausblenden</button>
          <button class="secondary-button" type="button" id="show-all-labels" ${revealedCount === visibleItems.length ? "disabled" : ""}>Alle zeigen</button>
        </div>
      </section>

      <section class="stats-grid">
        <div class="stat"><strong>${visibleItems.length}</strong><span>aktiv</span></div>
        <div class="stat"><strong>${revealedCount}</strong><span>sichtbar</span></div>
        <div class="stat"><strong>${visibleItems.length - revealedCount}</strong><span>verdeckt</span></div>
      </section>
    </div>
  `;

  wirePanelEvents();
}

function renderResultsPanel() {
  const wrongItems = [...state.needsPractice.values()];
  const percent = state.initialTotal
    ? Math.round((state.initialStats.correct / state.initialTotal) * 100)
    : 0;
  const missList = wrongItems.length
    ? `<div class="miss-list">${wrongItems.map(({ item, reason }) => `
        <div class="miss-pill">
          <span>${escapeHtml(item.name)}</span>
          <span>${reason === "unknown" ? "nicht gewusst" : "falsch"}</span>
        </div>
      `).join("")}</div>`
    : `<p class="source-note">Keine Fehler in der ersten Runde.</p>`;

  elements.panel.innerHTML = `
    <div class="game-card result-card">
      <div class="game-header">
        <button class="mini-button" type="button" id="back-to-setup">Auswahl</button>
        <button class="mini-button" type="button" data-theme-toggle>${state.theme === "dark" ? "Hell" : "Dunkel"}</button>
      </div>

      <section class="challenge-card">
        <h1 class="prompt-type" tabindex="-1">Runde abgeschlossen</h1>
        <p class="result-score"><strong>${percent}%</strong><span>zuerst richtig</span></p>
      </section>

      <section class="stats-grid">
        <div class="stat"><strong>${state.initialStats.correct}</strong><span>richtig</span></div>
        <div class="stat"><strong>${state.initialStats.wrong}</strong><span>falsch</span></div>
        <div class="stat"><strong>${state.initialStats.unknown}</strong><span>nicht gewusst</span></div>
      </section>

      <section class="result-list">
        <div class="section-title">
          <h2>Wiederholt bis richtig</h2>
          <span>${state.totalAttempts} Antworten</span>
        </div>
        ${missList}
      </section>

      <div class="button-row">
        <button class="primary-button" type="button" id="start-round">Neue Runde</button>
        <button class="secondary-button" type="button" id="reset-setup">Auswahl ändern</button>
      </div>
    </div>
  `;

  wirePanelEvents();
}

function wirePanelEvents() {
  elements.panel.querySelectorAll("[data-type]").forEach((button) => {
    button.addEventListener("click", () => {
      const type = button.dataset.type;
      if (state.selectedTypes.has(type)) {
        state.selectedTypes.delete(type);
      } else {
        state.selectedTypes.add(type);
      }
      renderAll();
    });
  });

  elements.panel.querySelectorAll("[data-mode]").forEach((button) => {
    button.addEventListener("click", () => {
      state.mode = button.dataset.mode;
      renderAll();
    });
  });

  elements.panel.querySelectorAll("[data-theme]").forEach((button) => {
    button.addEventListener("click", () => {
      state.theme = button.dataset.theme;
      applyTheme();
      renderAll();
    });
  });

  elements.panel.querySelector("[data-theme-toggle]")?.addEventListener("click", () => {
    state.theme = state.theme === "dark" ? "light" : "dark";
    applyTheme();
    renderAll();
  });

  elements.panel.querySelector("[data-select-all]")?.addEventListener("click", () => {
    state.selectedTypes = new Set(availableTypes());
    renderAll();
  });

  elements.panel.querySelector("[data-select-countries]")?.addEventListener("click", () => {
    state.selectedTypes = new Set(["country"]);
    renderAll();
  });

  elements.panel.querySelector("#start-round")?.addEventListener("click", startRound);
  elements.panel.querySelector("#reset-setup")?.addEventListener("click", goToSetup);
  elements.panel.querySelector("#back-to-setup")?.addEventListener("click", goToSetup);
  elements.panel.querySelector("#dont-know")?.addEventListener("click", () => finalizeAnswer("unknown"));
  elements.panel.querySelector("#next-question")?.addEventListener("click", nextQuestion);
  elements.panel.querySelector("#hide-all-labels")?.addEventListener("click", () => {
    state.revealedIds.clear();
    renderAll();
  });
  elements.panel.querySelector("#show-all-labels")?.addEventListener("click", () => {
    state.revealedIds = new Set(selectedItems().map((item) => item.id));
    renderAll();
  });

  const form = elements.panel.querySelector("#answer-form");
  const input = elements.panel.querySelector("#answer-input");
  if (input) {
    input.addEventListener("input", (event) => {
      state.selectedAnswer = event.target.value;
    });
    if (!state.answerLocked) requestAnimationFrame(() => input.focus({ preventScroll: true }));
  }
  if (form) {
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      submitTextAnswer();
    });
  }
}

function goToSetup() {
  state.phase = "setup";
  state.current = null;
  state.deck = [];
  state.retryQueue = [];
  state.answerLocked = false;
  state.feedback = null;
  state.clickedId = null;
  state.hoveredId = null;
  state.revealedIds.clear();
  state.selectedAnswer = "";
  resetZoom();
  renderAll();
}

function startRound() {
  const deck = shuffle(selectedItems().map((item) => item.id));
  if (!deck.length) return;
  state.phase = "quiz";
  state.deck = deck;
  state.retryQueue = [];
  state.current = null;
  state.retryStage = false;
  state.answerLocked = false;
  state.feedback = null;
  state.clickedId = null;
  state.hoveredId = null;
  state.revealedIds.clear();
  state.selectedAnswer = "";
  state.initialTotal = deck.length;
  state.initialAnswered = 0;
  state.initialStats = { correct: 0, wrong: 0, unknown: 0 };
  state.totalAttempts = 0;
  state.masteredIds = new Set();
  state.needsPractice = new Map();
  state.history = [];
  resetZoom(false);
  if (state.mode === "practice") {
    renderAll();
    return;
  }
  nextQuestion();
}

function selectedItems() {
  return data.items.filter((item) => state.selectedTypes.has(item.type));
}

function activeMapItems() {
  if (state.phase !== "quiz") return [];
  if (state.mode === "type") return state.current ? [state.current] : [];
  return selectedItems();
}

function nextQuestion() {
  state.feedback = null;
  state.clickedId = null;
  state.hoveredId = null;
  state.answerLocked = false;
  state.selectedAnswer = "";

  if (!state.deck.length && state.retryQueue.length) {
    state.retryStage = true;
    state.deck = shuffle([...new Set(state.retryQueue)]);
    state.retryQueue = [];
  }

  if (!state.deck.length) {
    state.phase = "results";
    state.current = null;
    renderAll();
    return;
  }

  state.current = itemsById.get(state.deck.shift());
  renderAll();
}

function finalizeAnswer(result, payload = {}) {
  if (!state.current || state.answerLocked) return;

  const item = state.current;
  const correct = result === "correct" || result === "typo";
  state.answerLocked = true;
  state.totalAttempts += 1;
  state.clickedId = payload.clickedId || null;
  state.hoveredId = null;

  if (!state.retryStage) {
    state.initialAnswered += 1;
    if (correct) state.initialStats.correct += 1;
    if (result === "wrong") state.initialStats.wrong += 1;
    if (result === "unknown") state.initialStats.unknown += 1;
  }

  if (correct) {
    state.masteredIds.add(item.id);
  } else {
    state.retryQueue.push(item.id);
    if (!state.needsPractice.has(item.id)) {
      state.needsPractice.set(item.id, { item, reason: result === "unknown" ? "unknown" : "wrong" });
    }
  }

  state.history.push({
    id: item.id,
    result,
    retry: state.retryStage,
    answer: payload.answer || "",
    clickedId: payload.clickedId || "",
  });

  state.feedback = createFeedback(result, item, payload);
  renderAll();
}

function createFeedback(result, item, payload) {
  if (result === "correct") {
    return { kind: "good", message: "Richtig." };
  }
  if (result === "typo") {
    return { kind: "warn", message: payload.message || `Akzeptiert. Die Schreibweise ist: ${item.name}.` };
  }
  if (result === "unknown") {
    return { kind: "warn", message: `Die Lösung ist: ${item.name}.` };
  }

  const clicked = payload.clickedId ? itemsById.get(payload.clickedId) : null;
  const clickedText = clicked ? `Du hast ${clicked.name} gewählt.` : `„${payload.answer || ''}“ ist nicht richtig.`;
  return { kind: "bad", message: `${clickedText} Richtig ist: ${item.name}.` };
}

function submitTextAnswer() {
  const answer = state.selectedAnswer.trim();
  if (!answer) return;
  const match = matchAnswer(answer, state.current, data.items);

  finalizeAnswer(match.result, {
    answer,
    message: match.message,
  });
}

function handleMapClick(event) {
  if (suppressNextClick || state.phase !== "quiz") {
    return;
  }

  if (state.mode !== "click" && state.mode !== "practice") {
    return;
  }

  if (state.mode === "click" && (state.answerLocked || !state.current)) {
    return;
  }

  const item = hitTestMarker(event);
  if (!item) {
    showToast("Klicke auf einen Punkt. Du kannst zoomen, wenn Punkte nah beieinander liegen.");
    return;
  }

  chooseMapItem(item);
}

function chooseMapItem(item) {
  if (state.mode === "practice") {
    if (state.revealedIds.has(item.id)) {
      state.revealedIds.delete(item.id);
    } else {
      state.revealedIds.add(item.id);
    }
    renderAll();
    return;
  }

  finalizeAnswer(item.id === state.current.id ? "correct" : "wrong", { clickedId: item.id });
}

function handleMapMove(event) {
  if (dragState || state.phase !== "quiz" || (state.answerLocked && state.mode !== "practice")) return;
  if (state.mode !== "click" && state.mode !== "practice") return;
  const item = hitTestMarker(event);
  const nextId = item?.id || null;
  if (state.hoveredId !== nextId) {
    state.hoveredId = nextId;
    renderMap();
  }
}

function getProgress() {
  if (state.retryStage) {
    const mastered = state.masteredIds.size;
    const total = state.initialTotal || 1;
    return {
      percent: Math.round((mastered / total) * 100),
      label: `${mastered}/${total} sicher`,
    };
  }

  const total = state.initialTotal || 1;
  const currentNumber = Math.min(state.initialAnswered + (state.answerLocked ? 0 : 1), total);
  return {
    percent: Math.round((state.initialAnswered / total) * 100),
    label: `${currentNumber}/${total}`,
  };
}

function updateModeLabel() {
  if (!data) return;
  if (state.phase === "quiz" && state.mode === "practice") {
    elements.mapModeLabel.textContent = "Frei üben";
    return;
  }
  if (state.phase === "quiz" && state.current) {
    elements.mapModeLabel.textContent = state.mode === "click"
      ? "Punkte anklicken"
      : "Markierten Ort benennen";
    return;
  }
  if (state.phase === "results") {
    elements.mapModeLabel.textContent = "Runde abgeschlossen";
    return;
  }
  elements.mapModeLabel.textContent = "Bereit";
}

function renderMap() {
  if (!data || !projector) return;
  if (!baseRendered) elements.baseLayer.replaceChildren();
  elements.studyLayer.replaceChildren();
  elements.hitLayer.replaceChildren();
  elements.highlightLayer.replaceChildren();

  if (!baseRendered) for (const feature of data.baseMap.features) {
    elements.baseLayer.append(svgElement("path", {
      d: pathForGeometry(feature.geometry),
      class: feature.properties?.kind === "lake" ? "base-lake"
        : feature.properties?.kind === "river" ? "base-river"
        : feature.properties?.home ? "base-country base-home" : "base-country",
      "fill-rule": "evenodd",
    }));
  }

  baseRendered = true;

  if (state.phase === "quiz") {
    for (const item of (state.mode === "type" ? selectedItems() : activeMapItems())) {
      renderStudyFeature(item);
    }

    for (const item of activeMapItems()) {
      renderMarker(item);
    }

    const hovered = state.hoveredId ? itemsById.get(state.hoveredId) : null;
    if (state.mode === "practice") {
      for (const item of activeMapItems()) {
        if (state.revealedIds.has(item.id)) {
          renderHighlight(item, "highlight practice-revealed");
          renderMapLabel(item);
        }
      }
      if (hovered && !state.revealedIds.has(hovered.id)) {
        renderHighlight(hovered, "hover-box");
      }
    }

    if (hovered && state.mode === "click" && !state.answerLocked) {
      renderHighlight(hovered, "hover-box");
    }

    if (state.mode === "type" && state.current && !state.answerLocked) {
      renderHighlight(state.current, "highlight");
    }

    if (state.answerLocked && state.current) {
      if (state.clickedId && state.clickedId !== state.current.id) {
        renderHighlight(itemsById.get(state.clickedId), "highlight bad");
      }
      renderHighlight(state.current, state.feedback?.kind === "bad" ? "highlight good" : `highlight ${state.feedback?.kind === "good" ? "good" : ""}`);
      renderMapLabel(state.current);
    }
  }

  applyTransform();
}

function renderLegend() {
  if (!elements.mapLegend || !data || state.phase !== "quiz") {
    if (elements.mapLegend) {
      elements.mapLegend.hidden = true;
      elements.mapLegend.innerHTML = "";
    }
    return;
  }

  const entries = availableTypes()
    .filter((type) => state.selectedTypes.has(type))
    .map((type) => `
      <div class="legend-item">
        ${legendIcon(type)}
        <span>${escapeHtml(data.typeLabels[type])}</span>
      </div>
    `).join("");

  const open = elements.mapLegend.querySelector('details')?.open;
  elements.mapLegend.hidden = false;
  elements.mapLegend.innerHTML = `
    <details ${open ? 'open' : ''}><summary>Legende</summary><div class="legend-list">${entries}</div></details>
  `;
}

function legendIcon(type) {
  const symbol = {
    country: `<circle r="3.7" class="legend-shape"></circle>`,
    city: `<rect x="-4" y="-4" width="8" height="8" rx="1.4" class="legend-shape"></rect>`,
    island: `<path d="M0 -5 L5 3.8 L-5 3.8 Z" class="legend-shape"></path>`,
    region: `<path d="M0 -5.3 L5.3 0 L0 5.3 L-5.3 0 Z" class="legend-shape"></path>`,
    mountain: `<path d="M-6 4.3 L-1.7 -4.7 L1.2 0.2 L3.1 -3.3 L6.2 4.3 Z" class="legend-shape"></path>`,
    water: `<path d="M0 -5.7 C3.5 -1.5 4.9 0.8 4.9 2.8 C4.9 5.4 2.7 6.7 0 6.7 C-2.7 6.7 -4.9 5.4 -4.9 2.8 C-4.9 0.8 -3.5 -1.5 0 -5.7 Z" class="legend-shape"></path>`,
    pass: `<path d="M-6 -4.5 L-1.6 0.6 L0 -0.6 L1.6 0.6 L6 -4.5 L6 4.5 L-6 4.5 Z" class="legend-shape"></path>`,
  }[type === "river" ? "water" : type === "peninsula" ? "island" : type] || "";

  return `
    <svg class="legend-icon marker-${type}" viewBox="-11 -11 22 22" aria-hidden="true" focusable="false">
      <circle r="8" class="legend-ring"></circle>
      ${symbol}
    </svg>
  `;
}

function renderMarker(item) {
  const [x, y] = projector.project(item.anchor);
  const showAsCurrent = (item.id === state.current?.id && (state.mode === "type" || state.answerLocked))
    || (state.mode === "practice" && state.revealedIds.has(item.id));
  const classes = [
    "map-marker",
    `marker-${item.type}`,
    showAsCurrent ? "current" : "",
    item.id === state.hoveredId ? "hovered" : "",
  ].filter(Boolean).join(" ");

  const group = svgElement("g", {
    class: classes,
    "data-item-id": item.id,
    transform: `translate(${x.toFixed(2)} ${y.toFixed(2)})`,
    ...(state.mode !== 'type' && !state.answerLocked ? {
      tabindex: '0', role: 'button',
      'aria-label': `Kartenpunkt ${activeMapItems().indexOf(item) + 1}, ${data.typeLabels[item.type]}`,
    } : {}),
  });
  group.append(svgElement("circle", { r: 7.5, class: "marker-ring" }));
  appendMarkerSymbol(group, item.type);
  elements.hitLayer.append(group);
}

function appendMarkerSymbol(group, type) {
  if (type === "peninsula") type = "island";
  if (type === "river") type = "water";
  if (type === "country") {
    group.append(svgElement("circle", { r: 3.5, class: "marker-symbol" }));
    return;
  }

  if (type === "city") {
    group.append(svgElement("rect", {
      x: -3.8,
      y: -3.8,
      width: 7.6,
      height: 7.6,
      rx: 1.4,
      class: "marker-symbol",
    }));
    return;
  }

  if (type === "island") {
    group.append(svgElement("path", {
      d: "M0 -4.8 L4.7 3.7 L-4.7 3.7 Z",
      class: "marker-symbol",
    }));
    return;
  }

  if (type === "region") {
    group.append(svgElement("path", {
      d: "M0 -5.1 L5.1 0 L0 5.1 L-5.1 0 Z",
      class: "marker-symbol",
    }));
    return;
  }

  if (type === "mountain") {
    group.append(svgElement("path", {
      d: "M-5.7 4.2 L-1.6 -4.5 L1.2 0.2 L3 -3.2 L6 4.2 Z",
      class: "marker-symbol",
    }));
    return;
  }

  if (type === "pass") {
    group.append(svgElement("path", {
      d: "M-5.8 -4.4 L-1.6 0.6 L0 -0.6 L1.6 0.6 L5.8 -4.4 L5.8 4.4 L-5.8 4.4 Z",
      class: "marker-symbol",
    }));
    return;
  }

  group.append(svgElement("path", {
    d: "M0 -5.5 C3.4 -1.4 4.7 0.8 4.7 2.7 C4.7 5.3 2.6 6.5 0 6.5 C-2.6 6.5 -4.7 5.3 -4.7 2.7 C-4.7 0.8 -3.4 -1.4 0 -5.5 Z",
    class: "marker-symbol",
  }));
}

function renderStudyFeature(item) {
  if (item.type === "country" || item.type === "city" || item.geometry.type === "Point") {
    return;
  }

  const path = svgElement("path", {
    d: pathForGeometry(item.geometry),
    class: [
      "study-feature",
      `study-${item.type}`,
      item.geometry.type.includes("Line") ? "study-line" : "study-area",
    ].join(" "),
  });

  elements.studyLayer.append(path);
}

function renderHighlight(item, className) {
  if (!item) return;

  if (item.geometry.type === "Point") {
    const [x, y] = projector.project(item.anchor);
    elements.highlightLayer.append(svgElement("circle", {
      cx: x,
      cy: y,
      r: 14,
      class: `${className} highlight-point`,
    }));
    return;
  }

  const path = svgElement("path", {
    d: pathForGeometry(item.geometry),
    class: `${className} ${item.geometry.type.includes("Line") ? "highlight-line" : ""}`,
    "fill-rule": "evenodd",
  });

  if (item.geometry.type.includes("Line")) {
    path.setAttribute("stroke-width", "9");
  }

  elements.highlightLayer.append(path);
}

function renderMapLabel(item) {
  const [x, y] = projector.project(item.anchor);
  const label = svgElement("text", {
    x,
    y: y - 18,
    class: "map-label",
  });
  label.textContent = item.name;
  elements.highlightLayer.append(label);
}

function hitTestMarker(event) {
  const point = clientPointToContentPoint(event.clientX, event.clientY);
  if (!point) return null;

  const ctm = elements.svg.getScreenCTM();
  const screenScale = ctm ? Math.hypot(ctm.a, ctm.b) : 1;
  let nearest = null;
  let nearestDistance = Infinity;
  for (const item of activeMapItems()) {
    const [x, y] = projector.project(item.anchor);
    const distance = Math.hypot((x - point.x) * state.transform.scale, (y - point.y) * state.transform.scale) * screenScale;
    if (distance < nearestDistance) {
      nearest = item;
      nearestDistance = distance;
    }
  }

  return nearestDistance <= MARKER_HIT_RADIUS ? nearest : null;
}

function clientPointToContentPoint(clientX, clientY) {
  const ctm = elements.svg.getScreenCTM();
  if (!ctm) return null;

  const svgPoint = elements.svg.createSVGPoint();
  svgPoint.x = clientX;
  svgPoint.y = clientY;
  const viewPoint = svgPoint.matrixTransform(ctm.inverse());
  return {
    x: (viewPoint.x - state.transform.x) / state.transform.scale,
    y: (viewPoint.y - state.transform.y) / state.transform.scale,
  };
}

function pathForGeometry(geometry) {
  if (!geometry) return "";

  if (geometry.type === "LineString") {
    return pathForLine(geometry.coordinates);
  }

  if (geometry.type === "MultiLineString") {
    return geometry.coordinates.map(pathForLine).join(" ");
  }

  if (geometry.type === "Polygon") {
    return pathForPolygon(geometry.coordinates);
  }

  if (geometry.type === "MultiPolygon") {
    return geometry.coordinates.map(pathForPolygon).join(" ");
  }

  return "";
}

function pathForLine(line) {
  return projectedLinePath(line, projector);
}

function pathForPolygon(rings) {
  return rings.map((ring) => `${pathForLine(ring)} Z`).join(" ");
}

function wireMapControls() {
  elements.svg.addEventListener('keydown', (event) => {
    const marker = event.target.closest('[data-item-id]');
    if (!marker || state.phase !== 'quiz' || state.answerLocked) return;
    const id = marker.dataset.itemId;
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      chooseMapItem(itemsById.get(id));
      if (state.mode === 'practice') elements.hitLayer.querySelector(`[data-item-id="${id}"]`)?.focus();
    } else if (['ArrowRight', 'ArrowDown', 'ArrowLeft', 'ArrowUp'].includes(event.key)) {
      event.preventDefault();
      const markers = [...elements.hitLayer.querySelectorAll('[tabindex]')];
      const step = ['ArrowRight', 'ArrowDown'].includes(event.key) ? 1 : -1;
      markers[(markers.indexOf(marker) + step + markers.length) % markers.length]?.focus();
    }
  });
  elements.zoomIn.addEventListener("click", () => zoomBy(1.22));
  elements.zoomOut.addEventListener("click", () => zoomBy(0.82));
  elements.zoomReset.addEventListener("click", () => resetZoom());
  elements.svg.addEventListener("click", handleMapClick);
  elements.svg.addEventListener("mousemove", handleMapMove);
  elements.svg.addEventListener("mouseleave", () => {
    if (state.hoveredId) {
      state.hoveredId = null;
      renderMap();
    }
  });

  elements.svg.addEventListener("wheel", (event) => {
    event.preventDefault();
    const factor = event.deltaY < 0 ? 1.08 : 0.92;
    const oldScale = state.transform.scale;
    const newScale = clamp(oldScale * factor, 0.9, 9);

    const { x: cx, y: cy } = clientPointToViewPoint(event.clientX, event.clientY);

    state.transform.x = cx - (cx - state.transform.x) * (newScale / oldScale);
    state.transform.y = cy - (cy - state.transform.y) * (newScale / oldScale);
    state.transform.scale = newScale;
    clampTransform();
    applyTransform();
  }, { passive: false });

  function getPinchDistance() {
    const pts = Array.from(activePointers.values());
    const dx = pts[0].clientX - pts[1].clientX;
    const dy = pts[0].clientY - pts[1].clientY;
    return Math.hypot(dx, dy);
  }

  function getPinchCenter() {
    const pts = Array.from(activePointers.values());
    return {
      x: (pts[0].clientX + pts[1].clientX) / 2,
      y: (pts[0].clientY + pts[1].clientY) / 2,
    };
  }

  elements.svg.addEventListener("pointerdown", (event) => {
    if (event.pointerType === "mouse" && event.button !== 0) return;
    elements.svg.setPointerCapture(event.pointerId);
    activePointers.set(event.pointerId, event);

    if (activePointers.size === 1) {
      dragState = {
        x: event.clientX,
        y: event.clientY,
        startX: state.transform.x,
        startY: state.transform.y,
        moved: false,
      };
      elements.svg.classList.add("dragging");
    } else if (activePointers.size === 2) {
      dragState = null;
      initialPinchDistance = getPinchDistance();
      initialPinchScale = state.transform.scale;
      pinchMoved = false;
    }
  });

  elements.svg.addEventListener("pointermove", (event) => {
    if (!activePointers.has(event.pointerId)) return;
    activePointers.set(event.pointerId, event);

    if (activePointers.size === 2 && initialPinchDistance) {
      const dist = getPinchDistance();
      const scaleDelta = dist / initialPinchDistance;
      const newScale = clamp(initialPinchScale * scaleDelta, 0.9, 9);
      if (Math.abs(dist - initialPinchDistance) > 3) {
        pinchMoved = true;
      }
      
      const center = getPinchCenter();
      const { x: cx, y: cy } = clientPointToViewPoint(center.x, center.y);

      const oldScale = state.transform.scale;
      state.transform.x = cx - (cx - state.transform.x) * (newScale / oldScale);
      state.transform.y = cy - (cy - state.transform.y) * (newScale / oldScale);
      state.transform.scale = newScale;
      clampTransform();
      applyTransform();
      return;
    }

    if (activePointers.size === 1 && dragState) {
      const dx = event.clientX - dragState.x;
      const dy = event.clientY - dragState.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) dragState.moved = true;
      if (!dragState.moved) return;

      const ctm = elements.svg.getScreenCTM();
      const scaleX = 1 / ctm.a;
      const scaleY = 1 / ctm.d;

      state.transform.x = dragState.startX + dx * scaleX;
      state.transform.y = dragState.startY + dy * scaleY;
      clampTransform();
      applyTransform();
    }
  });

  function removePointer(event) {
    activePointers.delete(event.pointerId);
    if (activePointers.size < 2) {
      initialPinchDistance = null;
    }
    if (activePointers.size === 0) {
      if ((dragState && dragState.moved) || pinchMoved) {
        suppressNextClick = true;
        setTimeout(() => { suppressNextClick = false; }, 120);
      }
      dragState = null;
      pinchMoved = false;
      elements.svg.classList.remove("dragging");
    } else if (activePointers.size === 1) {
      const ptr = Array.from(activePointers.values())[0];
      dragState = {
        x: ptr.clientX,
        y: ptr.clientY,
        startX: state.transform.x,
        startY: state.transform.y,
        moved: true,
      };
    }
  }

  elements.svg.addEventListener("pointerup", removePointer);
  elements.svg.addEventListener("pointercancel", removePointer);
}

function zoomBy(factor) {
  const oldScale = state.transform.scale;
  const newScale = clamp(oldScale * factor, 0.9, 9);
  const cx = MAP_WIDTH / 2;
  const cy = MAP_HEIGHT / 2;

  state.transform.x = cx - (cx - state.transform.x) * (newScale / oldScale);
  state.transform.y = cy - (cy - state.transform.y) * (newScale / oldScale);
  state.transform.scale = newScale;
  clampTransform();
  applyTransform();
}

function resetZoom(shouldRender = true) {
  state.transform = { scale: 1, x: 0, y: 0 };
  applyTransform();
  if (shouldRender) renderMap();
}

function clampTransform() {
  const { scale } = state.transform;
  const [minX, maxX] = panRange(MAP_WIDTH, scale, PAN_MARGIN_X);
  const [minY, maxY] = panRange(MAP_HEIGHT, scale, PAN_MARGIN_Y);
  state.transform.x = clamp(state.transform.x, minX, maxX);
  state.transform.y = clamp(state.transform.y, minY, maxY);
}

function panRange(size, scale, margin) {
  const scaledSize = size * scale;

  if (scaledSize <= size) {
    const centeredOffset = (size - scaledSize) / 2;
    return [centeredOffset - margin, centeredOffset + margin];
  }

  return [size - scaledSize - margin, margin];
}

function applyTransform() {
  const { scale, x, y } = state.transform;
  elements.mapContent.setAttribute("transform", `translate(${x} ${y}) scale(${scale})`);
}

function renderToast() {
  if (state.phase === "quiz" && state.retryStage && !state.answerLocked) {
    showToast("Wiederholung: nur Begriffe, die noch nicht sicher waren.", false);
    return;
  }
  if (!elements.toast.dataset.manual) {
    elements.toast.hidden = true;
  }
}

function showToast(message, temporary = true) {
  elements.toast.hidden = false;
  elements.toast.textContent = message;
  if (temporary) {
    elements.toast.dataset.manual = "1";
    clearTimeout(showToast.timeout);
    showToast.timeout = setTimeout(() => {
      delete elements.toast.dataset.manual;
      elements.toast.hidden = true;
    }, 1800);
  } else {
    delete elements.toast.dataset.manual;
  }
}

function renderError(error) {
  elements.panel.innerHTML = `
    <div class="setup-card">
      <div class="setup-title">
        <span>${escapeHtml(config?.title || "Karten-Trainer")}</span>
        <h1>Fehler</h1>
      </div>
      <div class="feedback bad" role="alert">${escapeHtml(error.message)}</div>
      <button class="primary-button" id="retry-load" type="button">Erneut versuchen</button>
    </div>
  `;
  elements.panel.querySelector("#retry-load").addEventListener("click", loadData);
}

function loadTheme() {
  try { return localStorage.getItem('map-trainer-theme') || 'light'; } catch { return 'light'; }
}
function applyTheme() {
  document.documentElement.dataset.theme = state.theme;
  try { localStorage.setItem('map-trainer-theme', state.theme); } catch { /* Storage may be blocked. */ }
}

function svgElement(name, attributes = {}) {
  const element = document.createElementNS("http://www.w3.org/2000/svg", name);
  for (const [key, value] of Object.entries(attributes)) {
    element.setAttribute(key, value);
  }
  return element;
}

function shuffle(values) {
  const copy = [...values];
  for (let index = copy.length - 1; index > 0; index -= 1) {
    const randomIndex = Math.floor(Math.random() * (index + 1));
    [copy[index], copy[randomIndex]] = [copy[randomIndex], copy[index]];
  }
  return copy;
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function escapeAttribute(value) {
  return escapeHtml(value).replace(/'/g, "&#039;");
}

function availableTypes() { return TYPE_ORDER.filter(type => data?.items.some(item => item.type === type)); }
function sourceDetails() {
  return '<details class="source-details"><summary>Kartendaten & Hinweise</summary><p>Made with Natural Earth. Grenzen und Landschaften dienen der Orientierung.</p>'
    + data.sources.map(source => '<p>' + (source.url ? '<a href="' + escapeAttribute(source.url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(source.title) + '</a>' : escapeHtml(source.title)) + '</p>').join('')
    + (data.notes || []).map(note => '<p>' + escapeHtml(note) + '</p>').join('') + '</details>';
}
function clientPointToViewPoint(x, y) {
  const p = elements.svg.createSVGPoint(); p.x = x; p.y = y;
  return p.matrixTransform(elements.svg.getScreenCTM().inverse());
}

    </script>
